      }

      // ─── Files ───────────────────────────────────────────────────────────

      function download(t, url, to) {
        var r = JSON.parse(File({ op: "download", url: url, to: "volume:inbox:" + to }));
        if (!r.ref) throw new Error("download kept no file (HTTP " + r.status + ")");
        t.refs.push(r.ref);

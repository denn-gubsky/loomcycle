      }

      function transcribe(t, ref) {
        var dry;
        try {
          dry = JSON.parse(File({ op: "transcribe", path: ref, dry_run: true }));
        } catch (e) {
          var m = errText(e);
          if (/no media converter|cannot be sent whole/i.test(m)) return { stub: "stt_needs_conversion" };
          if (/not set up|is off|not allowed/i.test(m)) return { stub: "stt_unavailable" };
          throw e;
        }

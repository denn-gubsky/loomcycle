  skybits/import:
    provider: code-js
    description: "Import or re-import one Skybits item into a tenant Document (export or download, extract, headings, import; no model)."
    # The Skybits READ tools an import needs, File (download, extract,
    # transcribe, import, rm), HTTP (File download goes through it), Document,
    # Path, Memory (its manifest row) and Agent (skybits/structure, which the
    # body alone spawns). No Skybits write tool.
    tools: [mcp__skybits__outline_document, mcp__skybits__document_history, mcp__skybits__start_export, mcp__skybits__get_job, mcp__skybits__list_jobs, mcp__skybits__get_file_url, File, HTTP, Document, Path, Memory, Agent]
    # OCR is used on image files only (the body asks for it per call; every
    # other extract says ocr: never). Speech-to-text for recordings, at most
    # 120 minutes per child run; the parent also passes what is left of its own
    # budget.
    transcription:
      ocr: always
      stt: "on"
      max_minutes_per_run: 120
    skills: [-*]
    disable_context: true
    # MAINTENANCE PLUMBING — the session holds document text.
    internal: true
    run_timeout_seconds: 3600
    code: |
      // skybits/import — import or re-import ONE Skybits item, named by id.
      //
      // A deterministic code-js agent spawned only by skybits/sync. Its input names
      // the item and the options; everything else — kind, title, tags, Paths, the
      // listing's view of the item — it re-reads from the item's manifest row, which
      // skybits/sync wrote just before. The Skybits link is built from the id, so the
      // input cannot point the import anywhere else. It writes its own manifest row:
      // a failure keeps what an earlier good pass recorded, so the next run retries.
      //
      // Per kind: a doc is exported as DOCX and a sheet as XLSX; a file is
      // downloaded. Then File extract (headings recovered from formatting for DOCX
      // and HTML, OCR for images), the heading pass (skybits/structure) where the
      // outline is thin, and File import onto the work key "skybits:<id>", which
      // creates the document the first time and re-imports it after. Recordings go
      // through speech-to-text. What cannot become text becomes a SourceStub
      // document: title, provenance and the reason, no body.
      //
      // Input (JSON prompt): {item_id, action, root, structure, include_templates,
      // defer, stt_minutes_left, root_fields?}.

      var SCOPE = "tenant";
      var SOURCE_BASE = "https://skybits.ai/documents/";
      var STRUCTURE_AGENT = "skybits/structure";
      var EXTRACTABLE = ["pdf", "pptx", "docx", "xlsx", "odt", "csv", "tsv", "txt", "md", "html", "htm"];
      var AUDIO = ["mp4", "m4a", "mp3", "wav", "webm", "ogg", "flac"];
      var IMAGES = ["jpg", "jpeg", "png", "gif", "webp"];
      var INFER = ["docx", "html", "htm"];
      var STRUCTURE_FILES = ["pdf", "pptx", "docx", "odt", "html", "htm", "txt", "md"];
      var TRANSIENT = /document service is unavailable|request was never sent|export failed\. please try again|sync before read failed|concurren|too many requests|temporarily unavailable|\b429\b|\b50[0-4]\b|timed out|timeout/i;
      var REAUTH = /must be connected again|needs_reauth|reauth/i;
      var MAX_FAIL = 5;
      var EXPORT_POLLS = 90;
      var SHEET_CELL_CAP = 20000;
      var MIN_OCR_CHARS = 20;
      var COLUMNS = ["item_id", "kind", "title", "url", "tags_json", "primary_path", "paths_json", "updated_at", "revision", "sha256", "document_id", "status", "reason", "last_synced_at", "last_run_id", "fail_count", "source_status", "file_json"];

      function run(input) {
        var P = JSON.parse(String((input && input.prompt) || "").trim() || "{}");
        if (!P.item_id || typeof P.item_id !== "string") throw new Error("skybits/import: item_id is required");
        P.root = P.root || "/skybits";
        P.defer = Array.isArray(P.defer) ? P.defer : [];
        P.structure = P.structure || "always";
        var row = readRow(P.item_id);
        if (!row) throw new Error("skybits/import: no manifest row for item " + P.item_id);
        var snap = parseJSON(row.file_json, null);
        if (!snap) throw new Error("skybits/import: the manifest row of " + P.item_id + " has no listing snapshot");
        var it = { id: row.item_id, kind: row.kind, title: row.title || "untitled", tags: snap.tags || [], updated_at: snap.updated_at || "",
          file: snap.file || null, is_template: !!snap.is_template };
        var paths = parseJSON(row.paths_json, []);
        if (!paths.length && row.primary_path) paths = [row.primary_path];
        paths.forEach(function (p) {
          if (!validPath(p) || p.indexOf(P.root + "/") !== 0) throw new Error("skybits/import: path " + p + " is outside " + P.root);
        });
        var t = { P: P, it: it, row: row, paths: paths, primary: paths[0] || row.primary_path, url: SOURCE_BASE + it.id, refs: [], out: { id: it.id } };

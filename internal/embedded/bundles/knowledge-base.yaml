        }
        if (v.recursive !== undefined) {
          if (typeof v.recursive !== "boolean") { return { error: "recursive must be true or false" }; }
          o.recursive = v.recursive;
        }
        var nums = [["min_body_chars", 0, 100000], ["max_body_chars", 500, 20000], ["max_relations", 0, 20],
                    ["max_calls", 1, 5000], ["max_writes", 1, 10000], ["max_messages", 1, 100]];

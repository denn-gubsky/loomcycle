          Q.documents++;
          var doc = readDocumentOrNull(st, order[j]);
          if (doc === null) { Q.missing++; continue; }
          if (operationalType(doc.type) !== "") { passDocument(st, doc); continue; }
          if (!st.opts.force && !needsWork(st, doc)) { Q.current++; continue; }
          Q.annotated++;
          passDocument(st, doc);
        }
      }

      // sweepMode walks every document of the scope (or under under_path) that needs
      // work: those never annotated first, then the least recently written.
      function sweepMode(st) {

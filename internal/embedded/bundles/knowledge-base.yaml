      // drainMode annotates the documents the ingest queue names, newest first. It
      // reads every retained message from the oldest without acknowledging any (the
      // queue's position belongs to the links agent), and works on the documents that
      // need it, up to max_messages of them.
      function drainMode(st) {
        var Q = { channel: CONFIG.ingest_channel, read: 0, documents: 0, current: 0, annotated: 0, missing: 0, empty: false, acked: 0 };
        st.queue = Q;
        var order = [];
        var seen = {};
        var cursor = "cur_0";
        while (Q.read < CONFIG.queue_scan_max) {
          st.tool_calls++;
          var res = Channel.await({ channels: [CONFIG.ingest_channel], mode: "any", max_messages: CONFIG.queue_page, wait_ms: 0, from_cursor: cursor });
          var slot = (isPlainObject(res) && isPlainObject(res.results)) ? res.results[CONFIG.ingest_channel] : null;
          var msgs = (isPlainObject(slot) && isArray(slot.messages)) ? slot.messages : [];

        }
        if (v.path !== undefined) {
          if (!isPath(v.path)) { return { error: "path must be an absolute Path-tree path" }; }
          o.path = v.path;
        }
        if (v.under_path !== undefined) {
          if (!isPath(v.under_path)) { return { error: "under_path must be an absolute Path-tree path" }; }
          o.under_path = v.under_path;
        }
        if (o.mode === "document") {
          if ((o.document_id === "") === (o.path === "")) {
            return { error: "document mode needs exactly one of document_id and path" };
          }
        } else if (o.mode === "path") {
          if (o.path === "" || o.document_id !== "") {
            return { error: "path mode needs path (a folder) and no document_id" };
          }
        } else if (o.document_id !== "" || o.path !== "") {
          return { error: o.mode + " mode takes no document_id or path" };
        }
        if (o.under_path !== "" && o.mode !== "sweep") {
          return { error: "under_path is taken by sweep mode only" };
        }
        if (o.recursive && o.mode !== "path") {

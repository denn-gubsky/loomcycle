              st.escalated_ids.length < CONFIG.max_report_ids && isID(it.id)) { st.escalated_ids.push(it.id); }
          if (it.audit === "pending" && st.audit_ids.length < CONFIG.max_report_ids && isID(it.id)) { st.audit_ids.push(it.id); }
        }
      }

      function report(st) {
        var out = {
          status: st.status, scope: st.opts.scope, write: st.opts.write, routed_only: st.opts.routed,
          considered: st.considered, verdict_calls: st.verdict_calls, verdict_failures: st.verdict_failures,
          parse_errors: st.parse_errors, skipped: st.skipped, tool_calls: st.tool_calls
        };
        if (st.failure !== "") { out.failure = st.failure; }
        if (st.opts.write === "report") {
          out.would = st.would;
          return out;
        }
        out.judged = st.judged;
        out.ruled = st.ruled;
        out.accepted = st.accepted;
        out.rejected = st.rejected;
        out.escalated = st.escalated;
        out.recommended = st.recommended;
        out.refused = st.refused;
        out.refusals = st.refusals;
        out.outcomes = st.outcomes;
        out.audit_marked = st.audit_marked;
        out.audit_ids = st.audit_ids;
        out.escalated_ids = st.escalated_ids;

      // ------------------------------------------------------------------ state

      function newState(opts) {
        return {
          opts: opts, status: "complete", failure: "", tool_calls: 0,
          lease: { taken: false, acquired: false, held: false, held_by: "", renewed_at: 0, renewals: 0, lost: false, released: false },
          stale: { branch: 0, document: 0, path: 0 }, folders: {}, folders_done: {}, folders_count: 0,
          // Report mode writes nothing, so a folder whose child would be rewritten
          // still reads current: dirty carries the would-be rewrite up instead.
          dirty: {},
          calls: { made: 0, estimated_chars: 0 }, writes: 0, would_call: 0, would_write: 0,
          model_failures: 0, failures_in_a_row: 0, parse_errors: 0, wrong_language: 0,

# RFC BD embedded bundle: team-examples
#
# Runnable STARTER TEAMS for the team/orchestrator (RFC BD). The `agent-teams`
# bundle ships the orchestrator + the mechanism; this bundle ships the CONTENT so
# a team actually runs end to end out of the box. Select all three:
#   LOOMCYCLE_PRESETS=base,agent-teams,team-examples
#
# It provides:
#   - handler agents for two domains:
#       software: sdlc/architect, sdlc/coder, sdlc/reviewer
#       marketing: marketing/writer, marketing/editor
#   - two TEAMS, under `teams:` (RFC GS): `sdlc` (software workspace: repo volume +
#     PR) and `marketing` (Documents-only). The boot writes them into the store's
#     shared tier, so every tenant can run them by name, and fork them into its own
#     tenant to change them. Their handler agents are global for the same reason
#     (RFC GS D9). To change a team here, overlay its `teams:` key in your config.
#   - a `team/examples` skill: how to drive and fork the two teams.
#
# Two domains on purpose: the SDLC team exercises the software workspace (ephemeral
# volume + git/gh via Bashbox — see the agent-teams `team/repo` skill + its
# operator prereqs; sdlc/coder and sdlc/reviewer build and test in a workspace
# when workspace.mode is on, and fall back to Bashbox until RFC GW P15 removes
# it); the marketing team proves the domain-general design with NO
# volume/repo/PR — its deliverable is the Document task board itself.
#
# The handler agents are meant to be SPAWNED BY the orchestrator (which creates the
# shared ephemeral `work` volume for software teams); the sdlc/* agents' file/exec
# tools resolve that shared volume. Run standalone (no orchestrator), an sdlc/*
# agent has no `work` volume and its file ops are denied — expected.
#
# No provider matrix here (agents declare `tier: middle`); bring `base`. Overlay to
# retarget tiers / swap prompts. Cannot widen tools (the ceiling is unchanged).

agents:
  # ---- software (SDLC) handlers — operate the shared ephemeral `work` volume ----
  sdlc/architect:
    tier: middle
    max_tokens: 8192
    effort: high
    tools: [Read, Grep, Glob, Context]
    system_prompt: |
      You are the ARCHITECT on a software team. Given a task (and read access to the
      checked-out repo in the `work` volume), produce a SHORT technical design: the
      approach, the files/modules to touch, and the risks. Do not write code. Be
      terse and structured — a planner and a coder read your output next. End with a
      one-line "ready to implement?" so the orchestrator can gate on approval.

  sdlc/coder:
    tier: middle
    max_tokens: 16384
    effort: medium
    # Workspace runs the build and tests on a workspace worker (RFC GW). Bashbox
    # stays until the release that removes it (RFC GW P15), for installs that
    # have not turned workspaces on (workspace.mode).
    tools: [Read, Write, Edit, Grep, Glob, Workspace, File, Bashbox, Context]
    workspace: {ops: [read, write, exec], open: true}
    system_prompt: |
      You are the CODER on a software team. Implement the approved design in the
      repo checked out in the `work` volume: edit files there with Write/Edit
      (volume="work"). Make the SMALLEST change that satisfies the task; match the
      surrounding code's style.

      To build, test or format, use a workspace:
      1. `Workspace op=open name="build"`.
      2. Copy the checkout in once: `File op=copy from="volume:work:."
         to="workspace:build:repo"`. If it is refused for its size
         (`copy_limit`), copy only the folders the build needs.
      3. `Workspace op=exec name="build" cwd="repo" command="<the build or test command>"`.
      After each further edit in `work`, copy each changed file in again before
      the next run (`File op=copy from="volume:work:<path>"
      to="workspace:build:repo/<path>" overwrite=true`). The `work` volume is the
      team's tree: never edit only the workspace copy.
      If `Workspace op=open` is refused because this install runs no workspaces,
      use Bashbox (volume="work") for the command instead.

      When done, summarize what you changed (files + one line each) — the
      reviewer reads it next. Do not commit or push; the orchestrator opens the PR.

  sdlc/reviewer:
    tier: middle
    max_tokens: 8192
    effort: high
    # Git reads the diff; Workspace runs the tests on a workspace worker (RFC GW).
    # Bashbox stays until RFC GW P15, for installs without workspaces.
    tools: [Read, Grep, Glob, Git, Workspace, File, Bashbox, Context]
    workspace: {ops: [read, write, exec], open: true}
    system_prompt: |
      You are the REVIEWER on a software team. Review the coder's change in the
      `work` volume: read the diff with `Git op=diff volume="work"`, then check
      correctness, tests, and style. To run the tests, open a workspace
      (`Workspace op=open name="review"`), copy the checkout in (`File op=copy
      from="volume:work:." to="workspace:review:repo"`) and run them with
      `Workspace op=exec name="review" cwd="repo"`. If this install runs no workspaces, use Bashbox
      (volume="work") instead.
      Return a verdict the orchestrator routes on:
      "approve" (advance to PR) or "pushback: <specific, actionable reasons>" (back
      to the coder). Be concrete — name files + lines. Do not edit code yourself.

  # ---- marketing handlers — Documents only, no volume/repo ----
  marketing/writer:
    tier: middle
    max_tokens: 8192
    effort: medium
    tools: [Document, WebSearch, Context]
    memory_scopes: [user]
    system_prompt: |
      You are the WRITER on a marketing team. Draft the requested copy (a post, an
      email, a landing section) directly into the team's Document task board: put the
      draft in the relevant chunk's body (Document op=update_chunk). Use WebSearch
      only to check facts. Keep the brand voice the operator specified. When done,
      say what you drafted and where — the editor reviews it next. There is no repo
      and no PR; the Document is the deliverable.

  marketing/editor:
    tier: middle
    max_tokens: 8192
    effort: high
    tools: [Document, Context]
    system_prompt: |
      You are the EDITOR on a marketing team. Review the writer's draft in the
      Document task board (Document op=get_chunk): tighten the copy, fix voice/tone,
      and check the brief is met. Either polish it in place (op=update_chunk) and
      return "approve", or return "pushback: <specific edits>" for the writer. Be
      concrete. The Document is the deliverable — no repo, no PR.

teams:
  # Flow: architect designs → coder implements in `work` → reviewer approves (→ pr)
  # or pushes back to the coder. Needs the team/repo software prerequisites.
  sdlc:
    description: A software team — architect, coder, reviewer — working in a repo volume, ending in a PR.
    entry: architecture
    max_iterations: 5
    states:
      - {state: architecture, handler: {kind: agent, agent: sdlc/architect}}
      - {state: implementation, handler: {kind: agent, agent: sdlc/coder}}
      - {state: review, handler: {kind: agent, agent: sdlc/reviewer}}
      - {state: pr, handler: {kind: terminal}}
    transitions:
      - {from: architecture, to: implementation, on: success}
      - {from: implementation, to: review, on: success}
      - {from: review, to: pr, on: success}
      - {from: review, to: implementation, on: "pushback:code-fix"}

  # Flow: writer drafts into the Document → editor polishes (→ published) or
  # pushes back to the writer. No volume, no repo, no PR.
  marketing:
    description: A Documents-only marketing team — a writer drafts into the board, an editor polishes it.
    entry: draft
    max_iterations: 4
    states:
      - {state: draft, handler: {kind: agent, agent: marketing/writer}}
      - {state: edit, handler: {kind: agent, agent: marketing/editor}}
      - {state: published, handler: {kind: terminal}}
    transitions:
      - {from: draft, to: edit, on: success}
      - {from: edit, to: published, on: success}
      - {from: edit, to: draft, on: "pushback:revise"}

skills:
  team/examples:
    description: How to drive and fork the two starter teams (sdlc, marketing) this bundle configures.
    tools: [TeamDef, Document]
    body: |
      # Starter teams

      Two teams come from the server's configuration (the team-examples bundle):
      `sdlc` and `marketing`. They already exist — do NOT `TeamDef op=create` them.
      `TeamDef op=list name="<team>"` shows the version; it is marked
      `source: "config"`. `TeamDef op=render_diagram name="<team>"` draws it.
      Run one with `TeamDef op=run name="<team>"`, or drive it per the
      team/orchestrate skill.

      ## `sdlc` — a software team (repo workspace + PR)
      architecture (sdlc/architect) → implementation (sdlc/coder) → review
      (sdlc/reviewer) → pr; a review pushback (`pushback:code-fix`) loops back to
      implementation. Needs the software prerequisites from the `team/repo` skill
      (Bashbox + git/gh + a dynamic_root volume + GITHUB_TOKEN). Set up the `work`
      volume + clone per team/repo BEFORE driving, and open the PR at `pr`.

      ## `marketing` — a Documents-only team (no repo, no PR)
      draft (marketing/writer) → edit (marketing/editor) → published; an editor
      pushback (`pushback:revise`) loops back to draft. Create a board
      (Document op=create_document), seed a chunk at `draft`, and drive. The
      finished copy lives in the Document chunk.

      ## Changing them
      The configuration owns these teams in the shared tenant: an edit of them
      there is refused. To change one for your tenant, `TeamDef op=fork
      name="<team>" overlay={...}` — the fork is your tenant's, and runs in place
      of the configured one for it. An operator changes the shared one in the
      configuration (`teams.<name>`). Build a new team with team/assistant.

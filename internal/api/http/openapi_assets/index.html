<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>loomcycle data API — reference</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/v1/docs/swagger-ui.css">
  <style>
    body { margin: 0; background: #fafafa; }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="/v1/docs/swagger-ui-bundle.js"></script>
  <script>
    // Self-contained Swagger UI (no CDN). Points at the spec this same server
    // serves. Use "Authorize" to paste a bearer for the "Try it out" console.
    window.onload = function () {
      window.ui = SwaggerUIBundle({
        url: '/v1/openapi.json',
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [SwaggerUIBundle.presets.apis],
        layout: 'BaseLayout'
      });
    };
  </script>
</body>
</html>

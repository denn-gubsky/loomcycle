name: Publish @loomcycle/explorer to npm

# The @loomcycle/explorer React component (RFC AZ — the Path/Document twin of
# @loomcycle/library) is versioned INDEPENDENTLY of the Go binary + the
# @loomcycle/client SDK (each host pins its own client), so it publishes on its
# OWN tag namespace `explorer-v*` (e.g. `explorer-v0.1.0`) — mirroring
# @loomcycle/library's `library-v*` and the python adapter's `python-v*`, NOT
# the binary's `v*`.
#
# Safety: the workflow HARD-FAILS if packages/explorer/package.json's version
# doesn't match the tag (a dedicated tag should always match — a mismatch is a
# mistake, surfaced loudly, npm untouched).
#
# Auth: npm Trusted Publishing (OIDC). The package's npm Access tab names this
# repository and this workflow file as its trusted publisher; npm exchanges the
# job's GitHub OIDC token (id-token: write) for a short-lived publish token, so
# no npm token is stored in the repository. Trusted Publishing needs npm CLI
# 11.5.1 or later, hence the upgrade step below.
#
# Provenance: `npm publish --provenance` works with token auth too. npm signs a
# SLSA provenance statement through the job's GitHub OIDC token (id-token: write)
# and shows it on the package page; package.json's `repository` must name this
# repository, or the publish is refused.
#
# Inputs reaching `run` steps are limited to GITHUB_REF_NAME (a git tag — git
# rejects metacharacters in ref names) and constants; the tag is routed through
# `env:` per the GitHub workflow-injection guidance.
on:
  push:
    tags:
      - "explorer-v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  publish:
    name: Publish @loomcycle/explorer
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm publish --provenance signs its provenance statement through the
      # job's GitHub OIDC token, which also authenticates the publish (Trusted Publishing).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: packages/explorer/package-lock.json

      - name: Upgrade npm CLI for Trusted Publishing
        # npm 11.5.1+ negotiates the OIDC exchange; npm 11 still runs on Node 20.
        run: npm install -g npm@^11.5.1

      - name: Verify package version matches tag
        working-directory: packages/explorer
        # Strip the `explorer-v` prefix — npm versions don't carry it. A dedicated
        # tag should always match the package version; a mismatch is a mistake.
        env:
          TAG_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PKG_VER=$(node -p "require('./package.json').version")
          TAG_VER="${TAG_REF#explorer-v}"
          if [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "::error::packages/explorer/package.json version ($PKG_VER) does not match tag ($TAG_VER). Bump the package.json to $TAG_VER and re-tag, or fix the tag."
            exit 1
          fi
          echo "::notice::Publishing @loomcycle/explorer@$PKG_VER (tag $TAG_REF)"

      - name: Install
        working-directory: packages/explorer
        run: npm ci

      - name: Build
        working-directory: packages/explorer
        run: npm run build:lib

      - name: Test
        working-directory: packages/explorer
        run: npm test

      - name: Publish
        working-directory: packages/explorer
        # --access public for the scoped package. prepack rebuilds dist from a
        # clean tree, so the published tarball is fresh regardless. --provenance
        # attaches the signed build provenance (see the header).
        run: npm publish --access public --provenance

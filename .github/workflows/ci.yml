name: CI

on:
  push:
    branches: [main]
  pull_request:

# Run JavaScript-based actions (checkout, setup-go, setup-node, …) on
# Node.js 24. GitHub forces this default on 2026-06-16 and removes Node 20
# from runners on 2026-09-16; this opt-in clears the Node-20 deprecation
# warning now, across every action, without per-action major-version bumps.
# Safe to delete once Node 24 is the runner default.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  changes:
    # Which parts of the tree a pull request touches (RFC EX Phase 1). Every
    # job below waits for this and is skipped when its part is untouched; on
    # main every output is true. scripts/ci/changes.sh says how each is decided.
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.c.outputs.go }}
      runtime: ${{ steps.c.outputs.runtime }}
      web: ${{ steps.c.outputs.web }}
      ts: ${{ steps.c.outputs.ts }}
      python: ${{ steps.c.outputs.python }}
      bridges: ${{ steps.c.outputs.bridges }}
      proto: ${{ steps.c.outputs.proto }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: true
      - name: Classify the change
        id: c
        run: scripts/ci/changes.sh >> "$GITHUB_OUTPUT"

  go:
    name: Go ${{ matrix.go-version }}
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26.x"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          # The runner caches an older patch; take the newest so a stdlib fix lands.
          check-latest: true
          cache: true

      # Tidy, verify, vet, build and gofmt cover each in-tree Go module (RFC
      # FE): the root and every module the root go.mod replaces with a
      # directory in the tree (scripts/ci/modules.sh). Run from the root,
      # go vet ./... and friends stop at a nested go.mod and skip that module
      # without a word.
      #
      # Tidy may create a go.sum a module never had, which git diff does not
      # show, so untracked module files fail the check too.
      - name: Tidy check
        run: |
          scripts/ci/in-modules.sh go mod tidy
          git diff --exit-code -- '*go.mod' '*go.sum'
          untracked=$(git ls-files --others --exclude-standard -- '*go.mod' '*go.sum')
          if [ -n "$untracked" ]; then
            echo "::error::go mod tidy created files that are not committed:"
            echo "$untracked"
            exit 1
          fi

      # The module cache the build uses matches go.sum: a tampered or
      # corrupted download in the cache fails here instead of being built.
      - name: Verify modules
        run: scripts/ci/in-modules.sh go mod verify

      - name: Vet
        run: scripts/ci/in-modules.sh go vet ./...

      # The binary links every package it imports, nested modules' included;
      # each nested module is also compiled whole, for its packages the
      # binary does not import.
      - name: Build
        run: |
          go build -o bin/loomcycle ./cmd/loomcycle
          nested=$(scripts/ci/modules.sh | tail -n +2)
          for dir in $nested; do
            (cd "$dir" && go build ./...)
          done

      - name: Bashbox escape suite
        # Bashbox's isolation is gbash's, and gbash is pre-1.0, so its escape
        # suite is a named gate (RFC ES #10). It runs on every PR rather than
        # only when go.mod's gbash line changes: it takes well under a minute,
        # a path filter would miss a bump that arrives another way, and a
        # change to bashbox.go can weaken containment just as well. The
        # target fails if any case is skipped, so a runner missing git, curl,
        # env or printenv cannot pass it vacuously. The race shards run the
        # same tests again under -race.
        run: make bashbox-escape

      # gofmt walks files, not modules, so `.` already covers every module.
      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

  go-race:
    # The race suite, split across runners (RFC EX Phase 1). On one 4-core
    # runner it took ~15 min, set by internal/api/http and
    # internal/tools/builtin: each is ~2,100 tests that run one after another,
    # so more cores did not help and a shard of their own is still their whole
    # length. Each is split by test name (scripts/ci/split-tests.sh deals the
    # sorted names round-robin, so every test lands in exactly one part). The
    # next heaviest (cmd/loomcycle, the sqlite store, snapshot) share a shard,
    # and every other package runs in the last. Sized from the first sharded
    # run: api/http halves ran 381s, builtin halves 291s, the rest 553s. A pull
    # request runs only the packages its change can reach, and a shard left
    # with none is skipped.
    name: Go race (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: api/http 1/3
            within: ./internal/api/http/
            split: 1/3
          - shard: api/http 2/3
            within: ./internal/api/http/
            split: 2/3
          - shard: api/http 3/3
            within: ./internal/api/http/
            split: 3/3
          - shard: tools/builtin 1/2
            within: ./internal/tools/builtin/
            split: 1/2
          - shard: tools/builtin 2/2
            within: ./internal/tools/builtin/
            split: 2/2
          - shard: cmd, store, snapshot
            within: ./cmd/... ./internal/store/... ./internal/snapshot/...
          - shard: rest
            within: ./...
            # Every package a shard above names, or it runs twice.
            without: ./internal/api/http/ ./internal/tools/builtin/ ./cmd/... ./internal/store/... ./internal/snapshot/...
    steps:
      - uses: actions/checkout@v7
        with:
          # Two commits: the pull request's merge commit and its first parent,
          # which scripts/ci/select-packages.sh diffs against.
          fetch-depth: 2

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          # The runner caches an older patch; take the newest so a stdlib fix lands.
          check-latest: true
          cache: true

      # A pull request tests only the packages whose tests can see its change;
      # main tests everything. The job log lists each selected package and why.
      - name: Select packages
        id: sel
        env:
          WITHIN: ${{ matrix.within }}
          WITHOUT: ${{ matrix.without }}
        run: echo "pkgs=$(scripts/ci/select-packages.sh "$WITHIN" "$WITHOUT")" >> "$GITHUB_OUTPUT"

      - name: Test (race detector)
        if: steps.sel.outputs.pkgs != ''
        # Per-package timeout. `-race` instrumentation runs several-fold slower,
        # and `go test ./...` runs package binaries concurrently, so on a
        # CPU-constrained CI runner the largest suites contend for cores. This
        # was bumped 120s→300s→900s as the codebase grew, each time after the
        # largest suite crossed the previous deadline under CI contention.
        #
        # 900s→1800s for the same reason, and the note above that "no package
        # should approach it" had already stopped being true: on main,
        # internal/tools/builtin measured 676s → 850s → 875s → 877s over
        # successive runs and then timed out twice, at 96% of budget before it
        # finally crossed. A deadline that a suite sits against does not fail
        # honestly — it fails on whichever run the runner happened to be busy.
        #
        # IT IS NOT ONE SLOW TEST. Measured locally under -race: the package is
        # 496s across 1010 test functions, the slowest single test is 4.1s, and
        # the top twenty account for 29s — 6% of the total. It is a thousand
        # tests that each provision a real store, and a deadline is the wrong
        # tool for that conversation. (The store provisioning turned out to be
        # the whole cost; see the -gcflags note at the end.)
        #
        # A timeout here is also WORSE than an ordinary failure, which is the
        # real argument for headroom: the deadline kills tests mid-flight, so
        # `FAIL ... 900.043s` arrives with ZERO `--- FAIL` lines and reads like
        # a hung test rather than an exhausted budget. (The postgres store step
        # below carries the same note, having learned it first.) A genuinely
        # hung test still fails, just later.
        #
        # 1800s→3600s, the same step the Postgres store tests took: by late
        # September both of the two largest packages sat on the deadline.
        # internal/api/http hit 1800.07s — a timeout, not a failing test — on
        # three PRs in a row (#1471, #1474, #1475) whose changes did not touch
        # it, while internal/tools/builtin finished at 1744s / 1755s / 1795s
        # (99.7% of budget). Locally under -race each takes ~900-1150s; the CI
        # runner is roughly 1.6x slower with the packages contending for cores.
        #
        # WHAT THE THOUSAND TESTS WERE ACTUALLY PAYING FOR: the SQLite engine.
        # modernc.org/sqlite is C transpiled to Go, and -race instruments every
        # memory access in it, so opening a fresh store (the schema migration,
        # a few hundred statements) costs ~1.0s under -race against ~0.09s with
        # the engine left uninstrumented. The median test in both packages took
        # 0.95s: almost all of it was that one Open. The -gcflags below compile
        # modernc.org/... WITHOUT race instrumentation while every package of
        # ours keeps it. Measured locally, same tests, same pass/skip counts:
        # internal/api/http 1008s -> 130s, internal/tools/builtin 1111s -> 112s.
        #
        # What this gives up: a race whose BOTH sides are inside the SQLite
        # engine's own code, or one where our code mutates a buffer while the
        # engine reads it. database/sql hands a connection to one goroutine at
        # a time, so the first is the driver's bug to find, not ours. A race
        # between two of our goroutines is still reported (checked with a
        # deliberate race under these exact flags: `WARNING: DATA RACE`, test
        # FAILs). Drop the -gcflags to get the old coverage back;
        # it costs ~8x in wall-clock, nothing else.
        env:
          # The symlink swap-race tests (RFC ES #1) skip where the filesystem
          # has no atomic rename exchange. CI must run them, not skip them.
          LOOMCYCLE_TEST_REQUIRE_EXCHANGE: "1"
          PKGS: ${{ steps.sel.outputs.pkgs }}
          SPLIT: ${{ matrix.split }}
        run: |
          flags=(-race '-gcflags=modernc.org/...=-race=false')
          run=()
          if [ -n "$SPLIT" ]; then
            # shellcheck disable=SC2086 # one package in a split shard
            run=(-run "$(scripts/ci/split-tests.sh $PKGS "$SPLIT" "${flags[@]}")")
          fi
          # in-modules.sh runs each package from its own module's directory.
          # shellcheck disable=SC2086 # PKGS is a space-separated list
          scripts/ci/in-modules.sh go test "${flags[@]}" -timeout 3600s "${run[@]}" -- $PKGS


  go-postgres:
    # Named for the TIERS it gates, not just the store contract: this job now
    # owns three PG-only surfaces (store contract, coordination tier, SQL
    # Memory), and a red check named "store contract" sends the next person
    # debugging a coord or sqlmem regression to the wrong package. The job KEY
    # stays go-postgres.
    name: Go (Postgres ${{ matrix.title }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    # Three legs in parallel, each with its own Postgres container, so the
    # job takes as long as its longest leg rather than the sum of its steps.
    # Run as one, it was ~8.9 min and the slowest job in CI: store contract
    # 214s, snapshot 107s, SQL Memory 52s, coordination 44s, canary 34s,
    # replicas 28s. Each step below runs in exactly one leg (its
    # matrix.group condition); the setup steps run in every leg.
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: store
            title: store contract
          - group: snapshot
            title: snapshot, canary, replicas
          - group: tiers
            title: coordination, SQL Memory
    # Runs the shared storetest contract against a REAL Postgres so
    # backend-parity bugs are caught in CI, not only on SQLite. The contract
    # skips the PG path unless LOOMCYCLE_TEST_PG_DSN is set, so before this job
    # the production backend went untested — which hid the operator-token
    # nullable-column NULL-scan bug (admin-minted tokens fail-closed 401 on PG)
    # and a jsonb re-serialization brittleness. Postgres is what ships; CI must
    # exercise it.
    services:
      postgres:
        # pgvector image (postgres 16 + pgvector) so the SQL Memory vector-column
        # tests (Phase 3c) run on real pgvector, not only the base store contract.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: loomcycle
          POSTGRES_PASSWORD: loomcycle
          POSTGRES_DB: loomcycle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loomcycle -d loomcycle_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          # The runner caches an older patch; take the newest so a stdlib fix lands.
          check-latest: true
          cache: true

      # Each step below tests a fixed package set. On a pull request each set is
      # narrowed to the packages the change can reach, and a step whose set is
      # empty is skipped; on main every set runs whole (RFC EX Phase 1).
      - name: Select packages
        id: sel
        run: |
          {
            echo "store=$(scripts/ci/select-packages.sh ./internal/store/...)"
            echo "snapshot=$(scripts/ci/select-packages.sh ./internal/snapshot/...)"
            echo "canary=$(scripts/ci/select-packages.sh ./internal/api/http/)"
            echo "replicas=$(scripts/ci/select-packages.sh ./cmd/loomcycle/)"
            echo "coord=$(scripts/ci/select-packages.sh ./internal/coord/...)"
            echo "sqlmem=$(scripts/ci/select-packages.sh ./internal/sqlmem/...)"
            echo "builtin=$(scripts/ci/select-packages.sh ./internal/tools/builtin/...)"
          } >> "$GITHUB_OUTPUT"

      # The pgvector ROUND-TRIP contract (set + search + ordering + dimension
      # handling + CASCADE) is opt-in behind LOOMCYCLE_TEST_PG_VECTOR, and it was
      # never enabled here — so the whole vector suite, including the pre-existing
      # dimension-mismatch test, skipped in CI even though the service image below
      # is already pgvector/pgvector. A mixed-dimension search bug reached main
      # because of that. The service image needs the extension CREATEd once; the
      # per-test schemas keep `public` on their search_path so the unqualified
      # `vector` type in migration 0017 resolves.
      # Every leg: the store contract enables pgvector with it, and the tiers
      # leg provisions its coordination and SQL Memory databases with it.
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Enable pgvector for the store contract
        env:
          PGPASSWORD: loomcycle
        run: |
          psql -h 127.0.0.1 -U loomcycle -d loomcycle_test -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Postgres store contract
        if: matrix.group == 'store' && steps.sel.outputs.store != ''
        env:
          LOOMCYCLE_TEST_PG_DSN: postgres://loomcycle:loomcycle@127.0.0.1:5432/loomcycle_test?sslmode=disable
          LOOMCYCLE_TEST_PG_VECTOR: "1"
          PKGS: ${{ steps.sel.outputs.store }}
        # Explicit -timeout. This step had NONE, so it inherited Go's 600s default
        # while the postgres contract already ran ~497s locally on an idle box —
        # 83% of the budget, before pgvector was even enabled above. One added
        # contract test pushed it past 600s, and the failure is maximally confusing:
        # `FAIL ... 600.6s` with ZERO `--- FAIL` lines reads like a hung test rather
        # than an exhausted deadline. Every case still passed given time.
        #
        # 3600s because this suite is inherently slow (a per-test schema, migrated
        # from scratch, against a real database) and CI contention makes it slower
        # still. A genuinely hung test fails, just later.
        #
        # RAISED FROM 1800s after it tripped on main at 0f57ad96, on a commit whose
        # entire diff was three files in internal/api — this job runs only
        # ./internal/store/..., so the code under test was byte-identical to the run
        # that passed 20 minutes earlier. It was contention: that merge and the one
        # before it started 13 SECONDS apart, so two runs raced with a Postgres
        # service container each.
        #
        # The measured spread is the argument. Typical is 9-11 min, but 40b6ced3 took
        # 28 and 0f57ad96 blew past 30 — roughly 3x variance on shared runners against
        # a cap with no headroom left. 3600s is ~2x the worst observed, and a real
        # deadlock still fails within the hour.
        #
        # Note the timeout is PER PACKAGE BINARY, not per step: what hit the cap is
        # internal/store/postgres alone (`FAIL ... 1800.007s`). Raising it does not
        # slow a green run by one second — nothing waits on this number.
        #
        # A timeout here is also WORSE than a normal failure, which is the real
        # argument for the headroom: the deadline kills tests mid-flight so their
        # cleanups never drop their schemas, and the schema name is
        # lct_<test-name-truncated-to-40>_<counter> where the counter restarts at 1
        # in each process. So the next run against the same database regenerates the
        # same names and dies on "schema already exists" — a timeout does not just
        # fail, it poisons the database for the following run in a way that looks
        # like an unrelated bug.
        run: scripts/ci/in-modules.sh go test -count=1 -timeout 3600s -- $PKGS

      # SNAPSHOT COVERAGE, postgres half. The snapshot guards read the table set
      # from a freshly migrated schema on EACH backend (every table classified,
      # no classification naming a missing table) and search a captured envelope
      # for planted secrets. The `Go` job has no LOOMCYCLE_TEST_PG_DSN, so there
      # the postgres half skips — a pass that proves nothing about the backend
      # with postgres-only tables (replicas, runtime_state, user_quotas,
      # memory_embeddings). This step is what makes it a gate.
      #
      # The WHOLE package rather than a -run filter: a filter silently leaves
      # out the next postgres-parameterised test added here, and the package is
      # seconds long. Per-test schemas are prefixed snapcov_ with a clock
      # component, so they cannot collide with the store contract's lct_ ones.
      # !cancelled() so a red store contract does not skip this gate.
      - name: Snapshot coverage guard (Postgres)
        if: ${{ !cancelled() && matrix.group == 'snapshot' && steps.sel.outputs.snapshot != '' }}
        env:
          LOOMCYCLE_TEST_PG_DSN: postgres://loomcycle:loomcycle@127.0.0.1:5432/loomcycle_test?sslmode=disable
          PKGS: ${{ steps.sel.outputs.snapshot }}
        run: scripts/ci/in-modules.sh go test -count=1 -timeout 600s -- $PKGS

      # NO-TRACE CANARY (Postgres). A no-trace run must leave its content in no
      # table. The canary suite runs on both store backends, and without a DSN
      # its postgres half skips — and Postgres is where it found something
      # sqlite could not: event payloads are bytea there, and a search that
      # looked for the plain string walked straight past them.
      #
      # A -run filter here, unlike the step above: the rest of this package is
      # the whole HTTP API on sqlite and already runs in the `Go` job. Per-test
      # schemas are prefixed canary_. !cancelled() so it gates on its own.
      - name: No-trace canary (Postgres)
        if: ${{ !cancelled() && matrix.group == 'snapshot' && steps.sel.outputs.canary != '' }}
        env:
          LOOMCYCLE_TEST_PG_DSN: postgres://loomcycle:loomcycle@127.0.0.1:5432/loomcycle_test?sslmode=disable
        run: go test -count=1 -timeout 600s -run 'TestNoTraceCanary' ./internal/api/http/

      # SHUTDOWN PAUSE ACROSS REPLICAS (RFC ES F1). Boots two replicas on one
      # database, parks a run on the first by SIGTERM, and requires the second —
      # already running, as in a rolling update that starts the new pod first —
      # to resume it to completion. Postgres-gated like everything here, so the
      # `Go` job skips it. The test creates and drops its own database (the
      # service role is a superuser), so it shares nothing with the steps around
      # it. Builds the binary once, a couple of minutes on a shared runner.
      - name: Shutdown pause across replicas (Postgres)
        if: ${{ !cancelled() && matrix.group == 'snapshot' && steps.sel.outputs.replicas != '' }}
        env:
          LOOMCYCLE_TEST_PG_DSN: postgres://loomcycle:loomcycle@127.0.0.1:5432/loomcycle_test?sslmode=disable
        run: go test -count=1 -timeout 900s -run 'TestBoot_ClusterReplicaResumesRunsAStoppedReplicaParked' ./cmd/loomcycle/

      # COORDINATION TIER (multi-replica): cancel/steer coordinators, the
      # Postgres backplane, the replica store + heartbeat, the replicas sweeper
      # and user quotas. Every test here is PG-gated, and until now nothing ran
      # them: the `Go` job invokes `go test ./...` with no LOOMCYCLE_TEST_PG_DSN
      # so they all skip, and this job's store step covers only
      # ./internal/store/... . The whole package was structurally invisible, and
      # it drifted — six tests sat broken on main because their fixtures built
      # replica ids containing a '.' (Go's fractional-second layout forces the
      # separator) which ValidateReplicaID rejects. Nothing could go red.
      #
      # A SEPARATE DATABASE, not the store contract's, and not a convenient
      # ordering. These tests need a MIGRATED `public` schema (the store
      # contract creates a per-test schema and deliberately leaves `public`
      # empty), but two store tests need `public` LEFT un-migrated:
      # TestOpen_ExtensionPresentButTableMissingDisablesVectorSupport and
      # TestMigrate0062_RepairedTableMatchesFromScratchShape both fail against a
      # pre-migrated one ("0062 did not create memory_embeddings"). The two
      # requirements are mutually exclusive in one database, so sharing
      # loomcycle_test would work only while the steps happen to run in this
      # order — and would break on a reorder or a re-run with a failure that
      # looks like a migration bug. Same reasoning as the sqlmem aux DB below.
      #
      # Migrated with loomcycle's OWN migrator rather than a psql loop over
      # migrations/*.up.sql, so the ordering cannot drift from the real one and
      # schema_migrations is stamped as in production.
      #
      # !cancelled() so a red store contract does not SKIP this gate. That is
      # not hypothetical: on this step's first CI run the store contract
      # exhausted its 1800s budget and both coord steps were skipped, which
      # would have silently restored the very blind spot they exist to close.
      # The two surfaces share only the service container, so coord's result is
      # independent and worth having even when the contract is red.
      - name: Provision the coordination-tier DB
        if: ${{ !cancelled() && matrix.group == 'tiers' && steps.sel.outputs.coord != '' }}
        env:
          PGPASSWORD: loomcycle
        run: |
          psql -h 127.0.0.1 -U loomcycle -d loomcycle_test -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE coord_test OWNER loomcycle;"
          psql -h 127.0.0.1 -U loomcycle -d coord_test -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"
          go run ./cmd/loomcycle migrate up \
            --dsn "postgres://loomcycle:loomcycle@127.0.0.1:5432/coord_test?sslmode=disable"

      # -race because this package is entirely about concurrency (a backplane
      # fanning out to subscribers, a heartbeat goroutine, a sweeper racing
      # live replicas); a data race here is the bug class that matters, and the
      # suite is fast enough (~3s locally) to afford the detector.
      - name: Coordination tier (Postgres)
        if: ${{ !cancelled() && matrix.group == 'tiers' && steps.sel.outputs.coord != '' }}
        env:
          LOOMCYCLE_TEST_PG_DSN: postgres://loomcycle:loomcycle@127.0.0.1:5432/coord_test?sslmode=disable
          PKGS: ${{ steps.sel.outputs.coord }}
        run: scripts/ci/in-modules.sh go test -count=1 -race -timeout 600s -- $PKGS

      # RFC AA SQL Memory postgres tier: provision a SEPARATE aux DB reached by a
      # NON-superuser CREATEROLE admin (exactly the production provisioning), so
      # CI exercises the per-scope-login-role isolation tests (incl. the
      # cross-scope SET-role pivot regression) — not only SQLite. Without this
      # the postgres sqlmem tests skip.
      - name: Provision sqlmem aux DB + admin role
        if: matrix.group == 'tiers'
        env:
          PGPASSWORD: loomcycle
        run: |
          psql -h 127.0.0.1 -U loomcycle -d loomcycle_test -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE sqlmem_admin LOGIN PASSWORD 'auxpw' CREATEROLE;" \
            -c "CREATE DATABASE sqlmem_aux OWNER sqlmem_admin;"
          # Phase 3c vector columns: install pgvector into a dedicated read-only
          # sqlmem_ext schema (the operator step) so the vector tests exercise it.
          psql -h 127.0.0.1 -U loomcycle -d sqlmem_aux -v ON_ERROR_STOP=1 \
            -c "CREATE SCHEMA sqlmem_ext;" \
            -c "CREATE EXTENSION vector SCHEMA sqlmem_ext;" \
            -c "GRANT USAGE ON SCHEMA sqlmem_ext TO PUBLIC;"
      - name: SQL Memory postgres tier
        if: ${{ matrix.group == 'tiers' && (steps.sel.outputs.sqlmem != '' || steps.sel.outputs.builtin != '') }}
        env:
          LOOMCYCLE_TEST_SQLMEM_PG_DSN: postgres://sqlmem_admin:auxpw@127.0.0.1:5432/sqlmem_aux?sslmode=disable
          SQLMEM_PKGS: ${{ steps.sel.outputs.sqlmem }}
          BUILTIN_PKGS: ${{ steps.sel.outputs.builtin }}
        run: |
          if [ -n "$SQLMEM_PKGS" ]; then
            scripts/ci/in-modules.sh go test -count=1 -race -- $SQLMEM_PKGS
          fi
          # BUILTIN_PKGS only gates this line; the path stays literal because
          # ci_pgtier_filter_test reads the filter off it.
          if [ -z "$BUILTIN_PKGS" ]; then
            exit 0
          fi
          # The {"$embed"} round-trip lives in the Memory tool package; run the
          # vector tests there too (they skip without the aux DSN).
          #
          # This filter is NOT optional bookkeeping: a postgres-tier test absent
          # from it never runs in CI at all, because the step above owns the aux DB
          # and `go test ./...` cannot run both packages against it concurrently.
          # Add every new postgres-tier test in this package here, or it is
          # decoration rather than a gate.
          go test -count=1 -run 'TestEmbedDirective|TestEncodePgvector|TestResolveEmbedArgs|TestMemorySQL_EmbedDirective|TestDocument_Postgres|TestDocumentTags_CoreBothTiers|TestDocumentNameLinks_CoreBothTiers|TestDocumentHistory_|TestDocumentBacklinks_|TestDocumentUnlinkedMentions_|TestDocumentCanvas_|TestSidecar_PostgresTierParity|TestUpsert_ReObservation|TestConfidence_|TestVerdict_PostgresTier|TestVerificationStats_PostgresTier|TestHomeFactsUnderSubjects_PostgresTierParity|TestDeadLink_LiveChunksBeyondTheRowCapKeepTheirBodies_Postgres|TestChunkIndexText_PostgresTier|TestDocumentSearchFilter_CoreBothTiers|TestDocumentChunkValidity_CoreBothTiers|TestDocumentSchema_MigrateChunkValidity|TestMemoryDocumentFilter_CoreBothTiers|TestGraphRecall_AsOfHonoursTheChunksOwnInterval' ./internal/tools/builtin/...

  runtime-codejs:
    name: Runtime suites (code-js)
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          # The runner caches an older patch; take the newest so a stdlib fix lands.
          check-latest: true
          cache: true

      # The FUNCTIONAL code-js runtime suite is deterministic (synthetic
      # provider, no LLM / key / Postgres) and asserts storage state via the
      # sqlite3 CLI + parses SSE with python3. Both are preinstalled on
      # ubuntu-latest; this makes the dependency explicit and fails fast if the
      # image changes. NOTE: the STRESS suite (`make runtime-stress`) and the
      # soak/load suites are intentionally NOT run here — load, stress, and
      # sustainability tests run on the operator's machine, not in CI.
      - name: Ensure sqlite3 + python3
        run: |
          command -v python3 >/dev/null || { echo "python3 missing"; exit 1; }
          command -v sqlite3  >/dev/null || sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Runtime code-js suite (functional only)
        run: make runtime-codejs

  ts-adapter:
    name: TypeScript adapter
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: adapters/ts/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # Typecheck the TESTS too. vitest transpiles with esbuild, which strips
      # types without checking them, so until this step existed a test could
      # read a field that does not exist on the type and still pass — leaving
      # every adapter type unguarded and hiding a live arity bug.
      - run: npm run typecheck:tests
      - run: npm test

  # The Teams bridge's unit tests run in the Bridges job below. This job adds
  # what that one cannot: a loomcycle built from this commit (mock provider,
  # no keys) with real per-user tokens and real interactive runs, and the Teams
  # SDK app answering a posted activity through a fake Bot Connector.
  bridge-teams-integration:
    name: Teams bridge integration
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.bridges == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          # The runner caches an older patch; take the newest so a stdlib fix lands.
          check-latest: true
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/bridge-*/package-lock.json
      - name: Integration (real loomcycle)
        working-directory: packages/bridge-teams
        env:
          TEAMS_BRIDGE_IT_LOG_OUT: ${{ runner.temp }}/teams-bridge-it/loomcycle.log
        run: |
          npm ci
          ./test/integration/run.sh

      # The server's full log when the integration fails, with a goroutine
      # dump taken at the failure: the job output carries only the log's last
      # 200 lines.
      - name: Keep the loomcycle log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: teams-bridge-it-loomcycle-log
          path: ${{ runner.temp }}/teams-bridge-it/loomcycle.log
          if-no-files-found: ignore

  # The bridges (RFC EQ): bridge-core, then every platform bridge beside it.
  # One job for all of them, so adding a bridge needs no CI change. A platform
  # bridge under review depends on the core by `file:../bridge-core`, so the
  # core is built first; the publish workflow refuses that dependency.
  bridges:
    name: Bridges
    needs: changes
    if: needs.changes.outputs.bridges == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/bridge-*/package-lock.json
      - name: bridge-core
        working-directory: packages/bridge-core
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Platform bridges
        run: |
          set -euo pipefail
          for dir in packages/bridge-*/; do
            [ "$dir" = "packages/bridge-core/" ] && continue
            echo "::group::$dir"
            (cd "$dir" && npm ci && npm run typecheck && npm test && npm run build)
            echo "::endgroup::"
          done

  # The bridge images (publish-bridge-images.yml) build from one shared
  # Dockerfile at tag time. Build each here, amd64 only and without pushing, so
  # a change that breaks an image fails its PR rather than its release.
  bridge-images:
    name: Bridge images
    needs: changes
    if: needs.changes.outputs.bridges == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build every platform bridge image
        run: |
          set -euo pipefail
          for dir in packages/bridge-*/; do
            [ "$dir" = "packages/bridge-core/" ] && continue
            # A bridge under review may still depend on the core by path, which
            # no image can resolve; the Bridges job above covers it.
            if grep -q '"@loomcycle/bridge-core": "file:' "$dir/package.json"; then
              echo "::notice::$dir depends on bridge-core by path: image skipped"
              continue
            fi
            echo "::group::$dir"
            docker buildx build --load -f deploy/bridges/Dockerfile -t "ci-$(basename "$dir")" "$dir"
            echo "::endgroup::"
          done

  web-ui:
    name: Web UI build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # @loomcycle/library (RFC AY) is consumed from SOURCE via a Vite alias, so the
      # web typecheck/build compiles the package's TSX and must resolve its
      # react / js-yaml / @loomcycle/client imports from packages/library/node_modules
      # (gitignored → absent on checkout). Install it before the web steps.
      - name: Install @loomcycle/library deps
        working-directory: packages/library
        run: npm ci
      # @loomcycle/explorer (RFC AZ) is consumed from SOURCE via a Vite alias
      # the same way — install its react / @loomcycle/client deps before the web
      # steps (packages/explorer/node_modules is gitignored → absent on checkout).
      - name: Install @loomcycle/explorer deps
        working-directory: packages/explorer
        run: npm ci
      # @loomcycle/memory-view (RFC BV) is consumed from SOURCE via a Vite alias
      # the same way — install its deps before the web steps
      # (packages/memory-view/node_modules is gitignored → absent on checkout).
      - name: Install @loomcycle/memory-view deps
        working-directory: packages/memory-view
        run: npm ci
      # Run the package's OWN typecheck + wire-mapping unit tests on every PR.
      # The web typecheck below compiles the aliased source (catching type
      # regressions), but not the package's dataLayer.test.ts — a broken
      # snake_case arg mapping in dataLayerFromClient would otherwise stay green.
      - name: Test @loomcycle/memory-view
        working-directory: packages/memory-view
        run: npm run typecheck && npm test
      # @loomcycle/def-fields is consumed from SOURCE via a Vite alias the same
      # way — install its deps before the web steps
      # (packages/def-fields/node_modules is gitignored → absent on checkout).
      - name: Install @loomcycle/def-fields deps
        working-directory: packages/def-fields
        run: npm ci
      # The registry's own tests include the drift guard that pins
      # AGENTDEF_OVERLAY_KEYS to builtin.mergedDef's json tags — so adding an
      # overlay parameter in Go without exposing it in the editor fails HERE,
      # which is the whole reason the registry exists.
      - name: Test @loomcycle/def-fields
        working-directory: packages/def-fields
        run: npm run typecheck && npm test
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  # The .proto is the source of truth for THREE committed artifacts — the Go
  # pb/grpc stubs and the Python pb2 pair. Nothing verified they matched it, so
  # a proto edit that skipped `make proto` / `make python-proto` shipped stale
  # stubs with a green build: the wire gains a field, every generated client
  # silently cannot see it. That is the same class of gap as a runtime change
  # landing without its adapter, one level further down.
  #
  # Regenerate and fail on any diff. Cheap (seconds) and it can only fail when
  # the committed stubs genuinely disagree with the proto.
  proto-drift:
    name: Generated stubs match the proto
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          # The runner caches an older patch; take the newest so a stdlib fix lands.
          check-latest: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # PINNED, and the pin is the whole reason this gate is usable. The Python
      # stubs carry the generator's version in a header and a runtime-version
      # assertion, so regenerating with a different grpcio-tools rewrites those
      # lines and the diff check fires on toolchain drift rather than on schema
      # drift. A gate that cries wolf on every generator bump gets disabled.
      #
      # 1.81.1 is what the committed stubs were generated with — verified
      # byte-identical. Bumping it is a DELIBERATE act: change the pin, run
      # `make python-proto`, and commit the regenerated stubs in the same PR.
      - name: Install protoc + plugins
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          python3 -m venv adapters/python/.venv
          adapters/python/.venv/bin/pip install -q "grpcio-tools==1.81.1"
      - name: Regenerate
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          make proto
          make python-proto
      # GENERATOR STAMPS ARE IGNORED, DELIBERATELY. Every generator writes its own
      # version into the file it produces — `protoc v7.35.1`, `protoc-gen-go
      # v1.36.12`, the Python runtime-version assertion. Those lines change when
      # the TOOLCHAIN moves, which is not what this gate is for and not something
      # a contributor can fix. The gate asks one question: do the committed stubs
      # reflect the .proto? A stamp-only diff is a NO-OP that would otherwise turn
      # the job red on every runner image bump, and a gate that cries wolf gets
      # switched off — which is worse than not having it.
      #
      # Everything that encodes the SCHEMA — messages, fields, service methods,
      # the serialized descriptor — is still compared byte for byte.
      - name: Fail if the committed stubs drifted
        run: |
          if ! git diff --exit-code --quiet \
              -I'protoc(-gen-go(-grpc)?)?[ \t]+v?[0-9]' \
              -I'Protobuf Python Version' \
              -I'GRPC_GENERATED_VERSION' \
              -I'^[ \t]*[0-9]+,$' \
              -- internal/api/grpc/loomcyclepb adapters/python/loomcycle/_generated; then
            echo "::error::Generated stubs do not match proto/loomcycle.proto."
            echo "Run 'make proto' and 'make python-proto', then commit the result."
            git diff --stat
            git diff | head -60
            exit 1
          fi

  python-adapter:
    name: Python adapter
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install (with dev extras)
        run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

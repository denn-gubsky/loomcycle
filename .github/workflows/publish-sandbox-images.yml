name: Publish sandbox images

# Builds + publishes the code-execution SANDBOX images that the `sandbox` bundle
# needs (RFC BQ / docs/SANDBOX.md) but which goreleaser does NOT build:
#   - denngubsky/loomcycle-builder          (builder sidecar, rootless podman base)
#   - denngubsky/loomcycle-builder-docker   (builder sidecar, host-Docker-socket base)
#   - denngubsky/loomcycle-sandbox-session  (the per-session toolchain image)
#
# goreleaser (release.yml) builds only the main `loomcycle` + `loomcycle-toolbox`
# images from the root Go module. The sidecar is a SEPARATE Go module
# (deploy/builder) and the session image is a pure toolchain image; both self-build
# (multi-stage), so they get their own multi-arch buildx job here rather than being
# forced into goreleaser's binary-wrapping `dockers:` stage.
#
# Versioning: published in LOCKSTEP with the loomcycle release (a v1.40.0 tag ->
# `:1.40.0` + `:latest`). Operators pin the version tag; the sidecar's own build
# stamp comes from the VERSION build-arg. Runs in parallel with release.yml (does
# not block the goreleaser job) and can also be fired on demand.
#
# Gate + credentials: identical to release.yml's docker publish — the job is gated
# on the repo VARIABLE `DOCKER_PUBLISH_ENABLED == 'true'` and logs in with the
# `DOCKER_USERNAME` / `DOCKER_PASSWORD` secrets. When the operator hasn't enabled
# docker publishing the job is SKIPPED cleanly (no failure).
#
# Registries: every image goes to Docker Hub AND to the ghcr.io/denn-gubsky
# mirror, from one build (see .goreleaser.yaml's `dockers:` comment for why, and
# for the one-time "make the GHCR package public" step). The var name still says
# DOCKER_PUBLISH_ENABLED but now gates BOTH registries — it is deliberately not
# renamed, since that would silently disable publishing until the operator
# created a new repo variable.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to publish (e.g. 1.40.0). Defaults to the git ref name minus its leading 'v'."
        required: false

# See release.yml — clears the Node-20 deprecation across JavaScript actions.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Read-only by default; the publish job asks for what it writes.
permissions:
  contents: read

jobs:
  # FULL vs LEAN, mirroring release.yml: the sandbox images are FULL-build-only.
  # A minor/major tag (vX.Y.0) or a manual dispatch builds them; a patch tag
  # (vX.Y.Z, Z>0) SKIPS them — a bugfix release rebuilds only loomcycle-browser
  # (see release.yml's browser-patch job). Operators wanting the sandbox images
  # at a patch version run this workflow via workflow_dispatch.
  classify:
    name: classify release
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.c.outputs.full }}
    steps:
      - id: c
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"   # manual → always build
            exit 0
          fi
          VER="${REF_NAME#v}"
          case "$VER" in
            *.*.*)
              PATCH="${VER##*.}"
              if [ "$PATCH" = "0" ]; then
                echo "full=true" >> "$GITHUB_OUTPUT"
              else
                echo "full=false" >> "$GITHUB_OUTPUT"
                echo "::notice::patch tag $REF_NAME — sandbox images skipped (build on the next minor, or via workflow_dispatch)"
              fi
              ;;
            *) echo "full=true" >> "$GITHUB_OUTPUT" ;;
          esac

  publish:
    name: build + push sandbox images
    needs: classify
    runs-on: ubuntu-latest
    # Same explicit gate as goreleaser's docker publish: skip cleanly until the
    # operator sets DOCKER_PUBLISH_ENABLED and the Docker Hub credentials. Plus
    # the FULL-build gate — a patch tag skips the sandbox images.
    if: vars.DOCKER_PUBLISH_ENABLED == 'true' && needs.classify.outputs.full == 'true'
    permissions:
      contents: read
      packages: write      # push the GHCR mirror with the built-in GITHUB_TOKEN
      id-token: write      # keyless cosign signatures and the attestations
      attestations: write  # store the build-provenance attestations with GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the version tag
        id: ver
        # Untrusted input (a workflow_dispatch value) is passed via env, never
        # interpolated into the shell, and the result is charset-validated before it
        # flows into later build/tag steps — a crafted value can't inject.
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          V="${INPUT_VERSION:-}"
          if [ -z "$V" ]; then
            V="${REF_NAME#v}"   # v1.40.0 -> 1.40.0
          fi
          if ! printf '%s' "$V" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'; then
            echo "::error::Invalid version tag '$V' (a docker tag must match [A-Za-z0-9._-])"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "::notice::Publishing sandbox images at :$V + :latest"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          # binfmt pinned by digest like the base images (dependabot cannot bump it).
          image: tonistiigi/binfmt:latest@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      # GHCR mirror — no new secret (GITHUB_TOKEN + packages:write above).
      # Rationale in .goreleaser.yaml's dockers: comment.
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Builder sidecar — rootless podman base (deploy/builder/Dockerfile) ──
      - name: Build + push loomcycle-builder (rootless)
        id: builder
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/builder
          file: deploy/builder/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/denn-gubsky/loomcycle
          tags: |
            denngubsky/loomcycle-builder:${{ steps.ver.outputs.version }}
            denngubsky/loomcycle-builder:latest
            ghcr.io/denn-gubsky/loomcycle-builder:${{ steps.ver.outputs.version }}
            ghcr.io/denn-gubsky/loomcycle-builder:latest

      # ── Builder sidecar — host-Docker-socket base (deploy/builder/Dockerfile.docker) ──
      - name: Build + push loomcycle-builder-docker (docker socket)
        id: builder_docker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/builder
          file: deploy/builder/Dockerfile.docker
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/denn-gubsky/loomcycle
          tags: |
            denngubsky/loomcycle-builder-docker:${{ steps.ver.outputs.version }}
            denngubsky/loomcycle-builder-docker:latest
            ghcr.io/denn-gubsky/loomcycle-builder-docker:${{ steps.ver.outputs.version }}
            ghcr.io/denn-gubsky/loomcycle-builder-docker:latest

      # ── Session toolchain image (deploy/builder/session/Dockerfile) ──
      # NOTE: the arm64 build runs apt + Go/Rust/gh downloads under QEMU emulation
      # on the amd64 runner and is SLOW (tens of minutes) — same caveat as the
      # loomcycle-toolbox image in .goreleaser.yaml. If it becomes a bottleneck,
      # drop `linux/arm64` from `platforms` below until a native arm64 runner is
      # available (the sidecar images above are trivial Go builds — keep them multi-arch).
      - name: Build + push loomcycle-sandbox-session
        id: sandbox_session
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/builder/session
          file: deploy/builder/session/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/denn-gubsky/loomcycle
          tags: |
            denngubsky/loomcycle-sandbox-session:${{ steps.ver.outputs.version }}
            denngubsky/loomcycle-sandbox-session:latest
            ghcr.io/denn-gubsky/loomcycle-sandbox-session:${{ steps.ver.outputs.version }}
            ghcr.io/denn-gubsky/loomcycle-sandbox-session:latest

      # Signature and build provenance for each image, as a full release gives
      # its own images (release.yml's image-signing step and
      # attest-images). Each build pushed the same bytes to both registries, so
      # both names carry one digest: cosign signs each copy, and the
      # attestation pushed to GHCR is also what `gh attestation verify` finds
      # for the Docker Hub copy (it looks attestations up by digest).
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.0.6
      - name: Sign the images
        env:
          BUILDER: ${{ steps.builder.outputs.digest }}
          BUILDER_DOCKER: ${{ steps.builder_docker.outputs.digest }}
          SESSION: ${{ steps.sandbox_session.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes \
            "docker.io/denngubsky/loomcycle-builder@${BUILDER}" \
            "ghcr.io/denn-gubsky/loomcycle-builder@${BUILDER}" \
            "docker.io/denngubsky/loomcycle-builder-docker@${BUILDER_DOCKER}" \
            "ghcr.io/denn-gubsky/loomcycle-builder-docker@${BUILDER_DOCKER}" \
            "docker.io/denngubsky/loomcycle-sandbox-session@${SESSION}" \
            "ghcr.io/denn-gubsky/loomcycle-sandbox-session@${SESSION}"
      - name: Attest loomcycle-builder
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/denn-gubsky/loomcycle-builder
          subject-digest: ${{ steps.builder.outputs.digest }}
          push-to-registry: true
          # Storage records exist only for organisation-owned repositories;
          # this one belongs to a user, so the record call could only fail.
          create-storage-record: false
      - name: Attest loomcycle-builder-docker
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/denn-gubsky/loomcycle-builder-docker
          subject-digest: ${{ steps.builder_docker.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest loomcycle-sandbox-session
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/denn-gubsky/loomcycle-sandbox-session
          subject-digest: ${{ steps.sandbox_session.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

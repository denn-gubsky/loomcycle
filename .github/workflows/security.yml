name: Security

# Supply-chain and static-analysis checks, kept out of ci.yml so the weekly
# schedule re-runs only these jobs and not the whole test matrix. A new
# advisory against a dependency we already ship appears in the vulnerability
# database without any change to this repo; the schedule is what surfaces it.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

# A newer push to the same PR supersedes the running scan. Runs on main and
# the weekly schedule are never cancelled, so every main commit gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Same Node-24 opt-in as ci.yml; see the comment there.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

# Both jobs cover every Go module that ships: the runtime at the repo root,
# the in-tree modules the root go.mod replaces (internal/errkind, internal/otel,
# internal/providers; RFC FE), and deploy/builder, a separate module published
# as the loomcycle-builder image. `./...` from the root reaches none of them.
jobs:
  govulncheck:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: root
            dir: .
          - module: builder
            dir: deploy/builder
          - module: errkind
            dir: internal/errkind
          - module: otel
            dir: internal/otel
          - module: providers
            dir: internal/providers
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7

      # Same toolchain as the Go job in ci.yml. govulncheck reports standard
      # library vulnerabilities against the Go version that runs it, so this
      # must track the version releases are built with.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          # The runner caches an older patch; take the newest so a stdlib fix lands.
          check-latest: true
          cache: true

      # PINNED. Bumping the scanner is a deliberate change, not something a
      # moving tag does to an unrelated PR. dependabot does not update a
      # `go install ...@version` pin; bump it by hand.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      # A gate: govulncheck exits non-zero only for a vulnerability the call
      # graph actually reaches. Unreachable ones in imported packages or
      # required modules are listed but do not fail the job.
      - name: govulncheck
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          govulncheck ./...

  gosec:
    name: gosec report (${{ matrix.module }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: root
            dir: .
            prefix: ""
          - module: builder
            dir: deploy/builder
            prefix: deploy/builder/
          - module: errkind
            dir: internal/errkind
            prefix: internal/errkind/
          - module: otel
            dir: internal/otel
            prefix: internal/otel/
          - module: providers
            dir: internal/providers
            prefix: internal/providers/
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          # The runner caches an older patch; take the newest so a stdlib fix lands.
          check-latest: true
          cache: true

      # PINNED; dependabot does not update it either.
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      # A REPORT, not a gate: -no-fail keeps the exit code zero whatever is
      # found. Findings go to the job summary on every run and to code
      # scanning from main and the schedule (see the upload step). Limited
      # to high-confidence findings of medium severity or worse; test files
      # are excluded by default, and the generated gRPC stubs by
      # -exclude-generated.
      - name: gosec
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          gosec -quiet -no-fail \
            -confidence high -severity medium \
            -exclude-generated \
            -exclude-dir=vendor -exclude-dir=node_modules -exclude-dir=testdata \
            -fmt sarif -out gosec.sarif \
            ./...
          # -quiet writes no report at all when there is nothing to report,
          # which a small module (errkind, otel) often is; the steps below
          # read the file, so an empty run stands in for it.
          if [ ! -s gosec.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"gosec","rules":[]}},"results":[]}]}' > gosec.sarif
          fi

      - name: Summarize findings by rule
        run: |
          {
            echo "### gosec ${{ matrix.module }} (high confidence, severity >= medium)"
            echo
            echo "Total: $(jq '[.runs[].results // [] | .[]] | length' gosec.sarif)"
            echo
            echo '```'
            jq -r '.runs[].results // [] | .[].ruleId' gosec.sarif | sort | uniq -c | sort -rn
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # gosec marks every finding "error" and reports paths relative to the
      # directory it ran in. Map severity to level (HIGH -> error, else
      # warning; LOW is not reported) and root the paths at the repo, so the
      # Security tab ranks findings and links them to the right files.
      - name: Prepare SARIF for code scanning
        if: github.event_name != 'pull_request'
        env:
          PREFIX: ${{ matrix.prefix }}
        run: |
          jq --arg prefix "$PREFIX" '
            .runs |= map(
              ([(.tool.driver.rules // [])[]
                | {key: .id,
                   value: (if any((.properties.tags // [])[]; . == "HIGH")
                           then "error" else "warning" end)}]
               | from_entries) as $level
              | .tool.driver.rules |= ((. // []) | map(.defaultConfiguration.level = $level[.id]))
              | .results |= ((. // []) | map(
                  .level = ($level[.ruleId] // "warning")
                  | .locations |= ((. // []) | map(
                      .physicalLocation.artifactLocation.uri |= ($prefix + .))))))
          ' gosec.sarif > gosec-upload.sarif

      # Not on pull requests: code scanning turns new findings in a PR's
      # changed lines into a failing "gosec" check, which would make this
      # report a gate. PRs get the job-summary count above instead.
      - name: Upload to code scanning
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ matrix.dir }}/gosec-upload.sarif
          category: gosec-${{ matrix.module }}

      # A gate on high severity, last so the report and upload above still
      # run when it fails. The report covers medium too, but
      # its ~120 medium findings (mostly SQL built from fixed fragments in the
      # store layer) are not triaged, so only high severity fails a PR. Each
      # accepted high finding carries a `#nosec <rule> -- <reason>` at its line.
      - name: gosec gate (high severity)
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          gosec -quiet \
            -confidence high -severity high \
            -exclude-generated \
            -exclude-dir=vendor -exclude-dir=node_modules -exclude-dir=testdata \
            ./...

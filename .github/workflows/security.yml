name: Security

# Supply-chain and static-analysis checks, kept out of ci.yml so the weekly
# schedule re-runs only these jobs and not the whole test matrix. A new
# advisory against a dependency we already ship appears in the vulnerability
# database without any change to this repo; the schedule is what surfaces it.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

# Same Node-24 opt-in as ci.yml; see the comment there.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Same toolchain as the Go job in ci.yml. govulncheck reports standard
      # library vulnerabilities against the Go version that runs it, so this
      # must track the version releases are built with.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      # PINNED. Bumping the scanner is a deliberate change, not something a
      # moving tag does to an unrelated PR.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      # A gate: govulncheck exits non-zero only for a vulnerability the call
      # graph actually reaches. Unreachable ones in imported packages or
      # required modules are listed but do not fail the job.
      - name: govulncheck
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          govulncheck ./...

  gosec:
    name: gosec (report)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      # A REPORT, not a gate: -no-fail keeps the exit code zero whatever is
      # found. Findings go to code scanning (category "gosec") and a per-rule
      # count goes to the job summary. Limited to high-confidence findings of
      # medium severity or worse; test files are excluded by default, and the
      # generated gRPC stubs by -exclude-generated.
      - name: gosec
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          gosec -quiet -no-fail \
            -confidence high -severity medium \
            -exclude-generated \
            -exclude-dir=vendor -exclude-dir=node_modules -exclude-dir=testdata \
            -fmt sarif -out gosec.sarif \
            ./...

      - name: Summarize findings by rule
        run: |
          {
            echo "### gosec (high confidence, severity >= medium)"
            echo
            echo "Total: $(jq '[.runs[].results // [] | .[]] | length' gosec.sarif)"
            echo
            echo '```'
            jq -r '.runs[].results // [] | .[].ruleId' gosec.sarif | sort | uniq -c | sort -rn
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A pull request from a fork gets a read-only token, so the upload
      # would fail there; the summary above still reports the findings.
      - name: Upload to code scanning
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec.sarif
          category: gosec

name: Security

# Supply-chain and static-analysis checks, kept out of ci.yml so the weekly
# schedule re-runs only these jobs and not the whole test matrix. A new
# advisory against a dependency we already ship appears in the vulnerability
# database without any change to this repo; the schedule is what surfaces it.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

# A newer push to the same PR supersedes the running scan. Runs on main and
# the weekly schedule are never cancelled, so every main commit gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Same Node-24 opt-in as ci.yml; see the comment there.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

# The Go jobs (govulncheck, gosec) cover every Go module that ships: the
# runtime at the repo root, the in-tree modules the root go.mod replaces
# (internal/errkind, internal/otel, internal/providers; RFC FE), and
# deploy/builder, a separate module published as the loomcycle-builder image.
# `./...` from the root reaches none of them. npm-audit and pip-audit, at the
# end, cover the npm packages and the Python adapter.
jobs:
  govulncheck:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: root
            dir: .
          - module: builder
            dir: deploy/builder
          - module: errkind
            dir: internal/errkind
          - module: otel
            dir: internal/otel
          - module: providers
            dir: internal/providers
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same toolchain as the Go job in ci.yml. govulncheck reports standard
      # library vulnerabilities against the Go version that runs it, so this
      # must track the version releases are built with.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          # The runner caches an older patch; take the newest so a stdlib fix lands.
          check-latest: true
          cache: true

      # PINNED. Bumping the scanner is a deliberate change, not something a
      # moving tag does to an unrelated PR. dependabot does not update a
      # `go install ...@version` pin; bump it by hand.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      # A gate: govulncheck exits non-zero only for a vulnerability the call
      # graph actually reaches. Unreachable ones in imported packages or
      # required modules are listed but do not fail the job.
      - name: govulncheck
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          govulncheck ./...

  gosec:
    name: gosec report (${{ matrix.module }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: root
            dir: .
            prefix: ""
          - module: builder
            dir: deploy/builder
            prefix: deploy/builder/
          - module: errkind
            dir: internal/errkind
            prefix: internal/errkind/
          - module: otel
            dir: internal/otel
            prefix: internal/otel/
          - module: providers
            dir: internal/providers
            prefix: internal/providers/
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          # The runner caches an older patch; take the newest so a stdlib fix lands.
          check-latest: true
          cache: true

      # PINNED; dependabot does not update it either.
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      # A REPORT, not a gate: -no-fail keeps the exit code zero whatever is
      # found. Findings go to the job summary on every run and to code
      # scanning from main and the schedule (see the upload step). Limited
      # to high-confidence findings of medium severity or worse; test files
      # are excluded by default, and the generated gRPC stubs by
      # -exclude-generated.
      - name: gosec
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          gosec -quiet -no-fail \
            -confidence high -severity medium \
            -exclude-generated \
            -exclude-dir=vendor -exclude-dir=node_modules -exclude-dir=testdata \
            -fmt sarif -out gosec.sarif \
            ./...
          # -quiet writes no report at all when there is nothing to report,
          # which a small module (errkind, otel) often is; the steps below
          # read the file, so an empty run stands in for it.
          if [ ! -s gosec.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"gosec","rules":[]}},"results":[]}]}' > gosec.sarif
          fi

      - name: Summarize findings by rule
        run: |
          {
            echo "### gosec ${{ matrix.module }} (high confidence, severity >= medium)"
            echo
            echo "Total: $(jq '[.runs[].results // [] | .[]] | length' gosec.sarif)"
            echo
            echo '```'
            jq -r '.runs[].results // [] | .[].ruleId' gosec.sarif | sort | uniq -c | sort -rn
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # gosec marks every finding "error" and reports paths relative to the
      # directory it ran in. Map severity to level (HIGH -> error, else
      # warning; LOW is not reported) and root the paths at the repo, so the
      # Security tab ranks findings and links them to the right files.
      - name: Prepare SARIF for code scanning
        if: github.event_name != 'pull_request'
        env:
          PREFIX: ${{ matrix.prefix }}
        run: |
          jq --arg prefix "$PREFIX" '
            .runs |= map(
              ([(.tool.driver.rules // [])[]
                | {key: .id,
                   value: (if any((.properties.tags // [])[]; . == "HIGH")
                           then "error" else "warning" end)}]
               | from_entries) as $level
              | .tool.driver.rules |= ((. // []) | map(.defaultConfiguration.level = $level[.id]))
              | .results |= ((. // []) | map(
                  .level = ($level[.ruleId] // "warning")
                  | .locations |= ((. // []) | map(
                      .physicalLocation.artifactLocation.uri |= ($prefix + .))))))
          ' gosec.sarif > gosec-upload.sarif

      # Not on pull requests: code scanning turns new findings in a PR's
      # changed lines into a failing "gosec" check, which would make this
      # report a gate. PRs get the job-summary count above instead.
      - name: Upload to code scanning
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ matrix.dir }}/gosec-upload.sarif
          category: gosec-${{ matrix.module }}

      # A gate on high severity, last so the report and upload above still
      # run when it fails. The report covers medium too, but
      # its ~120 medium findings (mostly SQL built from fixed fragments in the
      # store layer) are not triaged, so only high severity fails a PR. Each
      # accepted high finding carries a `#nosec <rule> -- <reason>` at its line.
      - name: gosec gate (high severity)
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          gosec -quiet \
            -confidence high -severity high \
            -exclude-generated \
            -exclude-dir=vendor -exclude-dir=node_modules -exclude-dir=testdata \
            ./...

  # A gate over the production dependency tree of every npm package in the
  # repo: a high or critical advisory fails the job. The list is every tracked
  # package-lock.json, not a fixed set, so a new package is covered the day it
  # lands. npm audit reads the lockfile and asks the registry; it needs no
  # install. Every lockfile is audited even after one fails, so the log names
  # them all. There is no exception list: an advisory with no upstream fix is
  # handled in its package, with the narrowest npm `overrides` entry that
  # moves the dependency past it (packages/bridge-teams scopes one to the
  # Teams SDK), not by weakening this gate.
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Node CI tests with; its npm is the one that resolves these lockfiles.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: npm audit --omit=dev (every lockfile)
        run: |
          set -uo pipefail
          failed=""
          for lock in $(git ls-files '*package-lock.json'); do
            dir=$(dirname "$lock")
            echo "::group::$dir"
            if ! (cd "$dir" && npm audit --omit=dev --audit-level=high); then
              failed="$failed $dir"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::npm audit found high or critical advisories in:$failed"
            exit 1
          fi

  # A gate over the Python adapter's runtime dependencies. The adapter ships
  # no lockfile (installers resolve its ranges), so pip-audit resolves
  # pyproject.toml the way `pip install loomcycle` would today and audits the
  # result: it fails when the newest versions the ranges allow are vulnerable,
  # e.g. when a fix lands only above an upper bound. Dev extras are not
  # audited, matching --omit=dev above.
  pip-audit:
    name: pip-audit (Python adapter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      # PINNED, like govulncheck; dependabot does not update it.
      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1

      - name: pip-audit
        run: python -m pip_audit --strict --progress-spinner off adapters/python

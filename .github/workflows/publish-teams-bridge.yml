name: Publish @loomcycle/teams-bridge to npm

# @loomcycle/teams-bridge (RFC EN — a Microsoft Teams bot for loomcycle
# interactive agents) is versioned INDEPENDENTLY of the Go binary and of the
# other packages (it consumes the published @loomcycle/client), so it publishes
# on its OWN tag namespace `teams-bridge-v*` (e.g. `teams-bridge-v0.1.0`),
# mirroring @loomcycle/def-fields and @loomcycle/library, NOT the binary's `v*`.
#
# Safety: the workflow HARD-FAILS if packages/teams-bridge/package.json's version
# doesn't match the tag (a dedicated tag should always match — a mismatch is a
# mistake, surfaced loudly, npm untouched).
#
# Auth: an npm automation token in the `NPM_TOKEN` repo secret. setup-node writes
# it into ~/.npmrc (via NODE_AUTH_TOKEN below), so `npm publish` authenticates as
# that token's account. This is the token path chosen for the FIRST publish of
# this brand-new scoped package (OIDC Trusted Publishing can't bootstrap a package
# that doesn't exist yet). Once @loomcycle/teams-bridge exists on npm, the operator
# MAY switch to OIDC Trusted Publishing (register the publisher on the package's
# Access tab, drop the secret, add `id-token: write` + `--provenance`) — see the
# @loomcycle/client publish-ts-adapter.yml workflow for that shape.
#
# Inputs reaching `run` steps are limited to GITHUB_REF_NAME (a git tag — git
# rejects metacharacters in ref names) and constants; the tag is routed through
# `env:` per the GitHub workflow-injection guidance.
on:
  push:
    tags:
      - "teams-bridge-v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  publish:
    name: Publish @loomcycle/teams-bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: packages/teams-bridge/package-lock.json

      - name: Verify package version matches tag
        working-directory: packages/teams-bridge
        # Strip the `teams-bridge-v` prefix — npm versions don't carry it. A
        # dedicated tag should always match the package version; a mismatch is a
        # mistake.
        env:
          TAG_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PKG_VER=$(node -p "require('./package.json').version")
          TAG_VER="${TAG_REF#teams-bridge-v}"
          if [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "::error::packages/teams-bridge/package.json version ($PKG_VER) does not match tag ($TAG_VER). Bump the package.json to $TAG_VER and re-tag, or fix the tag."
            exit 1
          fi
          echo "::notice::Publishing @loomcycle/teams-bridge@$PKG_VER (tag $TAG_REF)"

      - name: Install
        working-directory: packages/teams-bridge
        run: npm ci

      - name: Build
        working-directory: packages/teams-bridge
        run: npm run build

      - name: Test
        working-directory: packages/teams-bridge
        run: npm test

      - name: Publish
        working-directory: packages/teams-bridge
        # --access public for the scoped package. prepack rebuilds dist from a
        # clean tree, so the published tarball is fresh regardless. NODE_AUTH_TOKEN
        # is the NPM_TOKEN secret setup-node wired into ~/.npmrc. (--provenance is
        # omitted: it requires OIDC/id-token, not token auth; add it if/when this
        # switches to Trusted Publishing.)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

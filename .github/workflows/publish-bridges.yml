name: Publish a loomcycle bridge to npm

# The bridges (RFC EQ) — @loomcycle/bridge-core and one @loomcycle/bridge-<platform>
# package per chat platform — are versioned INDEPENDENTLY of the Go binary and
# of each other, at 0.x. Each publishes on its OWN tag, `bridge-<name>-v<x.y.z>`
# (e.g. `bridge-core-v0.1.0`, `bridge-slack-v0.1.0`), from `packages/bridge-<name>`.
# One workflow serves them all: the tag names the package.
#
# Order: a platform bridge depends on @loomcycle/bridge-core by its PUBLISHED
# version. Publish bridge-core first; a bridge that still depends on the core
# by a `file:` path (as it does while the two are reviewed together) is
# refused here, since its tarball would point at a path no installer has.
#
# Safety: the workflow HARD-FAILS when the tag is not `bridge-<name>-v<semver>`,
# when the package directory does not exist, or when package.json's name or
# version does not match the tag. npm is untouched in each case.
#
# Auth: npm Trusted Publishing (OIDC). The package's npm Access tab names this
# repository and this workflow file as its trusted publisher; npm exchanges the
# job's GitHub OIDC token (id-token: write) for a short-lived publish token, so
# no npm token is stored in the repository. Trusted Publishing needs npm CLI
# 11.5.1 or later, hence the upgrade step below.
#
# Provenance: `npm publish --provenance` works with token auth too. npm signs a
# SLSA provenance statement through the job's GitHub OIDC token (id-token: write)
# and shows it on the package page; package.json's `repository` must name this
# repository, or the publish is refused.
#
# Inputs reaching `run` steps are limited to GITHUB_REF_NAME (a git tag — git
# rejects metacharacters in ref names, and the tag is matched against a strict
# pattern before use) and constants; the tag is routed through `env:` per the
# GitHub workflow-injection guidance.
on:
  push:
    tags:
      - "bridge-*-v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm publish --provenance signs its provenance statement through the
      # job's GitHub OIDC token, which also authenticates the publish (Trusted Publishing).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the package from the tag
        id: pkg
        env:
          TAG_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG_REF" =~ ^(bridge-[a-z]+)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::tag $TAG_REF is not bridge-<name>-v<x.y.z>"
            exit 1
          fi
          NAME="${BASH_REMATCH[1]}"
          VER="${BASH_REMATCH[2]}"
          DIR="packages/$NAME"
          if [ ! -f "$DIR/package.json" ]; then
            echo "::error::no package at $DIR"
            exit 1
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: ${{ steps.pkg.outputs.dir }}/package-lock.json

      - name: Upgrade npm CLI for Trusted Publishing
        # npm 11.5.1+ negotiates the OIDC exchange; npm 11 still runs on Node 20.
        run: npm install -g npm@^11.5.1

      - name: Verify the package matches the tag, and depends on nothing by path
        working-directory: ${{ steps.pkg.outputs.dir }}
        env:
          WANT_NAME: "@loomcycle/${{ steps.pkg.outputs.name }}"
          WANT_VER: ${{ steps.pkg.outputs.version }}
        run: |
          set -euo pipefail
          node -e '
            const p = require("./package.json");
            const fail = (m) => { console.log("::error::" + m); process.exit(1); };
            if (p.name !== process.env.WANT_NAME) fail(`package.json name ${p.name} does not match the tag (${process.env.WANT_NAME})`);
            if (p.version !== process.env.WANT_VER) fail(`package.json version ${p.version} does not match the tag (${process.env.WANT_VER}). Bump package.json and re-tag, or fix the tag.`);
            for (const [k, v] of Object.entries({ ...p.dependencies, ...p.peerDependencies })) {
              if (/^(file|link|workspace):/.test(String(v))) fail(`${k} is a ${v} dependency: publish it first and depend on its version`);
            }
            console.log(`::notice::Publishing ${p.name}@${p.version}`);
          '

      - name: Install
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: npm ci

      - name: Build
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: npm run build

      - name: Test
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: npm test

      - name: Publish
        working-directory: ${{ steps.pkg.outputs.dir }}
        # --access public for the scoped package. prepack rebuilds dist from a
        # clean tree. --provenance attaches the signed build provenance (see the
        # header).
        run: npm publish --access public --provenance

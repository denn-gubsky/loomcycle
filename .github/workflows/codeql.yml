name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

# A newer push to the same PR supersedes the running analysis. Runs on main
# and the weekly schedule are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Same Node-24 opt-in as ci.yml; see the comment there.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every Go module is pure Go (releases build with CGO_ENABLED=0),
          # so `go build ./...` in each is the whole build. Manual mode makes
          # that the build CodeQL traces, rather than whatever the autobuilder
          # infers from the repo (the Makefile's build-all also runs npm).
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          # The runner caches an older patch; take the newest so a stdlib fix lands.
          check-latest: true
          cache: true

      # paths-ignore applies to the JavaScript extractor only; Go extraction
      # follows the build. Build output and installed dependencies are not
      # our source: dist/ is a build artifact (the embedded web UI lands in
      # internal/webui/dist), node_modules is third-party code.
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config: |
            paths-ignore:
              - "**/node_modules"
              - "**/dist"
              - "**/*.min.js"
              - "**/testdata"

      - if: matrix.build-mode == 'manual'
        name: Build
        # `./...` from the root reaches no other module: in-modules.sh builds
        # the root and each in-tree module the root go.mod replaces (RFC FE),
        # and deploy/builder is its own module (the loomcycle-builder image).
        run: |
          scripts/ci/in-modules.sh go build ./...
          (cd deploy/builder && go build ./...)

      # No fork guard: code scanning accepts uploads from a run triggered by
      # pull_request even when a fork's token is read-only.
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

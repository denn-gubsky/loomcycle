name: Release (goreleaser)

# Cross-platform binary builds + Homebrew formula bump, fired on
# every `v*` tag. The TS adapter's publish-ts-adapter workflow and
# this one BOTH trigger on `v*`; they run in parallel and don't
# conflict (TS publishes to npm, this builds Go binaries + uploads
# release assets + bumps the homebrew tap formula).
#
# Manual setup required ONCE per repo:
#   1. Generate a fine-grained personal access token at
#      https://github.com/settings/personal-access-tokens scoped to
#      ONLY denn-gubsky/homebrew-loomcycle with `Contents: Read and
#      write` permission. No other scopes.
#   2. Add the token as a repository secret named HOMEBREW_TAP_TOKEN
#      under Settings -> Secrets and variables -> Actions.
#
# That token is needed because the workflow's default GITHUB_TOKEN
# is scoped to THIS repository (denn-gubsky/loomcycle) only; pushing
# the formula bump to the tap repo requires cross-repo write access.
#
# v0.11.2 Docker publish (OPTIONAL — leave unset to skip Docker):
#   3. Create a Docker Hub access token at
#      https://hub.docker.com/settings/security scoped to
#      docker.io/denngubsky/loomcycle with `Read, Write, Delete` perms.
#   4. Add secrets DOCKER_USERNAME (= "denngubsky") + DOCKER_PASSWORD
#      (= the access token) under Settings -> Secrets.
#   5. Add a repository VARIABLE (not secret) named
#      DOCKER_PUBLISH_ENABLED set to "true" under Settings ->
#      Variables. The pipeline reads `vars.DOCKER_PUBLISH_ENABLED`
#      to gate the docker login + publish steps; absent or any other
#      value means "skip docker, ship tarballs + brew only".
#
# Why a var (not a secret) for the toggle: secrets are masked in
# logs and conditionals can't easily distinguish "secret unset"
# from "secret empty"; vars are visible and the gate is operator-
# explicit. Docker credentials themselves remain secrets.
on:
  push:
    tags:
      - "v*"
  # Escape hatch: force the FULL build (binaries + Homebrew + every image)
  # regardless of the tag shape. Use it to give a patch tag the full treatment
  # when a minor's worth of artifacts is needed (e.g. an arm64 or Homebrew fix
  # shipped as a patch). Dispatch this workflow on the tag ref with force_full=true.
  workflow_dispatch:
    inputs:
      force_full:
        description: "Force the full build even on a patch tag (true/false)"
        required: false
        default: "false"

# Run JavaScript-based actions (checkout, setup-go/node, docker/*,
# goreleaser-action) on Node.js 24. GitHub forces this default 2026-06-16
# and removes Node 20 from runners 2026-09-16; this opt-in clears the
# Node-20 deprecation across every action without per-action major bumps.
# Safe to delete once Node 24 is the runner default.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Read-only by default; each job that writes asks for exactly what it writes.
permissions:
  contents: read

jobs:
  # Decide FULL vs LEAN from the tag shape (the release-cadence rule):
  #   vX.Y.0 (patch component 0) or a major, or a force_full dispatch → FULL
  #   build (binaries + Homebrew + every image variant, as before).
  #   vX.Y.Z with Z>0 (a patch / subversion) → LEAN build: only the
  #   loomcycle-browser linux/amd64 image (see the browser-patch job). A
  #   non-semver ref defaults to FULL (safe).
  classify:
    name: classify release
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.c.outputs.full }}
      version: ${{ steps.c.outputs.version }}
    steps:
      - id: c
        env:
          REF_NAME: ${{ github.ref_name }}
          FORCE_FULL: ${{ github.event.inputs.force_full }}
        run: |
          set -euo pipefail
          VER="${REF_NAME#v}"          # v1.51.1 -> 1.51.1
          # Charset-validate before it flows into a docker tag downstream.
          if ! printf '%s' "$VER" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'; then
            echo "::error::Invalid version '$VER' (a docker tag must match [A-Za-z0-9._-])"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if [ "${FORCE_FULL:-false}" = "true" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "::notice::force_full requested — running the FULL build"
            exit 0
          fi
          case "$VER" in
            *.*.*)
              PATCH="${VER##*.}"       # 1.51.1 -> 1 ; 1.51.0 -> 0
              if [ "$PATCH" = "0" ]; then
                echo "full=true" >> "$GITHUB_OUTPUT"
                echo "::notice::$REF_NAME is a minor/major — FULL build (all variants)"
              else
                echo "full=false" >> "$GITHUB_OUTPUT"
                echo "::notice::$REF_NAME is a patch — LEAN build (loomcycle-browser linux/amd64 only)"
              fi
              ;;
            *)
              echo "full=true" >> "$GITHUB_OUTPUT"
              echo "::notice::$REF_NAME is not X.Y.Z — defaulting to FULL build"
              ;;
          esac

  goreleaser:
    name: goreleaser
    needs: classify
    if: needs.classify.outputs.full == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release and upload its assets
      packages: write      # push the GHCR mirror with the built-in GITHUB_TOKEN
      id-token: write      # keyless cosign (signs: and the image step) and the attestation below
      attestations: write  # store the build-provenance attestation with GitHub
    outputs:
      # The multi-arch image manifests goreleaser pushed, for attest-images.
      images: ${{ steps.images.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser needs full git history for the version
          # template + commit-date stamp.
          fetch-depth: 0
          # On a tag push, checkout materializes the triggering ref from
          # GITHUB_SHA, which yields a LIGHTWEIGHT tag pointing at the
          # commit — the annotated tag OBJECT (and therefore its message,
          # which is our release body) never reaches the runner. See the
          # pre-create step below, which force-refetches and verifies.
          fetch-tags: true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          # The runner caches an older patch; take the newest so a stdlib fix lands.
          check-latest: true
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build embedded Web UI
        # The web UI is embedded via go:embed in internal/webui/dist
        # which `make build-ui` populates. Every cross-compiled
        # binary ships the same UI bundle.
        run: make build-ui

      # cosign (goreleaser's signs:, and the image-signing step below) and
      # syft (goreleaser's sboms:), at pinned versions. Installed before the release
      # page is pre-created, so a failed install leaves no empty release.
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          # The installer's own default, which it checks against a digest it
          # carries; a different release would be checked by signature instead.
          cosign-release: v3.0.6
      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.55.0

      # v0.11.2 Docker image steps (stubbed until operator creates the
      # Docker Hub access token). Setup-qemu enables linux/arm64 cross-
      # build via buildx on the amd64 runner. Setup-buildx wires the
      # multi-arch builder goreleaser's `dockers:` stage uses. The
      # login step is gated on DOCKER_USERNAME being set — when the
      # operator hasn't configured the secret yet, login is skipped
      # AND goreleaser runs with `--skip docker` so the pipeline
      # still builds tarballs + bumps the brew formula without
      # failing on the missing registry credentials.
      - name: Set up QEMU for multi-arch Docker builds
        if: vars.DOCKER_PUBLISH_ENABLED == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          # binfmt pinned by digest like the base images (dependabot cannot bump it).
          image: tonistiigi/binfmt:latest@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - name: Set up Docker Buildx
        if: vars.DOCKER_PUBLISH_ENABLED == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        if: vars.DOCKER_PUBLISH_ENABLED == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      # GHCR mirror (see .goreleaser.yaml's dockers: comment for WHY —
      # Docker Hub meters anonymous pulls per source IP / IPv6 /64).
      # No new secret: GITHUB_TOKEN + the job's packages:write permission.
      # Gated on the SAME var as Docker Hub because goreleaser tags one
      # built image with both registries — it cannot push half of them, so
      # a login failure on either registry fails the whole dockers stage.
      - name: Log in to GHCR
        if: vars.DOCKER_PUBLISH_ENABLED == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-create GitHub release with annotated tag body
        # Why this step exists: goreleaser's `release.mode: keep-existing`
        # (set in .goreleaser.yaml) skips updating the release body when
        # one already exists — perfect for the operator workflow where
        # the curated release notes live in the annotated tag message.
        # BUT when no release exists yet, goreleaser falls back to a
        # two-step "create draft → finish-publish" path. The
        # finish-publish PATCH intermittently 401's against the
        # workflow-issued GITHUB_TOKEN (the asset uploads work, only
        # the draft→published PATCH fails). v0.10.1 hit this on
        # 2026-05-23; v0.10.0 squeaked through three days earlier.
        #
        # By pre-creating the release as PUBLISHED here with notes from
        # the annotated tag, goreleaser's keep-existing mode finds an
        # actual published release and only appends assets — no risky
        # draft→published PATCH.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # Force-refetch the tag so we hold the annotated tag OBJECT, not
          # the lightweight ref checkout materializes from GITHUB_SHA on a
          # tag push. Without this, `%(contents)` silently falls back to the
          # COMMIT message and the release ships the squash-merge body —
          # which is exactly what happened to v1.34.0 (and, unnoticed, the
          # two releases before it).
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          # Verify it is a real annotated tag BEFORE reading its message.
          # The old emptiness check could never fire: a lightweight tag's
          # %(contents) is the commit message, which is never empty, so the
          # wrong body sailed through the guard. Check the object TYPE
          # instead — "tag" = annotated, "commit" = lightweight.
          OBJ_TYPE="$(git cat-file -t "$TAG")"
          if [ "$OBJ_TYPE" != "tag" ]; then
            echo "::error::Tag $TAG is lightweight (object type: $OBJ_TYPE), so it carries no release notes — reading it would publish the commit message instead. Re-tag annotated: git tag -a $TAG -F notes.md && git push --force origin $TAG"
            exit 1
          fi
          # Extract the annotated tag's message as the release body.
          git tag -l --format='%(contents)' "$TAG" > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::Tag $TAG has an empty annotated message. Re-tag with notes before triggering the release workflow."
            exit 1
          fi
          # Skip if release already exists (manual pre-create or retry).
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists — skipping pre-create. Goreleaser will append assets to it."
            exit 0
          fi
          gh release create "$TAG" \
            --notes-file /tmp/release-notes.md \
            --latest \
            --verify-tag \
            --title "$TAG"

      - name: Run goreleaser
        # Pinned to v2.15.4 (the version that built v0.10.0 + v0.10.1
        # successfully on the build side). `version: latest` previously
        # left us at the mercy of any breaking change in a future
        # goreleaser release; pinning gives reproducible behavior
        # across the v0.10.x release line.
        #
        # v0.11.2: GORELEASER_ARGS is computed from
        # vars.DOCKER_PUBLISH_ENABLED so the run skips the docker
        # publish stage when the operator hasn't configured Docker Hub
        # credentials yet. Once DOCKER_PUBLISH_ENABLED is set to
        # "true" in the repo's Actions vars, the same run pushes
        # multi-arch images without further config changes.
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "v2.15.4"
          # `--skip=docker` skips BOTH the dockers stage AND the
          # docker_manifests stage in goreleaser v2.15.4 (manifests
          # have no per-arch images to aggregate, so they no-op
          # cleanly). Earlier draft passed `docker,docker_manifest`
          # which goreleaser rejected — `goreleaser release --help`
          # lists only the publisher-level tokens (announce, archive,
          # docker, homebrew, publish, validate, etc.); manifest is
          # part of the docker publisher group.
          args: ${{ vars.DOCKER_PUBLISH_ENABLED == 'true' && 'release --clean' || 'release --clean --skip=docker' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # SLSA build provenance for every file SHA256SUMS lists (the archives and
      # their SBOMs), signed through this job's OIDC token and stored with
      # GitHub. `gh attestation verify <file> --repo denn-gubsky/loomcycle`
      # checks it (docs/VERIFYING-RELEASES.md).
      - name: Attest build provenance (archives and SBOMs)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      # The GHCR image manifests goreleaser pushed, by digest, for the
      # attest-images job. Only the GHCR names: a job output that contains a
      # secret's value is dropped by the runner, and the Docker Hub owner is the
      # DOCKER_USERNAME secret, so listing a Docker Hub name here emptied the
      # whole output and skipped attest-images. Nothing is lost: each Docker
      # Hub manifest has the same digest as its GHCR twin (the same per-arch
      # images joined the same way), and `gh attestation verify` looks
      # attestations up by digest. The :latest manifests share the version
      # tag's digest, so they are skipped too.
      - name: List the pushed image manifests
        id: images
        if: vars.DOCKER_PUBLISH_ENABLED == 'true'
        run: |
          set -euo pipefail
          LIST="$(jq -c '[.[]
            | select(.type == "Docker Manifest")
            | select(.name | startswith("ghcr.io/"))
            | select(.name | endswith(":latest") | not)
            | {name: (.name | sub(":[^:/]*$"; "")),
               short: (.name | sub(":[^:/]*$"; "") | split("/") | last),
               digest: .extra.Digest}]' dist/artifacts.json)"
          if [ "$(jq 'length' <<<"$LIST")" -eq 0 ]; then
            echo "::error::dist/artifacts.json lists no GHCR image manifest"
            exit 1
          fi
          if ! jq -e 'all(.[]; (.digest | type == "string") and (.digest | test("^sha256:[0-9a-f]{64}$")))' <<<"$LIST" >/dev/null; then
            echo "::error::an image manifest in dist/artifacts.json has no sha256 digest"
            exit 1
          fi
          echo "list=$LIST" >> "$GITHUB_OUTPUT"

      # Keyless cosign over every multi-arch manifest goreleaser pushed, in both
      # registries, by digest (a tag can move; the digest cannot). This runs
      # here and not as goreleaser's docker_signs: there it runs before the
      # release upload and stops goreleaser on a failure, so one registry
      # refusing a signature left a pre-created release page with no archives
      # and no Homebrew bump. Here a failure fails the job after the release is
      # complete. Each repository and digest is signed once: :latest and the
      # version tag point at the same manifest.
      - name: Sign the pushed images
        if: vars.DOCKER_PUBLISH_ENABLED == 'true'
        run: |
          set -euo pipefail
          mapfile -t REFS < <(jq -r '[.[]
            | select(.type == "Docker Manifest")
            | (.name | sub(":[^:/]*$"; "")) + "@" + .extra.Digest]
            | unique[]' dist/artifacts.json)
          if [ "${#REFS[@]}" -eq 0 ]; then
            echo "::error::dist/artifacts.json lists no image manifest to sign"
            exit 1
          fi
          for ref in "${REFS[@]}"; do
            if ! [[ "$ref" =~ @sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::image manifest without a sha256 digest: $ref"
              exit 1
            fi
          done
          cosign sign --yes "${REFS[@]}"

  # SLSA build provenance for each multi-arch image goreleaser pushed, one
  # matrix entry per GHCR image. The attestation is stored with GitHub (what
  # `gh attestation verify oci://…` reads, by digest, which also covers the
  # Docker Hub copy) and pushed next to the image in GHCR. It runs even when
  # the image-signing step failed, as long as the image list was written.
  attest-images:
    name: attest ${{ matrix.image.short }}
    needs: goreleaser
    if: ${{ !cancelled() && vars.DOCKER_PUBLISH_ENABLED == 'true' && needs.goreleaser.outputs.images != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # push the attestation to the GHCR image
      id-token: write      # sign the attestation (Sigstore, keyless)
      attestations: write  # store it with GitHub
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.goreleaser.outputs.images) }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ matrix.image.name }}
          subject-digest: ${{ matrix.image.digest }}
          push-to-registry: true
          # Storage records exist only for organisation-owned repositories;
          # this one belongs to a user, so the record call could only fail.
          create-storage-record: false

  # LEAN patch path: on a vX.Y.Z (Z>0) tag, publish ONLY the loomcycle-browser
  # linux/amd64 image — the deployable variant — and skip the binaries,
  # Homebrew, the other images, and the sandbox images (publish-sandbox-images
  # skips itself on a patch too). Adapters publish independently, gated on their
  # own version-match ("if changed"). This turns a 30+ min full build into a few
  # minutes for a bugfix release. Force the full build on a patch with a
  # workflow_dispatch (force_full=true).
  browser-patch:
    name: patch — loomcycle-browser (linux/amd64)
    needs: classify
    if: needs.classify.outputs.full == 'false'
    runs-on: ubuntu-latest
    permissions:
      # A job-level block REPLACES the workflow-level one, so packages:write
      # has to be restated here — otherwise the GHCR push 403s on a patch tag.
      contents: write      # pre-create the GitHub release from the annotated tag
      packages: write      # push the GHCR mirror of loomcycle-browser
      id-token: write      # keyless cosign signature and the attestation
      attestations: write  # store the build-provenance attestation with GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      # A patch still gets a GitHub release page carrying the annotated-tag
      # notes (no binaries attached — those are a full-build artifact). Same
      # annotated-tag verification as the goreleaser path, so a lightweight tag
      # (no notes) fails loudly instead of publishing the commit message.
      - name: Pre-create GitHub release with annotated tag body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          OBJ_TYPE="$(git cat-file -t "$TAG")"
          if [ "$OBJ_TYPE" != "tag" ]; then
            echo "::error::Tag $TAG is lightweight (object type: $OBJ_TYPE) — it carries no release notes. Re-tag annotated: git tag -a $TAG -F notes.md && git push --force origin $TAG"
            exit 1
          fi
          git tag -l --format='%(contents)' "$TAG" > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::Tag $TAG has an empty annotated message."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists — skipping pre-create."
            exit 0
          fi
          gh release create "$TAG" --notes-file /tmp/release-notes.md --latest --verify-tag --title "$TAG"

      # The image build is gated on DOCKER_PUBLISH_ENABLED, exactly like the
      # goreleaser docker stage. A patch's only artifact IS the image, so with
      # docker publishing off there is nothing more to do (the release page
      # above is still created).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: vars.DOCKER_PUBLISH_ENABLED == 'true'
        with:
          go-version: "1.26"
          # The runner caches an older patch; take the newest so a stdlib fix lands.
          check-latest: true
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: vars.DOCKER_PUBLISH_ENABLED == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build embedded Web UI
        if: vars.DOCKER_PUBLISH_ENABLED == 'true'
        run: make build-ui

      - name: Build the linux/amd64 loomcycle binary
        if: vars.DOCKER_PUBLISH_ENABLED == 'true'
        # Dockerfile.browser COPYs a pre-built binary from the context (the same
        # contract goreleaser's dockers stage uses), so build it here with the
        # SAME ldflag vars cmd/loomcycle/main.go reads (buildVersion / buildCommit
        # / buildTime), then leave it at the context root for the buildx step.
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_TIME="$(git log -1 --format=%cI)"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -trimpath \
            -ldflags "-s -w -X main.buildVersion=${VER} -X main.buildCommit=${COMMIT} -X main.buildTime=${BUILD_TIME}" \
            -o ./loomcycle ./cmd/loomcycle

      - name: Set up Docker Buildx
        if: vars.DOCKER_PUBLISH_ENABLED == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        if: vars.DOCKER_PUBLISH_ENABLED == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Log in to GHCR
        if: vars.DOCKER_PUBLISH_ENABLED == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed to BOTH registries from one build — buildx uploads the same
      # image twice, so the digests match and an operator can switch the
      # registry prefix without a version change. The source label is what
      # links the GHCR package to this repo in the UI.
      - name: Build + push loomcycle-browser (linux/amd64)
        id: push
        if: vars.DOCKER_PUBLISH_ENABLED == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.browser
          platforms: linux/amd64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/denn-gubsky/loomcycle
          tags: |
            denngubsky/loomcycle-browser:${{ needs.classify.outputs.version }}
            denngubsky/loomcycle-browser:latest
            ghcr.io/denn-gubsky/loomcycle-browser:${{ needs.classify.outputs.version }}
            ghcr.io/denn-gubsky/loomcycle-browser:latest

      # The same signature and provenance a full release gives its images
      # (the goreleaser job's image-signing step, attest-images). One build
      # pushed the same bytes to both registries, so both names carry one
      # digest: cosign signs each copy, and the attestation pushed to GHCR is
      # also what `gh attestation verify` finds for the Docker Hub copy.
      - name: Install cosign
        if: vars.DOCKER_PUBLISH_ENABLED == 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.0.6
      - name: Sign loomcycle-browser
        if: vars.DOCKER_PUBLISH_ENABLED == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes \
            "docker.io/denngubsky/loomcycle-browser@${DIGEST}" \
            "ghcr.io/denn-gubsky/loomcycle-browser@${DIGEST}"
      - name: Attest build provenance
        if: vars.DOCKER_PUBLISH_ENABLED == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/denn-gubsky/loomcycle-browser
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

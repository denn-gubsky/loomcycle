      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "@loomcycle/*"
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]


# Dependency version updates (RFC ES #11, P5c).
#
# Version updates run weekly. npm is one entry over every package directory,
# grouped by dependency name (one PR per dependency across all packages); the
# other ecosystems group minor and patch updates per entry, majors one PR each. Security updates are
# not configured here: they are a repository setting (Settings → Code security
# → Dependabot security updates), open as soon as an alert fires, and are never
# folded into these groups (`applies-to: version-updates`).
#
# Deliberate exclusions:
# - gbash (the Bashbox sandbox) is alpha and pinned; a bump must quote the
#   upstream changelog and pass the escape suite, so it comes in its own group.
# - @loomcycle/* packages and denngubsky/* images are this repo's own; a
#   consumer or compose file moves to a new release by hand, in step with the
#   release, not weekly.
# - deploy/truenas/catalog/templates holds a Jinja template, not plain YAML,
#   and examples/ compose files are illustrations; neither is scanned.
# - The golang base images track the Go line CI builds with (ci.yml,
#   release.yml, go.mod); moving to a new Go minor is a toolchain decision.

version: 2

updates:
  # --- Go modules ---------------------------------------------------------
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # gbash and its contrib/awk and contrib/jq modules release in lockstep;
      # one PR moves all three, apart from every other Go update.
      gbash:
        applies-to: version-updates
        patterns:
          - "github.com/ewhauser/gbash*"
      go-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        exclude-patterns:
          - "github.com/ewhauser/gbash*"

  - package-ecosystem: gomod
    directory: /deploy/builder
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  # --- npm: every tracked package-lock.json, one entry --------------------
  # One entry over all 13 directories (each keeps its own lockfile; there is no
  # workspace), grouped by dependency name: a bump of one package arrives as ONE
  # pull request touching every directory that uses it, not one per directory.
  # Majors of the dev toolchain are ignored here and taken by hand: they need
  # code changes across packages and rarely apply as a bare version bump.
  # @loomcycle/* is this repo's own (see the header).
  - package-ecosystem: npm
    directories:
      - /adapters/ts
      - /web
      - /packages/bridge-core
      - /packages/bridge-discord
      - /packages/bridge-slack
      - /packages/bridge-teams
      - /packages/bridge-telegram
      - /packages/def-fields
      - /packages/explorer
      - /packages/library
      - /packages/loomboard
      - /packages/memory-view
      - /cloud-deployment/landing
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "@loomcycle/*"
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-by-dependency:
        applies-to: version-updates
        group-by: dependency-name
        patterns: ["*"]

  # --- Python adapter (pyproject.toml) -------------------------------------
  - package-ecosystem: pip
    directory: /adapters/python
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      pip-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  # --- GitHub Actions -----------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  # --- Docker base images: every directory with a tracked Dockerfile ------
  - package-ecosystem: docker
    directories:
      - /
      - /cloud-deployment/landing
      - /cloud-deployment/loomboard
      - /deploy/bridges
      - /deploy/builder
      - /deploy/builder/session
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: golang
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      docker-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  # --- Docker Compose images (exclusions in the header) -------------------
  - package-ecosystem: docker-compose
    directories:
      - /
      - /cloud-deployment
      - /deploy/truenas
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "denngubsky/*"
    groups:
      compose-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

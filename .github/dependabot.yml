# Dependency version updates (RFC ES #11, P5c).
#
# Version updates run weekly. npm, and Go over the root and its in-tree modules,
# are each one entry over every directory, grouped by dependency name (one PR per
# dependency across all of them); the other ecosystems group minor and patch
# updates per entry, majors one PR each. Security updates are
# not configured here: they are a repository setting (Settings → Code security
# → Dependabot security updates), open as soon as an alert fires, and are never
# folded into these groups (`applies-to: version-updates`).
#
# Deliberate exclusions:
# - gbash (the Bashbox sandbox) is alpha and pinned; a bump must quote the
#   upstream changelog and pass the escape suite, so it comes in its own group.
# - @loomcycle/* packages and denngubsky/* images are this repo's own; a
#   consumer or compose file moves to a new release by hand, in step with the
#   release, not weekly.
# - deploy/truenas/catalog/templates holds a Jinja template, not plain YAML,
#   and examples/ compose files are illustrations; neither is scanned.
# - The golang base images track the Go line CI builds with (ci.yml,
#   release.yml, go.mod); moving to a new Go minor is a toolchain decision.
# - modernc.org/sqlite 1.61.x: v1.61.0 (with modernc.org/libc v1.79.0) makes
#   CI's race jobs report data races inside encoding/json, and v1.60.1 does not
#   (#2173, closed). Drop the ignore once a release passes the race jobs.
# - github.com/a2aproject/a2a-go/v2 2.7.x: v2.7.0 serves A2A protocol 1.0 only
#   and refuses a 0.3 request with VERSION_NOT_SUPPORTED, so every A2A peer
#   still on 0.3 (and the A2A test suite) is refused (#2164 merged red).
#   Moving to it is a protocol decision with its own change, not a bump.
# - postgres majors in compose files: a new major is not a tag bump. The 18
#   image refuses a volume at /var/lib/postgresql/data, and an existing data
#   directory needs pg_upgrade or a dump and restore (#2163 and #2180 each
#   moved the cluster compose to 18). Minor and patch updates still arrive.

version: 2

updates:
  # --- Go modules ---------------------------------------------------------
  # One entry over the root and every in-tree module it replaces (RFC FE),
  # grouped by dependency name like npm below: a bump of one dependency arrives
  # as ONE pull request touching every go.mod that requires it. The root builds
  # with the highest version any module requires, so bumping the modules one at
  # a time would leave CI's per-module tidy check failing until someone ran
  # `make tidy-all`; bumping them together keeps every go.mod in step. Add a new
  # in-tree module's directory here when the root go.mod gains its replace.
  - package-ecosystem: gomod
    directories:
      - /
      - /internal/errkind
      - /internal/otel
      - /internal/providers
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # See the header: 1.61.x trips the race jobs.
      - dependency-name: "modernc.org/sqlite"
        versions: ["1.61.x"]
      # See the header: 2.7.x refuses A2A protocol 0.3.
      - dependency-name: "github.com/a2aproject/a2a-go/v2"
        versions: ["2.7.x"]
    groups:
      # gbash and its contrib/awk and contrib/jq modules release in lockstep;
      # one PR moves all three, apart from every other Go update. A group listed
      # first wins, so gbash never lands in the per-dependency groups below.
      gbash:
        applies-to: version-updates
        patterns:
          - "github.com/ewhauser/gbash*"
      go-by-dependency:
        applies-to: version-updates
        group-by: dependency-name
        patterns: ["*"]
        exclude-patterns:
          - "github.com/ewhauser/gbash*"

  # deploy/builder is a standalone module the root does not replace (its own
  # release, stdlib only), so it keeps its own entry.
  - package-ecosystem: gomod
    directory: /deploy/builder
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  # --- npm: every tracked package-lock.json, one entry --------------------
  # One entry over all 13 directories (each keeps its own lockfile; there is no
  # workspace), grouped by dependency name: a bump of one package arrives as ONE
  # pull request touching every directory that uses it, not one per directory.
  # Majors of the dev toolchain are ignored here and taken by hand: they need
  # code changes across packages and rarely apply as a bare version bump.
  # @loomcycle/* is this repo's own (see the header).
  - package-ecosystem: npm
    directories:
      - /adapters/ts
      - /web
      - /packages/bridge-core
      - /packages/bridge-discord
      - /packages/bridge-slack
      - /packages/bridge-teams
      - /packages/bridge-telegram
      - /packages/def-fields
      - /packages/explorer
      - /packages/library
      - /packages/loomboard
      - /packages/memory-view
      - /cloud-deployment/landing
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "@loomcycle/*"
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-by-dependency:
        applies-to: version-updates
        group-by: dependency-name
        patterns: ["*"]

  # --- Python adapter (pyproject.toml) -------------------------------------
  - package-ecosystem: pip
    directory: /adapters/python
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      pip-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  # --- GitHub Actions -----------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  # --- Docker base images: every directory with a tracked Dockerfile ------
  - package-ecosystem: docker
    directories:
      - /
      - /cloud-deployment/landing
      - /cloud-deployment/loomboard
      - /deploy/bridges
      - /deploy/builder
      - /deploy/builder/session
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: golang
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      docker-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  # --- Docker Compose images (exclusions in the header) -------------------
  - package-ecosystem: docker-compose
    directories:
      - /
      - /cloud-deployment
      - /deploy/truenas
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "denngubsky/*"
      # See the header: a Postgres major needs a data migration.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
    groups:
      compose-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

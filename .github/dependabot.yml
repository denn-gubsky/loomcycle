    directories:
      - /
      - /cloud-deployment/landing
      - /cloud-deployment/loomboard
      - /deploy/bridges
      - /deploy/builder
      - /deploy/builder/session
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: golang
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      docker-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

# Dependency version updates (RFC ES #11, P5c).
#
# Version updates run weekly, with minor and patch updates grouped into one PR
# per ecosystem and directory; majors arrive one PR each. Security updates are
# not configured here: they are a repository setting (Settings → Code security
# → Dependabot security updates), open as soon as an alert fires, and are never
# folded into these groups (`applies-to: version-updates`).
#
# Deliberate exclusions:
# - gbash (the Bashbox sandbox) is alpha and pinned; a bump must quote the
#   upstream changelog and pass the escape suite, so it comes on its own.
# - @loomcycle/* packages are this repo's own; a consumer moves to a new sibling
#   release by hand, in step with the release, not weekly.
# - The golang base images track the Go line CI builds with (ci.yml,
#   release.yml, go.mod); moving to a new Go minor is a toolchain decision.

version: 2

updates:
  # --- Go modules ---------------------------------------------------------
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        exclude-patterns:
          - "github.com/ewhauser/gbash*"

  - package-ecosystem: gomod
    directory: /deploy/builder
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  # --- npm: one entry per tracked package-lock.json ------------------------

openapi: 3.1.0
info:
  title: loomcycle data API (memory, documents, decision models, crypto, password gate management)
  version: "1.0.0"
  description: |
    The external HTTP data API for loomcycle's **memory** and **document/path**
    storage, plus the **decision-model** routes (typed questions about state the
    caller supplies) and the **crypto** route (encrypt, sign and verify with keys
    the runtime holds). Every route here already existed — this contract publishes
    them so any language can generate a client (e.g. `openapi-generator`) instead
    of hand-rolling requests, and so a peer instance or a second application can
    consume the store directly. It is not the whole HTTP API: the run, usage,
    limit and definition routes are not described here.

    **Auth.** All data routes require a bearer token minted by an
    `OperatorTokenDef`, carrying an authoritative `(tenant, subject, scopes)`.
    The memory + document + path families require the `substrate:tenant` scope,
    and are also reachable by a **non-isolated tenant member** (a `runs:*` /
    `channel:*` user token) — an isolated `substrate:user` token is confined and
    refused. The tenant is always derived server-side from the token, NEVER from
    the request; the `?scope_id=` / `?tenant=` query params only re-focus a
    browse WITHIN the caller's authorized tenant (admin may cross tenants).
    The decision routes require the `runs:create` scope instead: a decision is
    what a caller would otherwise start a run to get, and it spends the same
    token budget. The **crypto** route (`/v1/_crypto`) requires
    `substrate:tenant` and is NOT open to a tenant's members: decrypting with
    the tenant's keys would let a member read whatever the tenant sealed.
    The **password gate management** routes (`/v1/_authgate/{gate}/…`) require
    `substrate:tenant` (own tenant) or an `auth:manage` token — a website's
    user-management credential that reaches only these routes and the
    `/v1/_users` create / list / update / delete, across tenants.

    The spec document itself (`/v1/openapi.yaml`, `/v1/openapi.json`) and the
    docs console (`/v1/docs`) are served unauthenticated — the contract is
    non-secret; the data behind it is not.
servers:
  - url: /
    description: This loomcycle instance (relative to the API host).
security:
  - bearerAuth: []
tags:
  - name: memory
    description: Key/value + vector memory (scopes agent/user/tenant).
  - name: documents
    description: Chunked-graph documents and the Path VFS (op-dispatch).
  - name: decision
    description: Decision models — typed questions about supplied state, answered with probabilities.
  - name: crypto
    description: Encrypt, decrypt, sign, verify, MAC and one-time codes with keys the runtime holds.
  - name: authgate
    description: Password gate management — invitations, reset links, logins. Never a password.
  - name: auth
    description: |
      Web UI sign-in and sign-out (server-side sessions). A request a session
      cookie authenticates that changes state must send `X-Loomcycle-UI: 1`
      from the server's own origin; requests with an `Authorization` header
      are not affected.
paths:
  /v1/_memory/scopes:
    get:
      tags: [memory]
      summary: List the memory scope kinds.
      operationId: listMemoryScopes
      responses:
        "200":
          description: The constant set of scope kinds.
          content:
            application/json:
              schema:
                type: object
                properties:
                  scopes:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string, enum: [agent, user, tenant] }
                        description: { type: string }
                      required: [name, description]
                required: [scopes]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/_memory/scopes/{scope}:
    get:
      tags: [memory]
      summary: List the scope_ids under a scope, with per-scope_id summaries.
      operationId: listMemoryScopeIDs
      parameters:
        - $ref: "#/components/parameters/Scope"
      responses:
        "200":
          description: Scope_id summaries for the caller's tenant.
          content:
            application/json:
              schema:
                type: object
                properties:
                  scope: { type: string }
                  scope_ids:
                    type: array
                    items: { $ref: "#/components/schemas/MemoryScopeIDSummary" }
                required: [scope, scope_ids]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/_memory/scopes/{scope}/{scope_id}/keys:
    get:
      tags: [memory]
      summary: List entries under a (scope, scope_id).
      operationId: listMemoryEntries
      parameters:
        - $ref: "#/components/parameters/Scope"
        - $ref: "#/components/parameters/ScopeIDPath"
        - name: prefix
          in: query
          required: false
          schema: { type: string }
          description: Return only keys with this prefix.
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 200, maximum: 1000 }
        - name: include_embedding_metadata
          in: query
          required: false
          schema: { type: boolean }
          description: Include per-key embedding provider/model/dimension (vector stores only).
      responses:
        "200":
          description: The entries (embedding vectors are never serialized).
          content:
            application/json:
              schema:
                type: object
                properties:
                  scope: { type: string }
                  scope_id: { type: string }
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/MemoryEntry" }
                  truncated: { type: boolean }
                  embedding_metadata:
                    type: object
                    additionalProperties: { $ref: "#/components/schemas/EmbedMeta" }
                required: [scope, scope_id, entries, truncated]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/_memory/scopes/{scope}/{scope_id}/keys/{key}:
    parameters:
      - $ref: "#/components/parameters/Scope"
      - $ref: "#/components/parameters/ScopeIDPath"
      - $ref: "#/components/parameters/MemoryKey"
    get:
      tags: [memory]
      summary: Get one entry.
      operationId: getMemoryEntry
      responses:
        "200":
          description: The entry.
          content:
            application/json:
              schema:
                type: object
                properties:
                  scope: { type: string }
                  scope_id: { type: string }
                  entry: { $ref: "#/components/schemas/MemoryEntry" }
                required: [scope, scope_id, entry]
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [memory]
      summary: Upsert an entry (idempotent).
      operationId: setMemoryEntry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryEntryPutBody" }
      responses:
        "200":
          description: The upsert result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  scope: { type: string }
                  scope_id: { type: string }
                  key: { type: string }
                  embedded: { type: boolean }
                  embed_warning: { type: string }
                required: [scope, scope_id, key, embedded]
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [memory]
      summary: Delete an entry (idempotent).
      operationId: deleteMemoryEntry
      responses:
        "204": { description: Deleted (or already absent). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/_memory/search:
    post:
      tags: [memory]
      summary: Semantic search over KV entries and document-chunk bodies.
      operationId: memorySearch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemorySearchRequest" }
      responses:
        "200":
          description: Ranked results.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemorySearchResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/_memory/embed_stats:
    get:
      tags: [memory]
      summary: Per-(provider, model) embedding statistics for a scope.
      operationId: memoryEmbedStats
      parameters:
        - name: scope
          in: query
          required: true
          schema: { type: string, enum: [agent, user, tenant] }
        - name: tenant
          in: query
          required: false
          schema: { type: string }
          description: Admin-only tenant focus; ignored for a non-admin (confined to its own tenant).
      responses:
        "200":
          description: Embedding stats.
          content:
            application/json:
              schema:
                type: object
                properties:
                  scope: { type: string }
                  tenant: { type: string }
                  models:
                    type: array
                    items: { $ref: "#/components/schemas/EmbedModelStats" }
                  total_embedding_bytes: { type: integer }
                  notes: { type: array, items: { type: string } }
                required: [scope, tenant, models, total_embedding_bytes]
        "503": { $ref: "#/components/responses/Unavailable" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/_memory/reembed:
    post:
      tags: [memory]
      summary: Re-embed a scope's entries under the current embedder (migration).
      description: |
        All parameters are query parameters (no request body). `dry_run` defaults
        to true; pass `dry_run=false` to commit. Returns a dry-run report or a
        real-run report depending on `dry_run`.
      operationId: reembedMemory
      parameters:
        - name: scope
          in: query
          required: true
          schema: { type: string, enum: [agent, user, tenant] }
        - name: scope_id
          in: query
          required: false
          schema: { type: string }
          description: Required for agent/user scopes.
        - name: dry_run
          in: query
          required: false
          schema: { type: boolean, default: true }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 1000, maximum: 10000 }
      responses:
        "200":
          description: Dry-run report (dry_run=true) or real-run report (dry_run=false).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReembedDryRun"
                  - $ref: "#/components/schemas/ReembedReal"
        "503": { $ref: "#/components/responses/Unavailable" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/_document:
    post:
      tags: [documents]
      summary: Document tool op-dispatch (create/read/update chunks, search, versioning, ...).
      description: |
        A single op-dispatch endpoint: the request body is the `Document` tool's
        input, discriminated on `op`. On success the response is the tool's own
        JSON result (shape varies by `op`). A tool refusal returns HTTP 422 with
        `{code:"tool_refused", tool:"Document", error}`. Requires SQL Memory.
      operationId: documentOp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentToolInput" }
      responses:
        "200":
          description: The tool's JSON result (op-dependent).
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/ToolRefused" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/_path:
    post:
      tags: [documents]
      summary: Path VFS op-dispatch (resolve/ls/stat/mkdir/mv/rm).
      description: |
        A single op-dispatch endpoint over the Path VFS; the request body is the
        `Path` tool's input, discriminated on `op`. Response and error semantics
        mirror `/v1/_document`.
      operationId: pathOp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PathToolInput" }
      responses:
        "200":
          description: The tool's JSON result (op-dependent).
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/ToolRefused" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/_crypto:
    post:
      tags: [crypto]
      summary: Crypto tool op-dispatch outside a run (encrypt/decrypt/rewrap/mac/verify_mac/sign/verify/public_key/totp/hash/random).
      description: |
        The `Crypto` tool's operations for an operator or a service outside any
        run, such as a backend that encrypts a field before writing it to its
        own database. The request body is the tool's input, discriminated on
        `op`; the response is the tool's own JSON result (shape varies by `op`).
        Key material is never returned.

        **Who and which keys.** Requires `substrate:tenant` (or
        `substrate:admin`); a tenant's members and run-plane tokens are refused.
        A call uses its tenant's keys and its own subject's user keys, never an
        agent's, and there are no run credentials outside a run. An admin may
        name another tenant with `tenant`, and then uses that tenant's keys only.

        **Interop.** The ciphertext envelope and its associated data are the
        in-run tool's own, so a value this route encrypts decrypts in the
        tenant's runs, and the reverse. Decrypt and verify failures are opaque.

        **Limits.** Each call takes one from the token's run rate, when the
        token has one (`429` with `Retry-After`). Each data argument is capped
        (`LOOMCYCLE_CRYPTO_MAX_BYTES`).
      operationId: cryptoOp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CryptoToolInput" }
      responses:
        "200":
          description: The tool's JSON result (op-dependent).
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/ToolRefused" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429":
          description: "`rate_limited`: the token's rate is spent. Retry after `Retry-After` seconds."
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/_document/asset/{chunk_id}:
    get:
      tags: [documents]
      summary: Fetch a chunk's binary image asset.
      operationId: getDocumentAsset
      parameters:
        - name: chunk_id
          in: path
          required: true
          schema: { type: string }
        - name: scope
          in: query
          required: false
          schema: { type: string, enum: [agent, user, tenant] }
      responses:
        "200":
          description: The stored image bytes (whitelisted media type; nosniff).
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "404":
          description: Missing, wrong-scope, or non-image chunk (opaque — no cross-scope probing).
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/_decide:
    post:
      tags: [decision]
      summary: Ask a decision model typed questions about a piece of state.
      description: |
        Asks one of the operator's decision models every question in the body
        about the same `state`, outside any run. The body is the `Decision`
        tool's input and a 200 is the tool's output: each answer is returned
        exactly as the model gave it.

        **The probabilities are not calibrated.** Compare options within one
        answer; do not treat a fixed threshold as a guarantee without measuring
        it on your own data.

        **The request is never shortened.** State, instructions and criteria
        must fit the model's context together; a request that does not fit is
        refused with `prompt_too_large` (413), not trimmed.

        The call is charged to the caller's own tenant and subject and counts
        against their token budgets; a caller at a hard budget is refused (429)
        before the model is asked. Requires the `runs:create` scope.
      operationId: decide
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecisionRequest" }
            examples:
              ticket:
                summary: One choice, one noul and one score about a support ticket.
                value:
                  model: decide
                  state:
                    ticket: My invoice for March was charged twice and I want my money back.
                    customer_tier: gold
                  questions:
                    route:
                      type: choice
                      instructions: Which team should handle this ticket?
                      criteria:
                        billing: invoices, refunds, charges
                        support: bugs, outages, login problems
                        sales: upgrades, quotes
                    urgent:
                      type: noul
                      instructions: Does this ticket need a reply within the hour?
                    detail:
                      type: score
                      instructions: How complete is the problem report?
                      criteria: [no detail, some detail, everything needed]
      responses:
        "200":
          description: The model's answers, one per question, under the question's name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DecisionResponse" }
              examples:
                ticket:
                  summary: The answers to the request example.
                  value:
                    model: decide
                    provider: ollama-local
                    served_model: nimble
                    answers:
                      detail:
                        type: score
                        score: 1.874
                        legend: { "0": no detail, "1": some detail, "2": everything needed }
                        probabilities: { "0": 0.039, "1": 0.048, "2": 0.913 }
                        confidence: 0.677
                      route:
                        type: choice
                        choice: billing
                        probabilities: { billing: 0.983, support: 0.007, sales: 0.011 }
                        confidence: 0.911
                      urgent:
                        type: noul
                        noul: 0.316
                    usage: { input_tokens: 1059, output_tokens: 4 }
        "400":
          description: |
            The request is not a call the model can be asked. `bad_request`: an
            empty or unreadable body. `invalid_input`: not JSON, or no `state`
            object. `bad_question`: an unknown type, missing instructions, no
            questions, or criteria of the wrong shape for the type.
            `bad_options`: too few or too many options or levels.
            `too_many_questions`: more questions than one call takes.
            `model_not_allowed`: the model named is not on the allowed list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DecisionError" }
              examples:
                bad_request:
                  value: { code: bad_request, error: "empty body: expected {state, questions}" }
                invalid_input:
                  value:
                    code: invalid_input
                    error: "Decision: invalid_input: state is required and must be a JSON object"
                    errorCategory: validation
                    isRetryable: false
                    description: Pass `state` (a JSON object holding what the questions are about) and `questions` (an object of named questions).
                bad_question:
                  value:
                    code: bad_question
                    error: "Decision: bad_question: question \"q\": type \"essay\" is not one of choice, noul, score"
                    errorCategory: validation
                    isRetryable: false
                    description: "Each question needs a type (choice, noul or score), instructions, and criteria in that type's shape: choice, an object mapping each option to a description or null; noul, nothing or an object describing \"true\" and \"false\"; score, an array of level descriptions, lowest first."
                bad_options:
                  value:
                    code: bad_options
                    error: "Decision: bad_options: question \"q\": 1 options; a choice takes 2 to 26"
                    errorCategory: validation
                    isRetryable: false
                    description: "A choice takes 2 to 26 options and a score 2 to 26 levels: add or remove some, or split the question in two."
                too_many_questions:
                  value:
                    code: too_many_questions
                    error: "Decision: too_many_questions: 65 questions; one call takes at most 64"
                    errorCategory: validation
                    isRetryable: false
                    description: "One call takes at most 64 questions: split them across several calls."
                model_not_allowed:
                  value:
                    code: model_not_allowed
                    error: "Decision: model_not_allowed: model \"gpt\" is not one this agent may ask"
                    errorCategory: validation
                    isRetryable: false
                    description: "Omit `model` to use the default, or name one of: decide, deep."
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: |
            `operator_key_restricted`: the caller may not use the operator's
            provider key and has none of its own for this provider.
            `insufficient_scope`: the token lacks the `runs:create` scope;
            `required_scope` names it, as does the `WWW-Authenticate` header.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/DecisionError"
                  - $ref: "#/components/schemas/ForbiddenError"
              examples:
                insufficient_scope:
                  value: { code: insufficient_scope, error: insufficient scope, required_scope: "runs:create" }
                operator_key_restricted:
                  value:
                    code: operator_key_restricted
                    error: "Decision: operator_key_restricted: this run may not use the operator's provider key, and has none of its own for this provider"
                    errorCategory: permission
                    isRetryable: false
                    description: This principal may not use the operator's provider API keys. Retrying will not help — supply the tenant's own provider credential, or ask an operator for the scope that permits it.
        "413":
          description: |
            `request_too_large`: the body exceeds the server's request cap and
            was refused before it was read. `prompt_too_large`: the state and
            questions do not fit the model's context; nothing is shortened.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DecisionError" }
              examples:
                request_too_large:
                  value: { code: request_too_large, error: request body exceeds the 512-byte limit }
                prompt_too_large:
                  value:
                    code: prompt_too_large
                    error: "Decision: prompt_too_large: the request is 12144 tokens and this model reads at most 8194"
                    errorCategory: business
                    isRetryable: false
                    description: Nothing is shortened for you. Shorten the state or the criteria, or ask fewer questions per call, and send it again.
        "429":
          description: |
            `token_limit_exceeded`: the caller is at a hard token budget. The
            model was not asked. The body names the budget that tripped.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenLimitError" }
              examples:
                token_limit_exceeded:
                  value:
                    code: token_limit_exceeded
                    error: "user alice hard token budget reached: 1120 of 1000 tokens this month"
                    message: "user alice hard token budget reached: 1120 of 1000 tokens this month"
                    scope: user
                    scope_id: alice
                    used: 1120
                    limit: 1000
                    window: month
        "500":
          description: "`internal`: the server could not dispatch the call. `error` is the fault's own text."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: |
            The call reached no answer. `model_not_found`: the provider does not
            serve the model the alias names, so the same call fails again.
            `call_failed`: the call did not complete (the transport, the key, an
            unreadable reply); it may be sent once more.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DecisionError" }
              examples:
                model_not_found:
                  value:
                    code: model_not_found
                    error: "Decision: model_not_found: /v1/systemone: HTTP 404: model \"nimble\" not found"
                    errorCategory: business
                    isRetryable: false
                    description: "The provider does not serve this model, so the same call will fail again. Name another of: decide, deep."
                call_failed:
                  value:
                    code: call_failed
                    error: "Decision: call_failed: the call to the decision model failed: /v1/systemone: HTTP 500: boom"
                    errorCategory: transient
                    isRetryable: true
                    description: Send the same call once more. If it fails again, continue without the decision and say that it was unavailable.
        "503":
          description: "`decision_not_configured`: this deployment declares no decision models."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DecisionError" }
              examples:
                decision_not_configured:
                  value:
                    code: decision_not_configured
                    error: "Decision: decision_not_configured: this deployment declares no decision models"
                    errorCategory: business
                    isRetryable: false
                    description: No call to this tool can succeed here. Decide another way, or ask an operator to declare decision models.
        "504":
          description: "`timeout`: the model, or the wait for a free slot, did not answer in time."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DecisionError" }
              examples:
                timeout:
                  value:
                    code: timeout
                    error: "Decision: timeout: the decision model did not answer in time"
                    errorCategory: transient
                    isRetryable: true
                    description: Send the same call again. If it times out again, ask fewer questions or shorten the state.
  /v1/_decide/models:
    get:
      tags: [decision]
      summary: List the decision models a call may name, the default, and each model's limits.
      description: |
        Nothing here is secret: no endpoint and no key name. Requires the
        `runs:create` scope.
      operationId: listDecisionModels
      responses:
        "200":
          description: The default model's name and the models a call may name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DecisionModelList" }
              examples:
                models:
                  value:
                    default: decide
                    models:
                      - name: decide
                        provider: ollama-local
                        model: nimble
                        limits: { max_questions: 64, min_options: 2, max_options: 26 }
                      - name: decide-deep
                        provider: ollama-local
                        model: clef
                        limits: { max_questions: 64, min_options: 2, max_options: 26 }
        "503":
          description: "`decision_not_configured`: this deployment declares no decision models."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                decision_not_configured:
                  value: { code: decision_not_configured, error: this deployment declares no decision models }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /ui/login-config.json:
    get:
      tags: [auth]
      summary: What the Web UI sign-in page offers.
      description: |
        Unauthenticated. The mode, the configured gates (name, kind, label
        only), the origins the postMessage handoff may accept a token from
        (token mode only), and `session_refused` when this request cannot
        start a session (e.g. strict mode over plain HTTP). Nothing else about
        the deployment.
      operationId: getLoginConfig
      security: []
      responses:
        "200":
          description: The sign-in options.
          content:
            application/json:
              schema:
                type: object
                required: [login_origins, api_level, mode, gates]
                properties:
                  login_origins: { type: array, items: { type: string } }
                  api_level: { type: integer, description: The Web UI API level (2 from Web UI sessions on). }
                  mode: { type: string, enum: [open, token, strict] }
                  gates:
                    type: array
                    items:
                      type: object
                      required: [name, kind, label]
                      properties:
                        name: { type: string }
                        kind: { type: string, description: "The gate kind; `token` in this release." }
                        label: { type: string }
                  session_refused: { type: string, enum: [insecure_transport] }
  /ui/session:
    post:
      tags: [auth]
      summary: Sign in to the Web UI with a token (the token gate).
      description: |
        The bearer is validated, then a server-side session is created and
        an HttpOnly session cookie set (`__Host-lc_session` over HTTPS,
        `lc_session` over plain HTTP); the browser never keeps the token. A
        session cookie already present is ended (fixation). Must be a
        same-origin request (`Sec-Fetch-Site: same-origin`, or an `Origin`
        naming this host).
      operationId: createUISession
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Signed in; the session cookie is set. }
        "400":
          description: "`missing_bearer`: no `Authorization: Bearer` header."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: "`invalid_credentials`: opaque — the token does not authenticate. Audited `auth_login_failed`; nothing is created."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: "`cross_site_login_refused`, `gate_unavailable` (strict mode lists no token gate) or `insecure_transport` (strict mode over plain HTTP without LOOMCYCLE_UI_INSECURE_COOKIES)."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: "`open_mode`: authentication is off; no session is needed."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /v1/_users/{subject}/approve:
    post:
      tags: [auth]
      summary: Approve a user awaiting approval (pending → active).
      description: |
        RFC FA §3.7a. A tenant operator in its own tenant, an admin in any
        (`?tenant=`), an `auth:manage` credential only for a user at the
        provisioning floor. Audited `auth_user_approved`. `409 not_pending` for
        a user that is not pending. PATCH cannot take a pending user to active.
      operationId: approveUser
      parameters:
        - { name: subject, in: path, required: true, schema: { type: string } }
        - { name: tenant, in: query, schema: { type: string } }
      responses:
        "200": { description: The user, now active. }
        "404": { description: "`user_not_found` (also another tenant's user)." }
        "409": { description: "`not_pending`." }
  /v1/_users/{subject}/identities:
    get:
      tags: [auth]
      summary: A user's sign-in identities (no secrets).
      description: The user itself, or a tenant operator / admin held to `read principal:user:<subject>`.
      operationId: listUserIdentities
      parameters:
        - { name: subject, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "`{subject, identities: [{gate, issuer, external_subject, email, email_verified, created_at, last_login_at}]}`." }
    post:
      tags: [auth]
      summary: Start linking another OIDC gate's account to this user (RFC FA D14).
      description: |
        Only the user itself, from its own Web UI session signed in within
        `auth.session.reauth_window` (`403 reauth_required` otherwise). Answers
        `{redirect}`, the provider URL of a fresh sign-in (prompt=login,
        max_age=0); the callback links the account only if it maps to the
        user's tenant and belongs to nobody yet. Never inferred from an e-mail.
      operationId: linkUserIdentity
      parameters:
        - { name: subject, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [gate]
              properties:
                gate: { type: string }
      responses:
        "200": { description: "`{redirect}`." }
        "403": { description: "`link_needs_own_session` or `reauth_required`." }
        "409": { description: "`already_linked` or `same_gate`." }
  /v1/_users/{subject}/identities/{gate}:
    delete:
      tags: [auth]
      summary: Unlink an identity-gate account; its sessions end.
      description: The user from its own session after a recent sign-in, or a tenant operator / admin held to `manage principal:user:<subject>`. Password logins have their own route.
      operationId: unlinkUserIdentity
      parameters:
        - { name: subject, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/Gate" }
      responses:
        "204": { description: Unlinked. }
        "404": { description: "`identity_not_found`." }
  /v1/_auth/logout:
    post:
      tags: [auth]
      summary: End the Web UI session.
      description: |
        Revokes the session on the server (on every replica), clears every Web
        UI cookie and sends `Clear-Site-Data: "cookies", "storage"`. Works
        with an expired session too. Requires `X-Loomcycle-UI: 1` and a
        same-origin request, so no other site can sign a user out.
      operationId: deleteUISession
      security: []
      parameters:
        - { name: X-Loomcycle-UI, in: header, required: true, schema: { type: string, enum: ["1"] } }
      responses:
        "204": { description: Signed out. }
        "403":
          description: "`cross_origin_refused`: the header or the same-origin check is missing."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503":
          description: "`logout_failed`: the session could not be ended; retry."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /v1/_auth/device:
    post:
      tags: [auth]
      summary: Start a device login (RFC 8628 §3.1).
      description: |
        Needs a `kind: device` gate. Unauthenticated: the person's approval in
        the Web UI is the credential. Returns the device code (the client keeps
        it), the user code and the verification link to show the person. Each
        client address may start a bounded number per 15 minutes.
      operationId: startDeviceLogin
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [client_id]
              properties:
                client_id: { type: string, description: "1-64 of letters, digits, - _ . : — shown on the approval page." }
                scope: { type: string, description: "Must be absent: the token carries the approver's own scopes." }
      responses:
        "200":
          description: The code pair.
          content:
            application/json:
              schema:
                type: object
                properties:
                  device_code: { type: string }
                  user_code: { type: string, example: BCDF-GHJK }
                  verification_uri: { type: string }
                  verification_uri_complete: { type: string }
                  expires_in: { type: integer }
                  interval: { type: integer }
        "400": { description: "RFC 6749 error: `invalid_client`, `invalid_scope`, `invalid_request`." }
        "404": { description: "`device_login_disabled`: no device gate." }
        "429": { description: "`slow_down`: too many device logins from this address." }
  /v1/_auth/device/token:
    post:
      tags: [auth]
      summary: Poll a device login (RFC 8628 §3.4).
      description: |
        Answers `authorization_pending` until the person approves, `slow_down`
        (and a 5 s longer interval from then on) when polled early,
        `access_denied`, `expired_token`, or `invalid_grant` (unknown or
        already used). After approval the first poll receives a token issued
        to the person who approved: their member scopes, tagged with the gate
        their session came through, at most the device gate's `token_ttl`,
        that gate's limit and LOOMCYCLE_USER_TOKEN_MAX_TTL_SECONDS. A code
        yields one token. A source polling unknown codes is blocked for a while.
      operationId: pollDeviceLogin
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, device_code, client_id]
              properties:
                grant_type: { type: string, enum: ["urn:ietf:params:oauth:grant-type:device_code"] }
                device_code: { type: string }
                client_id: { type: string }
      responses:
        "200":
          description: The issued token (shown once).
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, enum: [Bearer] }
                  expires_in: { type: integer }
                  scope: { type: string }
        "400": { description: "RFC 6749 error (see above)." }
        "401": { description: "`invalid_client`: client_id is not the code's." }
        "429": { description: "`slow_down`: too many unknown codes from this address." }
  /v1/_auth/device/info:
    post:
      tags: [auth]
      summary: Show what a user code is asking for (Web UI session only).
      description: |
        The approval page's lookup: client, source address, times, and the
        scopes the token would carry (the person's own). The code rides the
        body. Wrong codes count against the person and their address.
      operationId: deviceLoginInfo
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [user_code], properties: { user_code: { type: string } } }
      responses:
        "200": { description: The request to approve. }
        "403": { description: "`session_required`: not a Web UI session (a bearer cannot approve)." }
        "404": { description: "`code_invalid`: unknown, expired or already decided." }
        "429": { description: "`too_many_attempts`." }
  /v1/_auth/device/approve:
    post:
      tags: [auth]
      summary: Approve or deny a device login (Web UI session only).
      description: |
        Needs a Web UI session (any gate) with `X-Loomcycle-UI: 1` from this
        server's own pages. Refused when the person is not an active user,
        the session is narrower than the token would be (a restricted pasted
        token), or the tenant's gate policy does not list the session's gate.
        A code is decided once.
      operationId: approveDeviceLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_code, approve]
              properties:
                user_code: { type: string }
                approve: { type: boolean }
      responses:
        "200": { description: "`{approved}`." }
        "403": { description: "`session_required`, `device_not_allowed`, or the CSRF refusal." }
        "404": { description: "`code_invalid`." }
        "429": { description: "`too_many_attempts`." }
  /v1/_auth/tenant-policies:
    get:
      tags: [auth]
      summary: List per-tenant gate policies (admin).
      description: |
        Every tenant whose people must sign in through named gates, from
        `auth.tenant_policies` in config and from stored rows. `gates` is what
        applies: the intersection when both set one (a row only narrows the
        config). Enforced when a Web UI session is established and when a gate
        issues a token.
      operationId: listTenantPolicies
      responses:
        "200":
          description: The policies.
          content:
            application/json:
              schema:
                type: object
                properties:
                  policies: { type: array, items: { $ref: "#/components/schemas/TenantPolicy" } }
        "403": { description: "Not an admin." }
  /v1/_auth/tenant-policies/{tenant}:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
    put:
      tags: [auth]
      summary: Set a tenant's gate policy (admin).
      description: |
        The tenant's people may then sign in, and be issued tokens, only through
        these gates. Its live Web UI sessions and gate-issued tokens from any
        other gate end at once; hand-minted tokens are left alone.
      operationId: putTenantPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gates]
              additionalProperties: false
              properties:
                gates: { type: array, minItems: 1, items: { type: string } }
      responses:
        "200":
          description: Stored and applied.
          content:
            application/json:
              schema:
                type: object
                properties:
                  policy: { $ref: "#/components/schemas/TenantPolicy" }
                  sessions_ended: { type: integer }
                  tokens_retired: { type: integer }
        "400":
          description: "`unknown_gate`, `policy_empty` (no gate) or a malformed body."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403": { description: "Not an admin." }
        "409":
          description: "`policy_empty`: nothing in common with the config's policy for the tenant."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    delete:
      tags: [auth]
      summary: Remove a tenant's stored gate policy (admin); the config's still applies.
      operationId: deleteTenantPolicy
      responses:
        "200": { description: Removed. }
        "404": { description: "`policy_not_found`." }
  /v1/_auth/token/revoke:
    post:
      tags: [auth]
      summary: Retire the bearer this request is made with.
      description: |
        `loomcycle logout` calls it with the token `loomcycle login` was issued.
        Only a delegated user token can retire itself; a config principal, the
        legacy secret and an operator token (admin or tenant scope) are refused.
        A Web UI session signs out with `POST /v1/_auth/logout` instead. An
        agent-restricted token may call it.
      operationId: selfRevokeToken
      responses:
        "200":
          description: Retired; the token stops authenticating at once.
          content:
            application/json:
              schema:
                type: object
                properties:
                  def_id: { type: string }
                  retired_at: { type: string, format: date-time }
        "400":
          description: "`use_logout`: a Web UI session cookie authenticated the request."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: "The bearer does not authenticate (already retired, expired or unknown)."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: "`not_revocable`: not a delegated user token."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /v1/_auth/assert:
    post:
      tags: [auth]
      summary: Exchange a gate's credential for an issued token (external gates, AWS IAM).
      description: |
        Unauthenticated: the gate's own credential is the authentication. The
        body names the gate; its kind decides the rest of the body.

        **kind: external** — `assertion` is a JWT (`iss` = the gate, `aud` =
        this server's issuer URL, `lc_use: assert`, `jti`, `iat`, `exp` at most
        5 minutes later; `sub` the person's id at the gate; optional `name`,
        `email`, `email_verified`, `groups`, `tenant`, `access_mode` — honoured
        on a trusted gate only — and `token` {agents, overrides,
        rate_per_minute, rate_burst, ttl_seconds}, which can only narrow the
        gate's `issued_token` ceiling). The token is the user's own member
        reach, short-lived, tagged with the gate.

        **kind: awsiam** — an `sts:GetCallerIdentity` request the workload
        SigV4-signed but did not send, in Vault's field names (so Vault's AWS
        login helpers produce it). loomcycle sends it to the global or an
        allowlisted regional STS endpoint (never to the URL the client names),
        and maps the ARN STS answers with — an assumed role as its role ARN —
        through `allowed_arns` and the gate's `identity_map`. The signed
        headers must include `host` and `X-Loomcycle-AWS-Server-ID` equal to
        the gate's `server_id`; `X-Amz-Date` must be within five minutes; a
        signature is accepted once (on every replica). The token carries the
        user's access_mode scopes, tagged with the gate, living at most an
        hour (GetCallerIdentity does not say when the caller's credentials
        expire) and never beyond the gate's `new_user.token_ttl` or
        `LOOMCYCLE_USER_TOKEN_MAX_TTL_SECONDS`.

        Either way the user is provisioned per the gate's identity_map first,
        a pending user gets no token, and the token stops the moment the user
        is not active. Refusals are one opaque answer whatever the reason or
        the gate (an unknown name included), audited, and throttled per client
        source.
      operationId: authAssert
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  title: ExternalAssertion
                  additionalProperties: false
                  required: [gate, assertion]
                  properties:
                    gate: { type: string }
                    assertion: { type: string }
                - type: object
                  title: AWSIAMLogin
                  required: [gate, iam_http_request_method, iam_request_url, iam_request_headers, iam_request_body]
                  properties:
                    gate: { type: string, description: The awsiam gate's name. }
                    iam_http_request_method: { type: string, enum: [POST] }
                    iam_request_url: { type: string, format: byte, description: "base64 of https://sts.amazonaws.com/ (or an allowed regional host)." }
                    iam_request_headers: { type: string, format: byte, description: base64 of the signed request's headers as a JSON object. }
                    iam_request_body: { type: string, format: byte, description: "base64 of Action=GetCallerIdentity&Version=2011-06-15." }
      responses:
        "200":
          description: The issued token, shown once.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expires_at: { type: string, format: date-time }
                  subject: { type: string }
                  tenant: { type: string }
        "400": { description: "`invalid_token_request`: an external assertion's token claim asks for more than the gate allows." }
        "401": { description: "`invalid_assertion` (opaque, whatever the reason or the gate; audited)." }
        "403": { description: "`awaiting_approval`: the user is pending." }
        "409": { description: "`open_mode`: authentication is off on this server." }
        "413": { description: "`body_too_large`: the body is over 64 KiB." }
        "429": { description: "`throttled`." }
        "503": { description: "`gate_unavailable`: the gate's key or the replay cache cannot be read; `sts_unavailable`: AWS STS could not be reached." }
  /v1/_auth/revoke:
    post:
      tags: [auth]
      summary: An external gate removes one of its users.
      description: |
        `request` is a JWT like an assertion with `lc_use: revoke` and `sub`
        the person's id at the gate. A user linked to this gate is disabled at
        once (sessions and issued tokens end on the next request, every
        replica) and removed per the gate's removal policy (unbind, then erase
        only if erase_after is set). Any other sub gets the same 204.
      operationId: externalRevoke
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [gate, request]
              properties:
                gate: { type: string }
                request: { type: string }
      responses:
        "204": { description: Done (or nothing to do). }
        "401": { description: "`invalid_assertion`." }
        "429": { description: "`throttled`." }
  /v1/_auth/sync:
    post:
      tags: [auth]
      summary: An external gate reconciles its users and groups in bulk.
      description: |
        `request` is a JWT with `lc_use: sync`, no `sub`, `users`
        [{sub, name?, email?, email_verified?, groups?, tenant?,
        access_mode?}] (at most 10000) and `complete`. Each user is
        provisioned and its gate groups synced as at a login; repeating a sync
        changes nothing. With `complete: true` on a gate whose identity_map is
        `authoritative_for_users`, users linked to the gate that the list
        omits are removed per the gate's removal policy. A complete sync of no
        users is refused.
      operationId: externalSync
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [gate, request]
              properties:
                gate: { type: string }
                request: { type: string }
      responses:
        "200":
          description: Counts only.
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }
                  updated: { type: integer }
                  refused: { type: integer }
                  removed: { type: integer }
                  unchanged: { type: integer }
        "400": { description: "`empty_complete_sync`." }
        "401": { description: "`invalid_assertion`." }
        "429": { description: "`throttled`." }
  /v1/_authgate:
    get:
      tags: [authgate]
      summary: List the configured gates (admin), optionally probing external ones.
      description: |
        Each gate's name, kind, label, whether a browser can sign in through
        it, its identity map's tenant and provisioning; an external gate's key
        (algorithm, kid, fingerprint — never key material), callback and
        discovery URLs and removal timing. `?probe=1` fetches each external
        gate's `/.well-known/loomcycle-authgate` (5 s, no redirects) and
        reports whether its name and key match the registration. Gates are
        registered in config only.
      operationId: listAuthGates
      parameters:
        - { name: probe, in: query, required: false, schema: { type: string, enum: ["1"] } }
      responses:
        "200":
          description: The gates.
          content: { application/json: { schema: { type: object, properties: { gates: { type: array, items: { type: object } } } } } }
        "403": { description: Not an admin. }
  /v1/_authgate/{gate}/invites:
    parameters:
      - { $ref: "#/components/parameters/Gate" }
    post:
      tags: [authgate]
      summary: Create a single-use invitation to a password gate.
      description: |
        Returns a link to loomcycle's own invite page; the invitee chooses a
        login (or takes the invite's fixed `login`), sets a password there and
        enrols TOTP when the gate requires it. The code inside the link is shown
        only in this response and stored only as its SHA-256. loomcycle sends no
        mail: the caller delivers the link.

        Who may call: a `substrate:tenant` operator for its own tenant (`tenant`
        defaults to and must equal its own), an admin for any, an `auth:manage`
        token for any (it must name `tenant`). A new user gets `access_mode:
        isolated` and no groups unless the gate is `trusted`; an `auth:manage`
        token is held to that on any gate, except one owner invite
        (`access_mode: tenant`) for a tenant with no users yet. With `subject`
        the invite attaches a password to that existing user instead, which
        keeps its subject, access mode and groups (never raised). No field takes
        a password; an unknown field is refused.
      operationId: createAuthgateInvite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                tenant: { type: string }
                subject: { type: string, description: An existing user to attach the password to. }
                access_mode: { type: string, enum: [isolated, tenant] }
                groups: { type: array, items: { type: string } }
                login: { type: string, description: The login the invitee must take (normalised NFKC + case-folded). }
                email: { type: string }
                ttl: { type: string, description: "Go duration; default 168h, at most the gate's max (720h)." }
                return_to: { type: string, description: A path on this server or one of the gate's allowed_return_to. }
      responses:
        "201":
          description: The invite and its link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthgateLink" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`tenant_mismatch`, `beyond_floor`, `tenant_not_empty` or `promotion_refused`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`login_taken`, `credential_exists` or `bootstrap_invite_live`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [authgate]
      summary: List the gate's invites (never their codes).
      operationId: listAuthgateInvites
      parameters:
        - { $ref: "#/components/parameters/TenantQuery" }
      responses:
        "200":
          description: Invites, newest first, with their state (live, redeemed, revoked, expired).
          content:
            application/json:
              schema:
                type: object
                properties:
                  invites: { type: array, items: { type: object } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/_authgate/{gate}/invites/{id}:
    parameters:
      - { $ref: "#/components/parameters/Gate" }
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      tags: [authgate]
      summary: Revoke a live invite.
      operationId: revokeAuthgateInvite
      parameters:
        - { $ref: "#/components/parameters/TenantQuery" }
      responses:
        "204": { description: Revoked. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The invite was already redeemed, revoked or expired. }
  /v1/_authgate/{gate}/resets:
    parameters:
      - { $ref: "#/components/parameters/Gate" }
    post:
      tags: [authgate]
      summary: Issue a one-time password reset link (valid 1 hour).
      description: |
        For a user with a login at this gate. The link opens loomcycle's reset
        page, where the person sets a new password; completing it ends the
        user's sessions and delegated tokens. A newer link supersedes an older
        one. There is no route that sets a password directly.
      operationId: createAuthgateReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [subject]
              properties:
                tenant: { type: string }
                subject: { type: string }
      responses:
        "201":
          description: The reset and its link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthgateLink" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/_authgate/{gate}/credentials/{subject}:
    parameters:
      - { $ref: "#/components/parameters/Gate" }
      - { name: subject, in: path, required: true, schema: { type: string } }
    delete:
      tags: [authgate]
      summary: Remove the user's password, TOTP and recovery codes (the login stays reserved).
      operationId: deleteAuthgateCredentials
      parameters:
        - { $ref: "#/components/parameters/TenantQuery" }
      responses:
        "204": { description: Removed. }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/_authgate/{gate}/logins/{subject}:
    parameters:
      - { $ref: "#/components/parameters/Gate" }
      - { name: subject, in: path, required: true, schema: { type: string } }
    patch:
      tags: [authgate]
      summary: Rename the user's login at this gate (the subject, and the user's data, do not move).
      operationId: renameAuthgateLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [login]
              properties:
                tenant: { type: string }
                login: { type: string }
      responses:
        "200": { description: Renamed. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`login_taken`: logins are unique per gate, compared case-insensitively." }
  /v1/_authgate/{gate}/identities:
    parameters:
      - { $ref: "#/components/parameters/Gate" }
    get:
      tags: [authgate]
      summary: List a user's logins, and whether it has a password and a TOTP factor.
      operationId: listAuthgateIdentities
      parameters:
        - { $ref: "#/components/parameters/TenantQuery" }
        - { name: subject, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: The logins; never a secret. }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/_authgate/{gate}/tenant-status:
    parameters:
      - { $ref: "#/components/parameters/Gate" }
    get:
      tags: [authgate]
      summary: Whether a tenant has any user yet and whether an owner invite is live.
      description: What a website needs to decide on a bootstrap owner invite; nothing about who the users are.
      operationId: getAuthgateTenantStatus
      parameters:
        - { $ref: "#/components/parameters/TenantQuery" }
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id: { type: string }
                  has_users: { type: boolean }
                  bootstrapped: { type: boolean, description: The tenant has ever had a user; an owner bootstrap needs false. }
                  bootstrap_invite_live: { type: boolean }
  /v1/_auth/login/{gate}:
    get:
      tags: [auth]
      summary: Start a sign-in through a redirect gate — OIDC, OAuth or external (a top-level navigation).
      description: |
        RFC FA P1/P4. Unauthenticated; throttled per client source. Sets a short
        `__Host-lc_login` (or `lc_login` over HTTP) cookie bound to a single-use
        state and answers 303 to the provider (OIDC/OAuth: code + PKCE S256,
        and a nonce for OIDC). For an external gate the 303 is to the gate's
        `callback_url` with `login_state`, `aud` (this server's issuer URL, its
        LOOMCYCLE_PUBLIC_URL) and `complete` (where the gate sends the browser
        back, carrying the state); an external gate without a `callback_url`
        has no browser sign-in (404). A refusal is a 303 to
        `/ui/login?error=<code>` (`return_to_refused`, `too_many_attempts`,
        `insecure_transport`, `gate_unavailable`).
      operationId: redirectSignInStart
      security: []
      parameters:
        - { $ref: "#/components/parameters/Gate" }
        - { name: return_to, in: query, schema: { type: string }, description: "A /ui path, or a URL listed verbatim in the gate's allowed_return_to." }
        - { name: reauth, in: query, schema: { type: string, enum: ["1"] }, description: "Ask the provider to authenticate again (prompt=login, max_age=0)." }
      responses:
        "303": { description: To the provider, or back to the login page with an error code. }
        "404": { description: "`gate_not_found`." }
  /v1/_auth/complete/{gate}:
    get:
      tags: [auth]
      summary: Finish a browser sign-in through a redirect gate (OIDC, OAuth or external).
      description: |
        Needs this browser's login cookie and the single-use state. An OIDC or
        OAuth provider comes back with `code` and `state`: the code is
        exchanged, the identity verified. An external gate comes back with
        `?assertion=<JWT>` (`lc_use: login`, carrying the `login_state` it was
        given), which must be live, this gate's, and bound to this browser's
        login cookie; a same-site gate may POST it as a form field instead.
        The user is provisioned by the gate's identity map and the answer is a
        303 with the session cookie to `return_to` (a pending user to
        `/ui/pending`); a refusal is a 303 to `/ui/login?error=<code>`. A link
        login (started by POST /v1/_users/{subject}/identities) returns to
        `/ui/account`. `Referrer-Policy: no-referrer`.
      operationId: redirectSignInComplete
      security: []
      parameters:
        - { $ref: "#/components/parameters/Gate" }
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: assertion, in: query, schema: { type: string } }
      responses:
        "303": { description: Into the Web UI, or back to the login page with an error code. }
        "429": { description: "`throttled` (external gates)." }
    post:
      tags: [auth]
      summary: Sign in through a password gate or a header gate (the login page's post).
      description: |
        Unauthenticated; same-origin with `X-Loomcycle-UI: 1`. 204 sets the
        session cookie.

        **Password gate:** the JSON body below. An unknown login, a wrong
        password, a locked account and a disabled user all answer
        `401 invalid_credentials`; an account with an authenticator answers
        `401 otp_required` once the password was right. `429
        too_many_attempts` when the client is throttled.

        **Header gate** (`kind: header`): no body. The request must arrive
        from the gate's `trusted_proxy_cidrs` carrying the proxy's signed
        assertion (`Cf-Access-Jwt-Assertion`, `X-Amzn-Oidc-Data`, or
        `X-Loomcycle-Identity` + `X-Loomcycle-Identity-Signature`). The
        assertion is mapped through the gate's `identity_map` (and the user
        provisioned per its `provision`), then a session is made. Every later
        request the session authenticates must carry a valid assertion for
        the same person, or the session ends. `401 no_assertion` when the
        request did not come through the proxy; `401 invalid_credentials` for
        a refused assertion, an untrusted peer or a refused identity;
        `503 gate_unavailable` when the gate cannot check the assertion right
        now (its key endpoint or the replay record is down). In that case a
        session request is refused but the session is kept.
      operationId: passwordSignIn
      security: []
      parameters:
        - { $ref: "#/components/parameters/Gate" }
      requestBody:
        required: false
        description: The password gate's form; a header gate takes no body.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [login, password]
              properties:
                login: { type: string }
                password: { type: string, format: password }
                otp: { type: string, description: A TOTP code or a recovery code. }
      responses:
        "204": { description: Signed in. }
        "401": { description: "`invalid_credentials`, `otp_required` or `invalid_otp`." }
        "403": { description: "`mfa_enrolment_required`, `insecure_transport` or a cross-site request." }
        "429": { description: "`too_many_attempts`." }
  /v1/_auth/invite/info:
    post:
      tags: [auth]
      summary: What an invitation page needs to render (the code in the body, never the URL).
      operationId: inviteInfo
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } }
      responses:
        "200": { description: "The gate, a fixed login or a suggested e-mail, whether an authenticator is required, the length minimums, and a TOTP enrolment (`secret`, `otpauth_uri`, `enrolment`)." }
        "404": { description: "`link_invalid`: unknown, used, revoked or expired." }
  /v1/_auth/invite:
    post:
      tags: [auth]
      summary: Redeem an invitation — choose a login, set a password, enrol TOTP — and sign in.
      operationId: redeemInvite
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, password]
              properties:
                code: { type: string }
                login: { type: string }
                password: { type: string, format: password }
                totp_enrolment: { type: string }
                totp_code: { type: string }
      responses:
        "201": { description: "Signed in: `redirect`, `login`, and `recovery_codes` (shown once) when an authenticator was enrolled." }
        "400": { description: "A policy refusal (`password_too_short`, `password_breached`, `password_is_login`), `invalid_login`, `totp_required` or `invalid_totp`." }
        "404": { description: "`link_invalid`." }
        "409": { description: "`login_taken`." }
  /v1/_auth/reset/info:
    post:
      tags: [auth]
      summary: What a reset page needs to render.
      operationId: resetInfo
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } }
      responses:
        "200": { description: "The gate, the login, whether the account has an authenticator, the length minimums and, without one, a TOTP enrolment." }
        "404": { description: "`link_invalid`." }
  /v1/_auth/reset:
    post:
      tags: [auth]
      summary: Complete a reset — a new password (and the authenticator's code, if the account has one) — and sign in.
      description: Ends every session made from the old password and retires the user's delegated tokens.
      operationId: completeReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, password]
              properties:
                code: { type: string }
                password: { type: string, format: password }
                otp: { type: string }
                totp_enrolment: { type: string }
                totp_code: { type: string }
      responses:
        "200": { description: Signed in. }
        "401": { description: "`otp_required` or `invalid_otp`." }
        "404": { description: "`link_invalid`." }
  /v1/_auth/account:
    get:
      tags: [auth]
      summary: The signed-in password user's login and authenticator state.
      operationId: accountInfo
      responses:
        "200": { description: "`gate`, `login`, `has_totp`, `recovery_codes_left`, `require_mfa`." }
        "403": { description: "`session_required`: only a password-gate Web UI session." }
  /v1/_auth/password:
    post:
      tags: [auth]
      summary: Change the password (re-authenticates; ends the account's other sessions).
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, format: password }
                otp: { type: string }
      responses:
        "204": { description: Changed; this browser has a new session. }
        "401": { description: "`reauth_failed` or `otp_required`." }
  /v1/_auth/totp/begin:
    post:
      tags: [auth]
      summary: Start enrolling an authenticator (a fresh secret).
      operationId: totpBegin
      responses:
        "200": { description: "`secret`, `otpauth_uri`, `enrolment`." }
  /v1/_auth/totp/confirm:
    post:
      tags: [auth]
      summary: Confirm an authenticator with its first code (re-authenticates); returns ten recovery codes once.
      operationId: totpConfirm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                current_password: { type: string, format: password }
                otp: { type: string }
                enrolment: { type: string }
                code: { type: string }
      responses:
        "200": { description: "`recovery_codes`." }
  /v1/_auth/totp:
    delete:
      tags: [auth]
      summary: Remove the authenticator (re-authenticates; the password left must meet the sole-factor policy, or send new_password).
      operationId: totpRemove
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                current_password: { type: string, format: password }
                otp: { type: string }
                new_password: { type: string, format: password }
      responses:
        "204": { description: Removed. }
        "400": { description: "`password_too_weak_alone`, or a policy refusal of new_password." }
        "403": { description: "`mfa_required`: the gate requires an authenticator." }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An OperatorTokenDef-minted bearer (substrate:tenant, or a non-isolated member token; runs:create for the decision routes).
  parameters:
    Gate:
      name: gate
      in: path
      required: true
      schema: { type: string }
      description: A configured gate of kind password; any other name is a 404.
    TenantQuery:
      name: tenant
      in: query
      required: false
      schema: { type: string }
      description: The tenant to act on. Required for an auth:manage token; a tenant operator may name only its own.
    Scope:
      name: scope
      in: path
      required: true
      schema: { type: string, enum: [agent, user, tenant] }
    ScopeIDPath:
      name: scope_id
      in: path
      required: true
      schema: { type: string }
      description: For scope=tenant this URL segment is a placeholder (the store scope_id is forced to "").
    MemoryKey:
      name: key
      in: path
      required: true
      schema: { type: string }
      description: Memory key; may contain slashes (multi-segment).
  responses:
    Unauthorized:
      description: Missing or invalid bearer.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: |
        Authenticated but not permitted. A token that lacks the route's scope
        (e.g. an isolated token on a tenant route) gets code
        `insufficient_scope`, the scope by name in `required_scope`, and the
        same scope in `WWW-Authenticate: Bearer scope="..."`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ForbiddenError" }
          examples:
            insufficient_scope:
              value: { code: insufficient_scope, error: insufficient scope, required_scope: "substrate:tenant" }
    NotFound:
      description: Not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: Value exceeds the memory quota or size cap.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: A required capability (vectors / embedder / store) is unavailable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ToolRefused:
      description: The op-dispatch tool refused the request.
      content:
        application/json:
          schema:
            type: object
            properties:
              code: { type: string, enum: [tool_refused] }
              tool: { type: string }
              error: { type: string }
            required: [code, tool, error]
  schemas:
    Error:
      type: object
      properties:
        code: { type: string }
        error: { type: string }
      required: [code, error]
    TenantPolicy:
      description: A tenant's gate policy (RFC FA P5).
      type: object
      properties:
        tenant_id: { type: string }
        gates: { type: array, items: { type: string }, description: "What applies." }
        config_gates: { type: array, items: { type: string } }
        stored_gates: { type: array, items: { type: string } }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string }
    AuthgateLink:
      description: |
        A one-time link to loomcycle's own invite or reset page. The code is in
        the URL fragment, so it never reaches a server log or a Referer header;
        it is returned only here and stored only hashed.
      type: object
      properties:
        invite_id: { type: string }
        reset_id: { type: string }
        url: { type: string, format: uri }
        expires_at: { type: string, format: date-time }
      required: [url, expires_at]
    ForbiddenError:
      description: A 403. `required_scope` is present when `code` is `insufficient_scope`.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            required_scope: { type: string, description: "The scope the token lacks." }
    MemoryEntry:
      type: object
      properties:
        key: { type: string }
        value:
          description: Arbitrary JSON value.
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [key, value, created_at, updated_at]
    MemoryScopeIDSummary:
      type: object
      properties:
        scope_id: { type: string }
        key_count: { type: integer }
        bytes: { type: integer }
        updated_at: { type: string, format: date-time }
      required: [scope_id, key_count, bytes]
    EmbedMeta:
      type: object
      properties:
        provider: { type: string }
        model: { type: string }
        dimension: { type: integer }
      required: [provider, model, dimension]
    EmbedModelStats:
      type: object
      properties:
        provider: { type: string }
        model: { type: string }
        dimension: { type: integer }
        row_count: { type: integer }
      required: [provider, model, dimension, row_count]
    MemoryEntryPutBody:
      type: object
      properties:
        value:
          description: Arbitrary JSON value (required, must be valid JSON).
        embed:
          type: boolean
          description: Embed the value text for vector search.
        ttl_seconds:
          type: integer
          description: Positive TTL sets an expiry; omit for no expiry.
      required: [value]
    MemorySearchRequest:
      type: object
      properties:
        query: { type: string }
        scope: { type: string, enum: [agent, user, tenant] }
        scope_id: { type: string, description: "Required for agent/user scopes." }
        top_k: { type: integer, default: 10, maximum: 50 }
        rank: { description: "Optional rank config (memrank.RankConfig).", type: [object, "null"] }
        dedup: { description: "Optional dedup config (memrank.DedupConfig).", type: [object, "null"] }
        sources:
          type: array
          description: "Restrict to any of: facts, notes, documents. Unknown values are dropped."
          items: { type: string, enum: [facts, notes, documents] }
        under_paths:
          type: array
          items: { type: string }
          description: "Return only the chunks of documents named at or under any of these Path-tree paths, in the caller's own tenant and this scope's tree. Narrows document chunks only (facts and notes pass), before ranking. Needs a search that can return documents; refused on scope tenant (400 invalid_filter) and without SQL Memory (400 filter_unavailable)."
        exclude_under_paths:
          type: array
          items: { type: string }
          description: "Never return the chunks of documents named at or under these paths. Documents only, as under_paths."
        document_ids:
          type: array
          items: { type: string }
          description: "Return only the chunks of these documents. Documents only, as under_paths."
        exclude_document_ids:
          type: array
          items: { type: string }
          description: "Never return the chunks of these documents. Documents only, as under_paths."
      required: [query, scope]
    MemorySearchResponse:
      type: object
      properties:
        scope: { type: string }
        scope_id: { type: string }
        entries:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              value: { description: "Arbitrary JSON value." }
              score: { type: number, description: "Raw cosine similarity." }
              rank_score: { type: number }
              embedded_with:
                type: object
                properties:
                  provider: { type: string }
                  model: { type: string }
              kind: { type: string, enum: [fact, note, document] }
              chunk_id: { type: string, description: "Set when kind == document." }
        query_embedding_dim: { type: integer }
        truncated: { type: boolean }
        filter:
          type: object
          description: "What a document filter resolved to. Present only when the request carried one."
          properties:
            applied:
              type: object
              properties:
                under_paths: { type: array, items: { type: string } }
                exclude_under_paths: { type: array, items: { type: string } }
                document_ids: { type: array, items: { type: string } }
                exclude_document_ids: { type: array, items: { type: string } }
            matched_documents: { type: integer }
            matched_chunks: { type: integer }
            inverted: { type: boolean }
          required: [applied, matched_documents, matched_chunks, inverted]
      required: [scope, scope_id, entries, query_embedding_dim, truncated]
    ReembedDryRun:
      type: object
      properties:
        scope: { type: string }
        scope_id: { type: string }
        dry_run: { type: boolean, enum: [true] }
        rows_total: { type: integer }
        rows_to_reembed: { type: integer }
        current_embedder: { $ref: "#/components/schemas/EmbedMeta" }
        sample_keys: { type: array, items: { type: string } }
        sample_keys_capped: { type: boolean }
      required: [scope, scope_id, dry_run, rows_total, rows_to_reembed]
    ReembedReal:
      type: object
      properties:
        scope: { type: string }
        scope_id: { type: string }
        dry_run: { type: boolean, enum: [false] }
        rows_reembedded: { type: integer }
        rows_failed: { type: integer }
        current_embedder: { $ref: "#/components/schemas/EmbedMeta" }
        failed_keys: { type: array, items: { type: string } }
      required: [scope, scope_id, dry_run, rows_reembedded, rows_failed]
    # DocumentToolInput / PathToolInput mirror the Document / Path tool
    # InputSchema()s. The `op` enums here are drift-tested against the live
    # tool schemas (internal/api/http/openapi_test.go); additionalProperties is
    # true because the endpoint forwards the raw body to the tool verbatim.
    DocumentToolInput:
      type: object
      additionalProperties: true
      required: [op]
      properties:
        op:
          type: string
          enum:
            - create_document
            - get_document
            - documents_summary
            - query_documents
            - delete_document
            - set_path
            - create_chunk

        scope: { type: string, enum: [agent, user, tenant] }
        id: { type: string, description: "Document id or chunk id (op-dependent)." }
        path: { type: string }
        title: { type: string }
        document_id: { type: string }
        body: { type: string, description: "Markdown body." }
        parent_id: { type: string }
        natural_key: { type: string }
        supersedes_id: { type: string }
        revision: { type: integer, description: "update_chunk optimistic concurrency / get_version target." }
        from_revision: { type: integer }
        to_revision: { type: integer }
        query: { type: string }
        sql: { type: string, description: "query_chunks read-only SELECT escape hatch." }
        tags: { type: array, items: { type: string } }
        markdown: { type: string, description: "import_md source." }
        media_type: { type: string }
        data: { type: string, description: "set_asset image bytes, base64." }
    PathToolInput:
      type: object
      additionalProperties: true
      required: [op]
      properties:
        op:
          type: string
          enum: [resolve, ls, stat, mkdir, mv, rm]
        path: { type: string }
        to: { type: string, description: "Destination path (mv)." }
        scope: { type: string, enum: [agent, user, tenant] }
        recursive: { type: boolean }
        kind_filter: { type: string, description: "ls: document/volume_mount/memory_entry/directory." }
        resource_too: { type: boolean }
    # CryptoToolInput mirrors the Crypto tool's InputSchema() plus the operator
    # API's `tenant`; its properties and enums are drift-tested against the
    # live tool schema (internal/api/http/openapi_test.go).
    CryptoToolInput:
      type: object
      required: [op]
      properties:
        op:
          type: string
          enum: [encrypt, decrypt, rewrap, mac, verify_mac, sign, verify, public_key, totp, hash, random, hash_password, verify_password]
        tenant: { type: string, description: "Admin only: the tenant whose keys to use. Default: the token's own." }
        key: { type: string, description: "A crypto key stored with CredentialDef, by name." }
        cred: { type: string, description: "An ordinary stored credential, by name, used as key material. Needs key_type." }
        run: { type: string, description: "A run credential. There are none outside a run, so this is always refused here." }
        key_scope: { type: string, enum: [agent, user, tenant], description: "key and cred: which scope's key, when more than one holds the name. agent is refused here." }
        key_type:
          type: string
          enum: [aes-256-gcm, xchacha20-poly1305, hmac-sha256, hmac-sha512, ed25519, ecdsa-p256, totp, x25519, rsa-oaep-2048, rsa-oaep-3072, rsa-oaep-4096, rsa-pss-2048, rsa-pss-3072, rsa-pss-4096]
          description: "cred only: what kind of key the value is."
        key_encoding: { type: string, enum: [raw, base64, hex, base32, pem] }
        derive: { type: boolean, description: "cred only: derive an AEAD or HMAC key from any secret." }
        version: { type: integer, description: "key only: a version, for public_key or a raw ciphertext." }
        plaintext: { type: string, description: "encrypt: text, or base64 with input_encoding base64." }
        ciphertext: { type: string, description: "decrypt, rewrap: what encrypt returned." }
        data: { type: string, description: "mac, verify_mac, sign, verify, hash." }
        input_encoding: { type: string, enum: [text, base64] }
        output_encoding: { type: string, enum: [hex, base64, text] }
        context: { type: string, description: "encrypt, decrypt, rewrap: associated data; a ciphertext decrypts only with the same context." }
        format: { type: string, enum: [envelope, raw, jws, jwe] }
        sensitive: { type: boolean }
        mac: { type: string, description: "verify_mac: hex or base64." }
        signature: { type: string, description: "verify: a raw signature (base64) or a JWS token." }
        public_key: { type: string, description: "verify: a PEM or JWK public key, in place of key. encrypt: an X25519 or RSA public key to encrypt to (a JWE)." }
        from: { type: string, description: "A store to read the input from (volume:, memory:, document:). Refused outside a run, so always refused here." }
        to: { type: string, description: "A store to write the output to. Refused outside a run, so always refused here." }
        password: { type: string, description: "hash_password, verify_password: the password." }
        password_hash: { type: string, description: "verify_password: the stored hash, as hash_password returned it." }
        digits: { type: integer }
        period: { type: integer }
        algorithm: { type: string, enum: [sha256, sha512, sha3-256, sha3-512] }
        kind: { type: string, enum: [bytes, token, uuid] }
        length: { type: integer }
    # DecisionRequest mirrors the Decision tool's InputSchema(); its top-level
    # properties, the question properties and the question types are
    # drift-tested against the live tool schema, and every failure code against
    # the status the handler maps it to (internal/api/http/openapi_test.go).
    DecisionRequest:
      type: object
      required: [state, questions]
      properties:
        model:
          type: string
          description: Which decision model answers. Omit it for the default. A name outside the allowed list is refused (`model_not_allowed`); `GET /v1/_decide/models` lists the names.
        state:
          type: object
          additionalProperties: true
          description: What the questions are about — any JSON object (strings, numbers, nested objects, arrays). The model reads all of it and nothing else. It is never shortened.
        questions:
          type: object
          description: 1 to 64 questions, keyed by names the caller chooses; each answer comes back under its question's name. The limit is the model's own (see `limits.max_questions` on `GET /v1/_decide/models`).
          minProperties: 1
          maxProperties: 64
          additionalProperties: { $ref: "#/components/schemas/DecisionQuestion" }
    DecisionQuestion:
      description: One typed question. The shape of `criteria` depends on `type`.
      oneOf:
        - $ref: "#/components/schemas/DecisionChoiceQuestion"
        - $ref: "#/components/schemas/DecisionNoulQuestion"
        - $ref: "#/components/schemas/DecisionScoreQuestion"
      discriminator:
        propertyName: type
        mapping:
          choice: "#/components/schemas/DecisionChoiceQuestion"
          noul: "#/components/schemas/DecisionNoulQuestion"
          score: "#/components/schemas/DecisionScoreQuestion"
    DecisionChoiceQuestion:
      type: object
      description: Pick one of the options described.
      required: [type, instructions, criteria]
      properties:
        type: { type: string, enum: [choice] }
        instructions: { type: string, description: "The question itself, in plain words." }
        criteria:
          type: object
          description: Maps each option to a description, or to null when the option explains itself. 2 to 26 options; the option names come back as the answer.
          minProperties: 2
          maxProperties: 26
          additionalProperties: { type: [string, "null"] }
    DecisionNoulQuestion:
      type: object
      description: Yes or no, answered as the probability of yes.
      required: [type, instructions]
      properties:
        type: { type: string, enum: [noul] }
        instructions: { type: string, description: "The question itself, in plain words." }
        criteria:
          type: [object, "null"]
          description: Optional (omit it, or pass null). Describes what "true" and/or "false" mean; no other key is accepted.
          additionalProperties: false
          properties:
            "true": { type: string }
            "false": { type: string }
    DecisionScoreQuestion:
      type: object
      description: A position on a scale whose levels are described.
      required: [type, instructions, criteria]
      properties:
        type: { type: string, enum: [score] }
        instructions: { type: string, description: "The question itself, in plain words." }
        criteria:
          type: array
          description: The level descriptions, lowest first. 2 to 26 levels.
          minItems: 2
          maxItems: 26
          items: { type: string }
    DecisionResponse:
      type: object
      required: [model, provider, served_model, answers, usage]
      properties:
        model: { type: string, description: "The name asked, as the operator listed it (the default's name when the call named none)." }
        provider: { type: string, description: "The provider the call was made to." }
        served_model: { type: string, description: "The model the provider says answered." }
        answers:
          type: object
          description: One answer per question, under the question's name.
          additionalProperties: { $ref: "#/components/schemas/DecisionAnswer" }
        usage:
          type: object
          required: [input_tokens, output_tokens]
          properties:
            input_tokens: { type: integer }
            output_tokens: { type: integer }
    DecisionAnswer:
      type: object
      description: |
        One question's answer, exactly as the model gave it: nothing is renamed
        or dropped, so a field a later model version adds arrives too. Which of
        the fields below are present depends on `type`. The probabilities are
        NOT calibrated — compare options within one answer.
      additionalProperties: true
      required: [type]
      properties:
        type: { type: string, enum: [choice, noul, score] }
        choice: { type: string, description: "choice: the option picked." }
        noul: { type: number, description: "noul: the probability that the answer is yes, 0 to 1. 0 is a definite no, not a missing answer." }
        score: { type: number, description: "score: the expected position on the scale, counted from 0." }
        legend:
          type: object
          description: "score: position to level description."
          additionalProperties: { type: string }
        probabilities:
          type: object
          description: "choice: a probability per option. score: a probability per position. Not calibrated."
          additionalProperties: { type: number }
        confidence: { type: number, description: "choice and score: how concentrated the probabilities appear to be (inferred from captured answers, not documented by the model's vendor)." }
    DecisionError:
      description: |
        A failed decision call: the `Error` envelope plus what kind of failure
        it is. `error` is the tool's own text ("Decision: <code>: ..."). The
        fields beyond `code` and `error` are present only when there is
        something to say; a refusal made before the tool ran (`bad_request`,
        `request_too_large`) carries the envelope alone.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            errorCategory: { type: string, enum: [transient, validation, business, permission] }
            isRetryable: { type: boolean, description: "Whether sending the same call again can succeed." }
            retryAfterSeconds: { type: integer, description: "A backoff hint, only on a retryable failure that has one." }
            description: { type: string, description: "The next step for the caller." }
            correctCallFormat:
              type: object
              additionalProperties: true
              description: The correct shape of the call, when the shape may be the cause.
    TokenLimitError:
      description: The refusal run admission gives a caller at a hard token budget.
      type: object
      required: [code, error, scope, scope_id, used, limit, window, message]
      properties:
        code: { type: string, enum: [token_limit_exceeded] }
        error: { type: string }
        message: { type: string, description: "The same text as `error`." }
        scope: { type: string, enum: [operator, tenant, user], description: "Which budget tripped." }
        scope_id: { type: string, description: "The tenant id (scope=tenant), the user subject (scope=user), or empty for the operator budget." }
        used: { type: integer, description: "The scope's month-to-date token total." }
        limit: { type: integer, description: "The hard ceiling that was reached." }
        window: { type: string, description: "The budget window; `month` is the calendar month, UTC." }
    DecisionModelList:
      type: object
      required: [default, models]
      properties:
        default: { type: string, description: "The name used when a call names no model." }
        models:
          type: array
          items: { $ref: "#/components/schemas/DecisionModelInfo" }
    DecisionModelInfo:
      type: object
      required: [name, provider, model, limits]
      properties:
        name: { type: string, description: "The name a call passes as `model`." }
        provider: { type: string }
        model: { type: string, description: "The model the provider serves under that name." }
        limits:
          type: object
          description: The bounds one request to this model must respect. How much state fits is not among them; an over-long request is refused with `prompt_too_large`.
          required: [max_questions, min_options, max_options]
          properties:
            max_questions: { type: integer }
            min_options: { type: integer, description: "Fewest options of a choice / levels of a score." }
            max_options: { type: integer, description: "Most options of a choice / levels of a score." }

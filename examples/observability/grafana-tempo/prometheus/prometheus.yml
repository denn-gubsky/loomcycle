global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: loomcycle-demo

scrape_configs:
  # loomcycle's own /metrics endpoint — substrate counters
  # (process resources + concurrency state).
  - job_name: loomcycle
    static_configs:
      - targets: ["loomcycle:8787"]
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      # A metrics:read token (it reaches GET /metrics and nothing else),
      # read from a file on every scrape, so rotating it needs no restart.
      # seed.sh mints it into prometheus/secrets/ on first run; see the
      # README for doing it by hand.
      credentials_file: /etc/prometheus/secrets/loomcycle.token

  # OTEL Collector's spanmetrics-derived endpoint — per-run
  # histograms aggregated from loomcycle's OTEL spans. See
  # otel-collector/config.yaml (Decision 2 lock).
  - job_name: loomcycle-spanmetrics
    static_configs:
      - targets: ["otel-collector:8889"]
    metrics_path: /metrics
    scheme: http

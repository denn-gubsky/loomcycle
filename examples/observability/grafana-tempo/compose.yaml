# Profile A — loomcycle + full self-hosted observability stack.
#
# Brings up loomcycle (with OTEL traces enabled) + Postgres + OTEL
# Collector + Tempo (traces) + Prometheus (metrics) + Loki (logs) +
# Grafana (UI). Single `docker compose up` produces a working
# end-to-end stack — see README.md for the five-minute quickstart.
#
# Scoped at RFC observability-profiles.md (locked 2026-05-27). All
# image versions pinned; rotate via the "Production deployment"
# section in the README.

services:
  # ---- loomcycle + storage ----------------------------------------

  loomcycle:
    image: denngubsky/loomcycle:1.147.0
    ports:
      - "8787:8787"
    environment:
      # Bearer token for the demo. ROTATE before production — see
      # README "Production deployment" section.
      LOOMCYCLE_AUTH_TOKEN: ${LOOMCYCLE_AUTH_TOKEN:-demo-token-change-me}

      # OTEL — send spans to the local collector.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: loomcycle
      OTEL_TRACES_SAMPLER: parentbased_always_on

      # The process-resource sampler (the DB-backed metrics behind the
      # /v1/_metrics/* JSON endpoints) is enabled in loomcycle.yaml (`metrics:`).

      # Storage.
      LOOMCYCLE_DB_DSN: postgres://loomcycle:loomcycle@postgres:5432/loomcycle?sslmode=disable

      # Provider keys — operator supplies via .env or environment.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      - ./loomcycle.yaml:/etc/loomcycle/loomcycle.yaml:ro
    command: ["serve", "--config", "/etc/loomcycle/loomcycle.yaml"]
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started

  postgres:
    # Any Postgres ≥ 14 works; 16 here is just a tested default.
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    environment:
      POSTGRES_USER: loomcycle
      POSTGRES_PASSWORD: loomcycle
      POSTGRES_DB: loomcycle
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loomcycle"]
      interval: 5s
      retries: 10

  # ---- telemetry pipeline -----------------------------------------

  # OTEL Collector receives OTLP traces from loomcycle and fans them
  # out to Tempo (storage) AND a `spanmetrics` connector which
  # synthesizes Prometheus histograms (calls_total, duration_seconds)
  # by promoting span attributes to labels. See otel-collector/config.yaml.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0-386@sha256:b30650b1e3ae4a43da2c3d286e1b36036cb7b6c237f5feeee16e68b39c25193a
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4318:4318"   # OTLP HTTP (loomcycle sends here)
      - "8889:8889"   # spanmetrics-derived Prometheus endpoint (Prometheus scrapes here)

  tempo:
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # Tempo HTTP (Grafana datasource hits this)

  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # The scrape token (prometheus/secrets/loomcycle.token, git-ignored).
      # A directory mount, so a token written after `up` is seen.
      - ./prometheus/secrets:/etc/prometheus/secrets:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.7.10@sha256:b43c257ccfc925d4a50b8717cac61a3b51df8c48d01847936057e5c4075a24a7
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  # ---- UI ---------------------------------------------------------

  grafana:
    image: grafana/grafana:13.3.2@sha256:81556409ba48b2b922e0adb69a2511337d8ba7578f11962eefa6149a2d815101
    environment:
      # Demo defaults — change for production.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # The dashboards shipped with loomcycle (deploy/observability/).
      - ../../../deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards/loomcycle:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"   # mapped to 3001 to avoid common-app collisions
    depends_on:
      - prometheus
      - tempo
      - loki

volumes:
  postgres-data:
  tempo-data:
  prometheus-data:
  loki-data:
  grafana-data:

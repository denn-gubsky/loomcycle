# exp11 — Skybits shared documents via remote MCP + cross-run Memory
#
# One agent (doc-agent) collaborates on Skybits (https://skybits.ai) documents
# through Skybits' remote Streamable-HTTP MCP server (https://skybits.ai/mcp,
# 59 tools: outline_document / read_document / find_in_document / edit_document
# with atomic batch ops replace/insert_before/insert_after/remove/move,
# create_doc, find_documents, comment threads, document_history / diff_document /
# restore_document, tags, sharing, sync graph, export jobs). Documents are
# addressed by doc_url; there is NO suggestions tool — edits apply directly but
# are attributed, versioned, and revertible. Full catalog:
# GET https://skybits.ai/v1/tools (public, no auth).
#
# Loomcycle memory is enabled so the agent REMEMBERS document facts across
# runs: MCP tool calls are not auto-recorded, so the agent explicitly writes
# durable facts (doc URLs, structure, decisions, collaborator feedback) via
# Memory op=set under user scope, and later runs (same user_id) recall them.
#
# AUTH — loomcycle's MCP client has no OAuth client flow; the Skybits token is
# provisioned OUT-OF-BAND as a connector API key (plain Bearer), minted via the
# device flow using Skybits' public helper from https://skybits.ai/skill
# (`python scripts/skybits.py login <name>`), or POST /v1/mcp/connectors with
# scopes ["mcp.connect","agent.tools.read","agent.tools.write"]. Put it in
# .env.local as LOOMCYCLE_SKYBITS_TOKEN, or pass a per-run token as
# user_credentials.skybits on POST /v1/runs (wins over the env fallback).
#
# Routing: Anthropic OAuth (primary) → deepseek-v4-pro (fallback) via `tier: middle`.
# See README.md for prerequisites + verification.

provider_priority:
  - anthropic-oauth-dev
  - deepseek

tiers:
  middle:
    - { provider: anthropic-oauth-dev, model: claude-sonnet-4-6 }
    - { provider: deepseek,            model: deepseek-v4-pro }
  low:
    - { provider: anthropic-oauth-dev, model: claude-haiku-4-5-20251001 }
    - { provider: deepseek,            model: deepseek-v4-flash }

user_tiers:
  default:
    provider_priority: [anthropic-oauth-dev, deepseek]
    fallback_on_error: true
    max_fallback_attempts: 3

defaults:
  provider: deepseek
  model: deepseek-v4-pro

agents:
  # DOC-AGENT — creates/reads/edits Skybits documents via the skybits MCP
  # server and records durable facts in user-scoped memory so later runs
  # (same user_id) start with the document context already recalled.
  doc-agent:
    tier: middle
    max_iterations: 30
    max_tokens: 4096
    tools: [Context, Memory, "mcp__skybits__*"]
    memory_scopes: [user, agent]
    system_prompt: |
      You are the DOC-AGENT for exp11: you work on Skybits documents through the
      skybits MCP tools (mcp__skybits__*) and keep durable document facts in
      loomcycle memory so future runs can pick up where you left off.
      Use Context op=doc name=Memory (or name=mcp__skybits__<tool>) once if you
      are unsure of an argument shape.

      STEP 0 — RECALL prior context (do this first, every run):
        Memory op=list scope=user prefix="skybits:"
        If entries exist, read them — they carry doc URLs, structure, decisions,
        and collaborator feedback from earlier runs. Mention what you recalled in
        one line. If none, say "no prior Skybits memory".

      WORKING ON DOCUMENTS:
      - Documents are addressed by doc_url. Discover docs with
        mcp__skybits__find_documents; create them with mcp__skybits__create_doc.
      - ALWAYS call mcp__skybits__outline_document on a doc_url BEFORE any
        read_document / find_in_document / edit_document on it — the outline is
        the map; never edit blind.
      - Edit with mcp__skybits__edit_document using its atomic batch ops
        (replace / insert_before / insert_after / remove / move). There is no
        suggestions tool — edits apply directly, but every edit is attributed,
        versioned (document_history / diff_document), and revertible
        (restore_document). Prefer one batch op list per logical change.
      - Never invent a doc_url — use one returned by a Skybits tool, recalled
        from memory, or given in your task.

      RECORDING FACTS (after every meaningful document action):
        MCP tool calls are NOT auto-recorded in memory — you must write facts
        yourself. Use Memory op=set scope=user with keys prefixed "skybits:":
          skybits:doc:<slug>      — {"doc_url": "...", "title": "...",
                                     "structure": "<top-level outline, 1 line>",
                                     "updated": "<date>", "notes": "..."}
          skybits:decision:<slug> — decisions made about a doc and why
          skybits:feedback:<slug> — collaborator/reviewer feedback worth keeping
        Keep values short (a few lines each). Overwrite a key when the fact
        changes. Optionally Memory op=add scope=user for freeform narrative
        notes, but the keyed op=set entries are the canonical store.

      RULES:
      - Never print .env*, *_KEY, *_TOKEN, *_SECRET values or the contents of
        Authorization headers.
      - If a skybits tool call fails with an auth error, report
        "Skybits auth failed — check LOOMCYCLE_SKYBITS_TOKEN / user_credentials.skybits"
        and STOP; do not retry in a loop.
      - Non-empty tool output always.

mcp_servers:
  # Skybits remote MCP (https://skybits.ai/mcp — Streamable HTTP, single
  # endpoint, 59 tools). Bearer resolution order per run:
  #   ${run.credentials.skybits}  — per-run user_credentials.skybits on POST /v1/runs
  #   ${LOOMCYCLE_SKYBITS_TOKEN}  — env fallback, expanded at config load
  # If BOTH are empty the Authorization header is sent with an empty token and
  # every call 401s — set one (see README).
  skybits:
    transport: http
    url: https://skybits.ai/mcp
    headers:
      Authorization: "Bearer ${run.credentials.skybits:-${LOOMCYCLE_SKYBITS_TOKEN}}"
    # Optional operator-level allowlist — narrows what the server exposes
    # BEFORE any agent's tools list is consulted:
    # tools: [outline_document, read_document, edit_document, find_documents, create_doc]

concurrency:
  max_concurrent_runs: 4
  max_queue_depth: 8
  queue_timeout_ms: 600000

# loomcycle config overlay (mounted at /config = LOOMCYCLE_CONFIG_DIR).
# Deep-merged OVER the embedded presets (LOOMCYCLE_PRESETS → CONFIG_DIR). Every
# *.yaml in this directory is loaded, in name order: keep backups elsewhere.
# Secrets live in .env.secure, never here. Checked against v1.108.0.
#
# Models, providers and tiers are kept in step with the TrueNAS deployment: both
# use the same Ollama host, so the same aliases and the same context size avoid
# reloading a model every time the other deployment calls it.

# ─── Providers ────────────────────────────────────────────────────────
providers:
  ollama-local:               # base_url from OLLAMA_BASE_URL (.env.insecure)
    options:
      num_ctx: 65536            # unset → Ollama's 4096 floor. Set HERE, not in env:
      num_gpu: 999              # these options win over LOOMCYCLE_OLLAMA_LOCAL_NUM_*
      header_timeout_ms: 600000 # first-token budget for a cold model load
      # Not 32768: on the shared Spark host (Ollama 0.35.1), qwen3.6 at a
      # 32768 window crashes with "CUDA error: an illegal memory access" on
      # prompts of about 1,100 tokens, every time. 49152, 65536 and 131072 pass.
      idle_timeout_ms: 600000
    max_concurrent: 4           # chat calls in flight (shorthand for lanes.chat)
    # Decision calls — the decision: block's and the memory reranker's — share
    # this lane. It replaces the two blocks' own max_concurrent, which are gone.
    lanes:
      decision: { max_concurrent: 2 }

# ─── Models: name each model once, reference it by alias everywhere ───
# kind: chat (default) | decision | embedder. A tagged alias used in the
# wrong place fails config load.
models:
  # Anthropic (ANTHROPIC_API_KEY)
  haiku:  { provider: anthropic, model: claude-haiku-5-5 }
  sonnet: { provider: anthropic, model: claude-sonnet-5-5 }
  opus:   { provider: anthropic, model: claude-opus-5-5 }
  # OpenAI (OPENAI_API_KEY)
  gpt-mini: { provider: openai, model: gpt-5.4-mini }
  gpt:      { provider: openai, model: gpt-5.4 }
  gpt-max:  { provider: openai, model: gpt-5.5 }
  # DeepSeek (DEEPSEEK_API_KEY)
  deepseek-flash: { provider: deepseek, model: deepseek-flash }
  deepseek-pro:   { provider: deepseek, model: deepseek-v4-pro }
  # Gemini (GEMINI_API_KEY) — patterns resolve to the newest listed match
  gemini-lite:  { provider: gemini, model_pattern: "gemini-*-flash-lite" }
  gemini-flash: { provider: gemini, model_pattern: "gemini-*-flash" }
  gemini-pro:   { provider: gemini, model_pattern: "gemini-*-pro*" }
  # Hosted Ollama cloud (OLLAMA_API_KEY)
  cloud-kimi: { provider: ollama, model: kimi-k3 }
  # Local Ollama over the tailnet (no key)
  local-small:  { provider: ollama-local, model: gpt-oss:latest }
  local-medium: { provider: ollama-local, model: qwen3.6:latest }
  local-high:   { provider: ollama-local, model: ornith-1.5:35b }
  local-dense:  { provider: ollama-local, model: qwen3.8:latest }
  local-embedding: { provider: ollama-local, model: bge-m3:latest, kind: embedder }
  decide:      { provider: ollama-local, model: nimble, kind: decision }
  decide-deep: { provider: ollama-local, model: clef,   kind: decision }

timeout_scaling:
  models:
    local-dense: { max_multiplier: 24 }   # measured as up to 24x, not clipped at the global 8x

# ─── Routing ──────────────────────────────────────────────────────────
provider_priority: [ollama-local, deepseek, gemini, openai, anthropic, ollama]

tiers:
  low:    [local-small,  deepseek-flash, gemini-lite,  haiku,  gpt-mini]
  middle: [local-medium, deepseek-flash, gemini-flash, sonnet, gpt]
  high:   [local-high,   deepseek-pro,   gemini-pro,   opus]

# A run's `user_tier` picks one of these; `default` is required. An unknown
# user_tier is refused. fallback_on_error has no default: omitted = false.
user_tiers:
  default:
    provider_priority: [ollama-local, deepseek, gemini, openai, anthropic, ollama]
    fallback_on_error: true
    max_fallback_attempts: 3
  free:                       # local only; an outage surfaces to the client
    provider_priority: [ollama-local]
    tiers:
      low:    [local-small]
      middle: [local-medium]
      high:   [local-high]
    fallback_on_error: false
  low:
    provider_priority: [ollama-local, deepseek, gemini, anthropic, openai]
    fallback_on_error: true
    max_fallback_attempts: 3
  medium:
    provider_priority: [deepseek, gemini, anthropic, openai]
    fallback_on_error: true
    max_fallback_attempts: 3
  high:                       # best model or an error; no silent downgrade
    provider_priority: [deepseek, anthropic]
    fallback_on_error: false

# ─── Memory ───────────────────────────────────────────────────────────
memory:
  embedder:
    model: local-embedding    # the alias supplies the provider
  consolidation:
    merge_threshold: 0.83
    related_threshold: 0.62
    detect_conflicts: false
  reranker:
    kind: decision
    model: decide
    timeout_ms: 120000        # covers the decision model reloading after a chat model evicts it

# ─── Decision models (a change here needs a restart) ──────────────────
decision:
  default: decide
  models: [decide, decide-deep]   # listed explicitly so no other tagged alias joins
  timeout_ms: 120000

# ─── Agents: overrides of bundled agents only ─────────────────────────
agents:
  doc/manager:
    memory_rerank: { enabled: true }
  chat/medium:
    memory_rerank: { enabled: true }
    tools: !append [Decision]     # adds to the bundle's list
    decision: { default: decide, models: [decide] }
  chat/local:
    memory_rerank: { enabled: true }
    tools: !append [Decision]
    decision: { default: decide, models: [decide] }

  # The memory agents read tenants' chat transcripts. They run from a schedule,
  # under the `default` user tier, whose cascade would otherwise carry a
  # transcript to DeepSeek, Gemini, OpenAI or Anthropic whenever the local model
  # is busy or failing, whatever the tenant's own tier allows. Pinning their
  # provider list keeps that text on the local Ollama. If it is down they fail,
  # and the queue waits for the next run.
  memory/extractor:      { providers: [ollama-local] }
  memory/judge:          { providers: [ollama-local] }
  memory/conflict-judge: { providers: [ollama-local] }
  memory/ontologist:     { providers: [ollama-local] }

# Without this the memory bundle's consolidator stays off, and what agents add
# to memory is queued and never becomes durable. Runs hourly (the bundle's
# schedule). Its model calls are the memory agents above: local only.
scheduled_runs:
  memory-consolidation:
    enabled: true

# ─── Human-in-the-loop ────────────────────────────────────────────────
interruption:
  backend: webui                  # webui | mcp_server:<name> | cli
  default_timeout_ms: 3600000     # 1h when an ask passes no timeout
  max_timeout_ms: 86400000        # 24h ceiling
  max_pending_per_run: 10
  heartbeat_interval_ms: 30000

# ─── Runtime ──────────────────────────────────────────────────────────
concurrency:
  max_concurrent_runs: 8
  max_queue_depth: 32

cache:
  response_kv:
    backend: memory
    ttl: 5m
  native:
    enabled: true                 # honour Anthropic cache_control hints

# ─── Volumes ──────────────────────────────────────────────────────────
# The dynamic root: the runtime makes volumes under it — each run's `inbox`
# (a file an MCP server, HTTP or WebFetch returns is kept there and the model
# sees a one-line reference), ephemeral volumes and VolumeDef volumes. Without
# it a returned file is refused ("[file not kept: …]") and VolumeDef create
# fails. Not bound to agents. The path is the compose mount ./dynamic, which
# must exist and be owned by 65532 (INSTALL.md).
volumes:
  dynamic:
    path: /mnt/dynamic
    mode: rw
    dynamic_root: true

# ─── Access control ───────────────────────────────────────────────────
# The mode is LOOMCYCLE_ACL (compose default: shadow). Every Google sign-in
# gets its own tenant and a tenant-operator token, so each user writes the
# rule lists for their own tenant in Settings → Access. A list declared here
# with `acls:` is reachable from any tenant's binding, but a binding names
# one tenant, so this file cannot bind tenants the landing page creates.

# ─── Sign-in (RFC FA; plan: ../AUTH-INTEGRATION.md) ──────────────────
# Token mode during the migration: the paste box keeps working for existing
# tokens, and the `cloud` password gate signs in people the landing invites.
# The password gate needs LOOMCYCLE_SECRET_KEY (pepper + TOTP secrets) and
# LOOMCYCLE_PUBLIC_URL (invite/reset links): without either, the config does
# not load. INSTALL.md "Upgrading to Web UI sessions" has the host steps.
auth:
  mode: token
  gates:
    token: { kind: token, label: "Access token" }
    cloud:
      kind: password
      label: "loomcycle.cloud account"
      require_mfa: false            # true at the strict switch (plan phase 6)
      invites: { default_ttl: 168h, max_ttl: 720h }
      resets: { ttl: 1h }
      # Exact match, query string included: must equal the landing's
      # LANDING_SIGNUP_RETURN_TO, or every signup fails with invalid_return_to.
      allowed_return_to: ["https://loomcycle.cloud/?welcome=1"]
      # Shared tenant (2026-10-31): everyone who signs up on the website joins
      # the one tenant loomcycle-dev (the landing's LANDING_TENANT) and works on
      # the same material, so a new member gets tenant-wide reach. loomcycle
      # refuses a floor of tenant reach on an untrusted gate, because the floor
      # is what every invitee of the website's credential gets unasked; marking
      # the gate trusted is what accepts that here. It also lets a tenant
      # operator's own invites grant groups beyond the floor.
      trusted: true
      # status: pending is what keeps shared-mode signup from being open: any
      # Google account that passes Cloudflare Access can ask for an invite, so
      # a user created by the website's (auth:manage) invite redeems as pending
      # and reaches nothing but GET /v1/_me until a tenant operator approves it
      # in the app's Users console. An operator's or admin's own invite, an
      # attach invite and the tenant bootstrap stay active.
      # DEPLOY THIS FILE ONLY ON A RUNTIME THAT HAS THE PENDING STATUS: the
      # v1.130.0 or later. An older runtime does not refuse the key, it
      # ignores it, and would admit every sign-up unapproved as an active
      # member with tenant-wide reach. As a second lock the landing refuses
      # shared-mode signup while the runtime's /healthz version is below
      # LANDING_MIN_RUNTIME_VERSION (compose).
      new_user: { access_mode: tenant, status: pending }
      # Off now that nobody owns a tenant through the website: the landing no
      # longer resets or attaches owners' passwords, and leaving it on would let
      # a leaked auth:manage token take over any owner's account. The operator
      # attaches passwords to loomcycle-dev's existing users by hand.
      manager_may_recover_owners: false
  # The tunnel reaches loomcycle through cloudflared, so without these every
  # login would look like it came from cloudflared and one attacker's failures
  # would throttle everyone. Trust ONLY cloudflared's fixed address on the
  # compose `edge` network: on loomnet any container (the agent-driven browser
  # sidecar included) could forge CF-Connecting-IP. Needs the tunnel route on
  # http://loomcycle-edge:8787 (INSTALL.md); until then, traffic arrives over
  # loomnet, is not trusted, and shares one throttle bucket (never spoofable).
  trusted_proxies: ["10.253.253.2/32"]
  client_ip_header: CF-Connecting-IP
  # loomboard signs in with loomcycle as its OAuth authorization server
  # instead of being handed a bearer from the website's token vault, which
  # shared mode no longer has. It is a public client (PKCE, no secret): the
  # hosted app, the desktop app's loopback and custom-scheme callbacks, and
  # the Tauri webview origins it calls from.
  clients:
    loomboard:
      kind: public
      label: loomboard
      redirect_uris:
        - https://board.loomcycle.cloud/auth/callback
        - http://127.0.0.1/auth/callback
        - com.loomboard.app:/auth/callback
      allowed_origins:
        - https://board.loomcycle.cloud
        - tauri://localhost
        - http://tauri.localhost

# ─── Web search ───────────────────────────────────────────────────────
# SearXNG is wired here, NOT via env — there is no LOOMCYCLE_SEARCH_* var. The
# base_url is the in-compose service name. `brave` is an optional paid fallback
# (inert unless BRAVE_API_KEY is set); drop it from search_priority to disable.
search_providers:
  searxng:
    base_url: "http://searxng:8080"
  brave: {}

search_priority: [searxng, brave]

# ─── Headless browser (PinchTab) for the dev/exec agent ───────────────
# PinchTab's MCP is stdio-only, so loomcycle spawns the pinchtab client (shipped in
# the loomcycle-browser image) as a stdio MCP bridge to the `pinchtab` sidecar. The
# child inherits PINCHTAB_TOKEN from loomcycle's env, so no ${...} interpolation is
# needed here. The dev/exec agent already grants mcp__browser__* in its tool
# ceiling, so this overlay only DECLARES the server.
mcp_servers:
  browser:
    transport: stdio
    command: /usr/local/bin/pinchtab
    args: ["--server", "http://pinchtab:9867", "mcp"]

# loomcycle — self-contained cloud deployment (Ubuntu 25.04, Docker Compose)
#
# One stack: Postgres 18 + pgvector, the loomcycle runtime + one-shot migrate,
# the code-exec builder sidecar, SearXNG, a Caddy landing server, a Tailscale
# egress sidecar (to reach a local Ollama over the tailnet), and a Cloudflare
# tunnel that exposes app.loomcycle.cloud (the app) + loomcycle.cloud (landing).
#
# Run it with BOTH env files so `${VAR}` interpolation resolves (a Makefile wraps
# this — `make up`):
#   docker compose --env-file .env.insecure --env-file .env.secure up -d
#
# Secrets scoping: each service's `environment:` pulls ONLY the secret it needs
# via ${VAR}; loomcycle/migrate additionally `env_file:` both files to bulk-load
# their many LOOMCYCLE_* settings. Never put a secret in an `environment:` literal.
#
# NETNS NOTE (Tailscale): the `loomcycle` runtime uses `network_mode:
# service:tailscale`, so it has NO compose DNS name of its own — everything that
# dials it targets `http://tailscale:8787`. loomcycle still reaches postgres/
# searxng/builder-sidecar by service name (the tailscale container is on loomnet),
# and reaches Ollama by RAW tailnet IP (MagicDNS is not available in the shared
# netns — see OLLAMA_BASE_URL in .env.insecure).

name: loomcycle

networks:
  loomnet:
    driver: bridge
  # Dedicated network for serve-and-test sessions. A sandbox_open with `expose:<alias>`
  # attaches the (host-Docker-sibling) session container HERE under a --network-alias,
  # so a dev server it binds is reachable from the pinchtab sidecar at
  # http://<alias>:<port>. It is PINNED to `name: loom-dev` because the builder-sidecar
  # launches sessions on the host Docker daemon (SANDBOX_PODMAN_BIN=docker) and passes
  # this literal name to `docker run --network` — a compose project prefix would break
  # that reference. A normal (egress-capable) bridge: an exposed session still fetches
  # deps; expose therefore WINS over the separate egress bridge (see engine.go).
  # SECURITY: this network is shared by the browser sidecar and every exposed session,
  # so keep it OFF loomcycle's own loomnet, keep exposure opt-in (per-call + the
  # SANDBOX_EXPOSE_NETWORK gate), and use a UNIQUE alias per concurrent session.
  loom-dev:
    name: loom-dev
    driver: bridge

services:
  # ── Postgres 18 + pgvector — main store (loomcycle) + SQL-Memory aux (loomcycle_sqlmem) ──
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    networks: [loomnet]
    environment:
      POSTGRES_USER: loomcycle
      POSTGRES_DB: loomcycle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      # Runs ONCE on first init: creates loomcycle_sqlmem + the sqlmem pgvector schema.
      - ./postgres/initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loomcycle -d loomcycle"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  # ── One-shot schema migration for the MAIN db (SQL Memory self-provisions at runtime) ──
  loomcycle-migrate:
    image: denngubsky/loomcycle:1.43.0
    command: ["migrate", "up"]
    restart: "no"
    user: "65532:65532"
    networks: [loomnet]
    # Non-secret settings from env_file; only the DSN secret is injected explicitly
    # (scoped — migrate never needs the sidecar tokens).
    env_file:
      - ./.env.insecure
    environment:
      LOOMCYCLE_PG_DSN: ${LOOMCYCLE_PG_DSN}
    depends_on:
      postgres:
        condition: service_healthy

  # ── Tailscale egress sidecar — kernel mode; owns the netns loomcycle shares ──
  tailscale:
    image: tailscale/tailscale:latest
    restart: unless-stopped
    hostname: loomcycle-cloud
    networks: [loomnet]
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"      # kernel mode → real interface + routes for egress
      TS_ACCEPT_DNS: "false"     # do NOT let tailscale clobber the netns DNS that
                                 # loomcycle's service-name resolution depends on
    volumes:
      - ./ts-state:/var/lib/tailscale
    healthcheck:
      test: ["CMD", "tailscale", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    # Optional local-debug port for the loomcycle UI (it lives in THIS netns).
    # Uncomment to reach it on the host loopback; not needed for the CF tunnel.
    # ports:
    #   - "127.0.0.1:8787:8787"

  # ── Code-execution sandbox sidecar (host-Docker-socket model) ──
  # The sidecar is a SEPARATE image from the runtime, lockstep-versioned with it and
  # published MULTI-ARCH (amd64+arm64) by the `publish-sandbox-images` workflow on each
  # release tag. Session exposure (SANDBOX_EXPOSE_NETWORK, below) needs the seam that
  # shipped in 1.43.0 — keep this pin in step with the runtime tag, and never hand-push
  # a single-arch build over the tag (a linux/amd64 host then can't pull it).
  builder-sidecar:
    image: denngubsky/loomcycle-builder-docker:1.43.0
    restart: unless-stopped
    networks: [loomnet]
    environment:
      SANDBOX_PODMAN_BIN: docker         # launch sessions as host-Docker siblings
      SANDBOX_IMAGE: denngubsky/loomcycle-sandbox-session:latest
      SANDBOX_WORKSPACE_ROOT: /mnt/work  # per-session /work is tmpfs by default;
                                         # durable named workspaces need the same
                                         # HOST path here — see INSTALL.md.
      SANDBOX_MAX_CPUS: "2"
      SANDBOX_MAX_MEM_MB: "2048"
      SANDBOX_ALLOW_EGRESS: "1"          # permit network:"egress" sessions (git clone / fetch deps)
      SANDBOX_ALLOW_ENV_INJECTION: "1"   # permit X-Loom-Sandbox-Env-* -> session env (git/gh token)
      SANDBOX_EXPOSE_NETWORK: loom-dev   # permit sandbox_open expose:<alias> — attach a serve-and-test
                                         # session to this network so the browser can reach it (see below)
      SANDBOX_AUTH_TOKEN: ${SANDBOX_AUTH_TOKEN}   # SAME secret loomcycle presents
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./work:/mnt/work
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # ── The loomcycle runtime — shares the tailscale netns (no own DNS name / ports) ──
  loomcycle:
    # Derived image = official loomcycle + the PinchTab MCP client binary, so the
    # runtime can spawn `pinchtab … mcp` (stdio) against the pinchtab sidecar. See
    # loomcycle.Dockerfile. (loomcycle-migrate keeps the plain image — it needs no
    # browser.)
    build:
      context: .
      dockerfile: loomcycle.Dockerfile
      args:
        LOOMCYCLE_TAG: "1.43.0"
        PINCHTAB_TAG: "0.15.0"
    restart: unless-stopped
    user: "65532:65532"
    network_mode: "service:tailscale"   # → reachable at http://tailscale:8787
    # Non-secret settings via env_file; loomcycle's OWN secrets injected explicitly
    # so the sidecar tokens (TS/CF/PG/SearXNG) stay OUT of the runtime's env — it
    # executes agent code, so we keep its blast radius minimal. Optional keys use
    # ${VAR:-} so an unset one is simply empty (provider excluded), no warning.
    env_file:
      - ./.env.insecure
    environment:
      LOOMCYCLE_AUTH_TOKEN: ${LOOMCYCLE_AUTH_TOKEN}
      LOOMCYCLE_OPERATOR_TOKEN_PEPPER: ${LOOMCYCLE_OPERATOR_TOKEN_PEPPER:-}
      LOOMCYCLE_SECRET_KEY: ${LOOMCYCLE_SECRET_KEY:-}
      LOOMCYCLE_PG_DSN: ${LOOMCYCLE_PG_DSN}
      LOOMCYCLE_SQLMEM_PG_DSN: ${LOOMCYCLE_SQLMEM_PG_DSN}
      SANDBOX_AUTH_TOKEN: ${SANDBOX_AUTH_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      # Auth for the pinchtab MCP stdio bridge → the pinchtab sidecar. The stdio
      # child inherits loomcycle's env, so no config interpolation is needed.
      PINCHTAB_TOKEN: ${PINCHTAB_TOKEN:-}
    volumes:
      - ./data:/data
      - ./config:/config:ro
      - ./work:/mnt/work
    healthcheck:
      test: ["CMD", "/usr/local/bin/loomcycle", "health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      tailscale:
        condition: service_healthy
      postgres:
        condition: service_healthy
      loomcycle-migrate:
        condition: service_completed_successfully
      builder-sidecar:
        condition: service_healthy

  # ── SearXNG — in-network search backend (keyless; wired via config/loomcycle.yaml) ──
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    networks: [loomnet]
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET}
    volumes:
      - ./searxng:/etc/searxng:rw
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # ── Headless browser (PinchTab) — internal MCP browser for the dev/exec agent.
  #    stdio-only MCP, so loomcycle spawns `pinchtab … mcp` (client baked into its
  #    derived image) against THIS server; Chromium lives here, not in loomcycle.
  #    Internal ONLY — no published port (pinchtab's control plane is not for public
  #    exposure). Widen its browsing domain allowlist (IDPI) per your needs — see
  #    INSTALL.md and the pinchtab security guide.
  pinchtab:
    image: pinchtab/pinchtab:0.15.0
    restart: unless-stopped
    # loomnet: loomcycle reaches this server's MCP over it. loom-dev: reach a
    # serve-and-test session by its --network-alias (http://<alias>:<port>). The alias
    # must ALSO be in pinchtab's IDPI allowlist (security.allowedDomains) or the browse
    # is blocked — see INSTALL.md / docs/SANDBOX.md.
    networks: [loomnet, loom-dev]
    environment:
      PINCHTAB_TOKEN: ${PINCHTAB_TOKEN}   # SAME secret loomcycle presents on the MCP bridge
      # `pinchtab config set` persists to ./pinchtab-data (below), so the allowlist
      # ALREADY survives restarts + reboots. To manage it DECLARATIVELY instead (one
      # version-controlled file, no manual `config set`), uncomment PINCHTAB_CONFIG +
      # the read-only mount below and edit pinchtab-config.json (see pinchtab-config.json.example).
      # The token stays in the env var — the file carries only non-secret settings.
      # PINCHTAB_CONFIG: /etc/pinchtab/config.json
    volumes:
      - ./pinchtab-data:/data             # HOME/config + Chrome profile (rootfs is read-only)
      # - ./pinchtab-config.json:/etc/pinchtab/config.json:ro   # declarative allowlist (with PINCHTAB_CONFIG)
    shm_size: "2gb"                       # Chrome stability
    read_only: true
    tmpfs:
      - /tmp:size=512m,noexec,nosuid,nodev
      - /run:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 2g

  # ── Landing (Node) — serves cloud-web/, proxies public /v1 reads (inner links),
  #    and mints substrate:tenant tokens behind Cloudflare Access (admin token
  #    held server-side). See landing/server.js. ──
  landing:
    build: ./landing
    restart: unless-stopped
    networks: [loomnet]
    environment:
      PORT: "8080"
      LOOMCYCLE_URL: http://tailscale:8787      # loomcycle lives in the tailscale netns
      LOOMCYCLE_ADMIN_TOKEN: ${LOOMCYCLE_ADMIN_TOKEN}   # secret — the admin bearer that mints
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      MINT_SCOPES: ${MINT_SCOPES:-substrate:tenant,runs:create}
      MINT_TENANT_PREFIX: ${MINT_TENANT_PREFIX:-t_}
      APP_ORIGIN: ${LANDING_ORIGIN:-https://loomcycle.cloud}   # CSRF origin check
      # MINT_DEV_ALLOW_UNVERIFIED: "1"   # LOCAL DEV ONLY — skips CF Access JWT verify
    volumes:
      - ./web:/srv:ro          # copy of the repo's cloud-web/ (see INSTALL.md)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/_up >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      tailscale:
        condition: service_healthy

  # ── Hosted loomboard browser app — board.loomcycle.cloud ──
  #    Serves the standalone SPA (connect-handoff allowlist baked in) + proxies
  #    /v1/* to the runtime. Tunnel route: board.loomcycle.cloud → loomboard:8080.
  loomboard:
    build:
      context: ./loomboard
      args:
        LOOMBOARD_REF: feature-connect-handoff
        CONNECT_ORIGINS: https://loomcycle.cloud
    restart: unless-stopped
    networks: [loomnet]
    depends_on:
      tailscale:
        condition: service_healthy

  # ── Cloudflare tunnel (token method) — app + loomcycle + board.loomcycle.cloud ──
  #    Dashboard routes: app.loomcycle.cloud → http://tailscale:8787 (the runtime),
  #    loomcycle.cloud → http://landing:8080 (this stack),
  #    board.loomcycle.cloud → http://loomboard:8080 (the hosted loomboard).
  #    Protect /api/* on loomcycle.cloud with a Cloudflare Access (Google) policy — see INSTALL.md.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    networks: [loomnet]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      tailscale:
        condition: service_healthy
      landing:
        condition: service_started

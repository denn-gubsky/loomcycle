# embedded bundle: chat
# Two general-purpose conversational agents for direct chatting in the
# interactive /run terminal:
#   chat/medium — tier:middle (routes per your provider_priority; cloud-capable)
#   chat/local  — pinned to the local middle model (ollama-local); never leaves the box
#
# Selected via `LOOMCYCLE_PRESETS=…,chat`. This bundle carries NO provider matrix:
# `chat/medium` needs a `middle` tier and `chat/local` needs the `local-medium` alias from
# another layer — select `base` alongside it (or supply your own).
#
# Requirements for the full toolset:
#   - File/shell tools (Read/Write/Edit/Grep/Glob/Bash/Bashbox) need a read-write
#     volume. These agents declare no `volumes:`, so they use the operator's
#     DEFAULT volume — define a `volumes:` entry with `default: true, mode: rw`
#     (or bind one per agent in your overlay). Without it, those tools are
#     registered-but-idle.
#   - Document + Memory need LOOMCYCLE_SQLMEM_ENABLED=1 (Document is SQL-backed).
#   - WebSearch needs BRAVE_API_KEY; WebFetch/WebSearch need LOOMCYCLE_HTTP_HOST_ALLOWLIST.
#   - Bashbox needs LOOMCYCLE_BASHBOX_ENABLED=1; Bash needs LOOMCYCLE_BASH_ENABLED=1.
#   - chat/local's large context window is the GLOBAL LOOMCYCLE_OLLAMA_LOCAL_NUM_CTX
#     env (e.g. 131072 for 128K) — it can't be set per-agent in yaml.
#
# The operator overlay can override any field by re-declaring the key (last layer
# wins per field). It cannot WIDEN tools (the AgentDef ceiling is unchanged).

agents:
  chat/medium:
    tier: middle
    effort: medium
    # Auto-inject the deployment capabilities + a per-tool call digest (op enum +
    # required args + usage hints) so the agent knows what it can do and how to
    # call its tools without the operator hand-pointing it at help topics.
    inject_tool_guide: true
    # max_tokens intentionally OMITTED — each provider applies its own default
    # (Anthropic defaults to 8192; ollama generates until the context fills).
    # Pinning a value would only IMPOSE a per-reply cap, not add headroom.
    unbounded_iterations: true              # interactive chat parks at end_turn
    tools: [Read, Write, Edit, Grep, Glob, WebSearch, WebFetch, HTTP, Bashbox, Bash, Document, Memory, Path, Skill, SkillDef, Agent, Interruption]
    memory_scopes: [user]
    # sql_scopes grants `Memory sql_query`/`sql_exec` — NOT Document, whose
    # structure writes are its own trusted SQL and which checks sql_scopes only at
    # TENANT scope. The comment here used to claim otherwise. Kept because an
    # interactive operator agent having a queryable per-user database is plausibly
    # wanted; drop it if you would rather chat could not run raw SQL.
    sql_scopes: [user]
    sampling:
      temperature: 0.7
    compaction:
      enabled: true
      # RFC BL P3: bank the turns each compaction discards onto the
      # consolidation queue. These agents are exactly the case the bridge
      # exists for — they compact repeatedly and park at end_turn rather than
      # terminating, so consolidation's all-runs-terminal predicate never
      # selects their sessions and nothing would ever be learned from them.
      # Requires `user` in memory_scopes (above): consolidation drains user
      # scopes only.
      memory_flush: true
      autocompact_at_pct: 80
    system_prompt: |
      You are CHAT, a helpful, direct general-purpose assistant for an operator
      working in the loomcycle terminal. Hold a natural multi-turn conversation:
      answer questions, reason through problems, and reach for your tools when
      they make the answer better or are needed to act.

      {{memory:tenant_info}}

      ## Tools
      {{tool:Context.tools}}

      Choosing among them:
      - Web: WebSearch when the answer depends on recent or external facts rather
        than guessing; WebFetch to read a specific URL.
      - Files: Grep/Glob to locate first, Read to inspect, Edit for in-place
        changes. All operate inside your bound working volume.
      - Shell: prefer Bashbox (sandboxed, rooted at your volume, no network; a few
        host commands — git, gh, curl, jq, rsync — via its fallback) over Bash,
        the unsandboxed escape hatch.
      - Memory / Document / Path: durable facts across turns go in Memory (user
        scope), structured chunked material in a Document, and Path navigates
        both.
      - Recalling what you know about the user or a THING starts with ONE call:
        `Memory op=recall scope=user query="<the question in your own words>"`.
        Both `scope` and `query` are required, and recall is the only semantic
        search over remembered facts. Every tool here takes an `op`; when unsure
        of a tool's arguments, `Context op=doc name=<Tool>` prints its schema
        instead of making you learn it from errors.
      - `Document graph_recall` is the SECOND step, not the first. It follows the
        relations between facts, so it finds facts recorded in different words
        that share an entity — but it walks out from facts carrying entity
        metadata, so on a store without those it returns `seeds: 0` and tells you
        nothing. Use it to expand a fact recall already found, not to go looking.
        `as_of` answers as of a past moment, recovering a fact since corrected.
      - Searching document TEXT rather than facts is
        `Memory op=search scope=user prefix="doc.chunk:" query="..."`.

      ## Style
      - Be concise and concrete; lead with the answer, then the reasoning.
      - Ask a clarifying question when the request is ambiguous instead of
        guessing.
      - When you act with a tool, briefly say what you did and what you found.

  chat/local:
    model: local-medium                     # → ollama-local; local-only, no cloud fallback
    effort: medium
    # Local models under-attend to the tool schemas the loop already sends, so the
    # runtime-knowledge injection matters most here — see chat/medium above.
    inject_tool_guide: true
    # max_tokens OMITTED — ollama-local generates until the context window fills
    # (set the window via LOOMCYCLE_OLLAMA_LOCAL_NUM_CTX, e.g. 131072 for 128K).
    unbounded_iterations: true
    tools: [Read, Write, Edit, Grep, Glob, WebSearch, WebFetch, HTTP, Bashbox, Bash, Document, Memory, Path, Skill, SkillDef, Agent, Interruption]
    memory_scopes: [user]
    sql_scopes: [user]
    sampling:
      temperature: 0.7
    compaction:
      enabled: true
      memory_flush: true                    # RFC BL P3 — see chat/medium above
      autocompact_at_pct: 70
    system_prompt: |
      You are CHAT-LOCAL, the same helpful general-purpose assistant as CHAT, but
      you run entirely on the operator's LOCAL model (ollama-local) — nothing you
      process leaves the box. Favor this for private or offline work.

      {{memory:tenant_info}}

      ## Tools
      {{tool:Context.tools}}

      Choosing among them:
      - Web: WebSearch for current information; WebFetch to read a specific URL.
      - Files: Grep/Glob to locate, Read to inspect, Edit for in-place changes —
        inside your bound working volume.
      - Shell: prefer Bashbox (sandboxed, rooted at your volume, no network; git,
        gh, curl, jq, rsync via its fallback) over Bash, the unsandboxed escape
        hatch.
      - Memory / Document / Path: durable user-scope facts in Memory, structured
        material in a Document, and Path navigates both.
      - "What do I know about the user / what did they tell me?" — that is a
        SEMANTIC MEMORY SEARCH, and it is one call:
        `Memory op=recall scope=user query="<the question in your own words>"`.
        Both `scope` and `query` are required; recall is the ONLY semantic search
        over remembered facts. Do not guess at argument names — every tool here
        takes an `op`, and `Context op=doc name=<Tool>` prints its exact schema.
      - `Document graph_recall` is NOT the entry point for that. It walks
        RELATIONS out from facts that already carry entity metadata, so on a
        store without those it returns `seeds: 0` and tells you nothing. Reach
        for it only after `Memory op=recall` gave you a fact worth expanding.
      - Searching document TEXT (not facts) is
        `Memory op=search scope=user prefix="doc.chunk:" query="..."`.

      ## Style
      - Be concise and concrete; lead with the answer, then the reasoning.
      - Ask a clarifying question when the request is ambiguous.
      - You run on a local model, so keep tool use deliberate and reasoning
        efficient — prefer one focused search/read over many speculative calls.

  chat/local-small:
    model: local-small                     # → ollama-local; local-only, no cloud fallback
    effort: medium
    # A small local model needs the runtime-knowledge injection most — see
    # chat/medium above.
    inject_tool_guide: true
    # max_tokens OMITTED — ollama-local generates until the context window fills
    # (set the window via LOOMCYCLE_OLLAMA_LOCAL_NUM_CTX, e.g. 131072 for 128K).
    unbounded_iterations: true
    tools: [Read, Write, Edit, Grep, Glob, WebSearch, WebFetch, HTTP, Bashbox, Bash, Document, Memory, Path, Skill, SkillDef, Agent, Interruption]
    memory_scopes: [user]
    sql_scopes: [user]
    sampling:
      temperature: 0.7
    compaction:
      enabled: true
      memory_flush: true                    # RFC BL P3 — see chat/medium above
      autocompact_at_pct: 70
    system_prompt: |
      You are CHAT-LOCAL, the same helpful general-purpose assistant as CHAT, but
      you run entirely on the operator's LOCAL model (ollama-local) — nothing you
      process leaves the box. Favor this for private or offline work.


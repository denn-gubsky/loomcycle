# RFC GM P7 measurement — overview questions for kb/walker, with and without
# the taxonomy moves. Written for this measurement and not used to tune any
# prompt: neither the walker nor kb/ask has seen them. Do not edit a question
# after the first run; add a new id instead, so runs stay comparable.
#
# kind:
#   overview  "what do we have on X": the answer lists documents.
#   area      "what is in this part of the corpus": the answer groups by topic.
#   changed   "what changed / is new in X": the answer needs dates or series.
#
# gold: stays empty HERE. The gold (document ids, or gold_topics) names a real
# tenant's documents and lives in a gold file outside the repo, passed with
# --gold and merged by id (see README.md, "Gold"); the driver scores only
# questions with gold.
questions:
  - id: q01
    kind: overview
    text: What do we have on routing a question to the right answering agent?
    gold: []
  - id: q02
    kind: overview
    text: Which documents describe how agents are kept from reading files outside their volumes?
    gold: []
  - id: q03
    kind: overview
    text: What material do we hold on cost attribution and token budgets?
    gold: []
  - id: q04
    kind: overview
    text: What is written about resuming a paused run on another instance?
    gold: []
  - id: q05
    kind: overview

# loomcycle TrueNAS overlay — BROWSER + WORKSPACE variant (for docker-compose.browser.yaml).
#
# Copy to your config dataset as loomcycle.yaml (the compose mounts that dataset at
# /config and selects it via LOOMCYCLE_CONFIG_DIR). Layered OVER the embedded presets
# (RFC AQ): the presets — including `dev-workspace` selected in the compose — supply
# the dev/exec agent and the workspace egress routes; this file adds only what's
# specific to this box: the agent Volumes, the worker endpoint, workspaces and the
# PinchTab browser MCP server.
#
# Keep secrets OUT of this file — they're TrueNAS-managed env (the compose). This
# overlay is non-secret config only.

# Agent filesystem Volumes (RFC AH). Each `path` is the IN-CONTAINER mount point (the
# right-hand side of the compose volume mount), which the bind mount creates.
volumes:
  work:
    path: /mnt/work        # ← matches the compose mount: /mnt/tank/loomcycle/work:/mnt/work
    mode: rw
    default: true

# Process metrics sampler: CPU and memory samples while runs are active
# (GET /v1/_metrics/*, the Web UI's activity page), with the host's own CPU
# and memory beside them. Delete the block to turn it off.
metrics:
  enabled: true
  collect_system: true

# Local models: force GPU offload where Ollama's detection falls back to CPU
# (99 = all layers). Delete the block to let Ollama decide. The context window
# is LOOMCYCLE_OLLAMA_LOCAL_NUM_CTX in the compose.
providers:
  ollama-local:
    options:
      num_gpu: 99

# ── Headless browser (PinchTab) for the dev/exec agent ────────────────────────
# PinchTab's MCP is stdio-only, so loomcycle spawns the pinchtab client (present in the
# loomcycle-browser image) as a stdio MCP bridge to the `pinchtab` server sidecar. The
# child inherits PINCHTAB_TOKEN from loomcycle's env (from sandbox.secrets.env), so no
# ${...} interpolation is needed here. The dev/exec agent (dev-workspace bundle) already
# grants mcp__browser__* in its tool ceiling and drives it via the envelope's optional
# `browser` steps, so this overlay only needs to DECLARE the server — no agent override.
mcp_servers:
  browser:
    transport: stdio
    command: /usr/local/bin/pinchtab
    args: ["--server", "http://pinchtab:9867", "mcp"]

# The worker endpoint: the conversion-worker and workspace-worker containers of
# the compose attach here over the internal `workers` network. Never publish 7788.
worker_endpoint:
  listen: 0.0.0.0:7788   # reachable only on the internal workers network
  insecure: true         # plain gRPC, acceptable because that network is internal

# Conversion workers (RFC GO): every file conversion goes to the conversion-worker
# containers. Delete the block (and the conversion-worker service) to convert
# inside the runtime instead.
conversion:
  mode: remote

# Workspaces (RFC GW): agents run commands in workspaces on the workspace-worker
# container, which runs each workspace in a session container of its own. An agent
# also needs a `workspace:` grant (dev/exec has one). docs/CONFIGURATION.md
# "Workspace workers" lists the limits (disk quota, command timeouts, egress routes).
workspace:
  mode: remote

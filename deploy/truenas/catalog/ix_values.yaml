# Static defaults — images + template constants (not user-editable). RFC AR.
images:
  image:
    # The distroless image. Agents run commands in a workspace on a workspace
    # worker, not in this container: the browser variant of Route A (paste
    # compose, ../docker-compose.browser.yaml) runs one; see ../INSTALL.md.
    repository: denngubsky/loomcycle
    # Bump this + app_version in app.yaml in lockstep on an image bump.
    tag: "1.23.1"
consts:
  app_container_name: loomcycle
  # distroless nonroot — the image is fixed at uid/gid 65532 (no arbitrary-uid
  # support), so this is a constant, not a user question.
  uid: 65532
  gid: 65532
  data_path: /data
  config_path: /config

# loomcycle on TrueNAS SCALE — custom-app (paste-compose) deployment.
#
# Fast route: Apps → Discover → ⋮ → "Install via YAML" → paste this file. The full
# step-by-step (Postgres, datasets, the secrets env file) is in ./INSTALL.md; the
# reference runbook is ../docs/TRUENAS.md; the catalog-app (wizard) route is in
# ./catalog/. Applies to TrueNAS SCALE Electric Eel 24.10+.
#
# Before you install (copy-paste commands in INSTALL.md) — replace `tank` with your
# pool name throughout:
#   1. Datasets, chowned to the container uid 65532:
#        mkdir -p /mnt/tank/loomcycle/{data,config,work}
#        chown -R 65532:65532 /mnt/tank/loomcycle
#   2. Postgres ≥ 14 with the `loomcycle` + `loomcycle_sqlmem` DBs and a CREATEROLE
#      login role (see ../docs/TRUENAS.md §Postgres).
#   3. A thin overlay at /mnt/tank/loomcycle/config/loomcycle.yaml (the agent
#      `volumes:` block and the `conversion:` block) — copy
#      loomcycle.overlay.example.yaml.
#   4. Two root-only env files under /mnt/tank/loomcycle/config/ (INSTALL.md Phase 4):
#        • loomcycle.secrets.env — LOOMCYCLE_AUTH_TOKEN, LOOMCYCLE_OPERATOR_TOKEN_PEPPER,
#          LOOMCYCLE_PG_DSN, LOOMCYCLE_SQLMEM_PG_DSN, LOOMCYCLE_WORKER_TOKEN and your
#          provider keys.
#        • loomcycle.worker.env — ONLY LOOMCYCLE_WORKER_TOKEN (the same value), so
#          the conversion workers never see the DSNs or provider keys.
#      Secrets go in THOSE files, never here — TrueNAS's "Install via YAML" cannot
#      resolve ${VAR}, so `env_file:` (an absolute host path read at
#      container-create) is the mechanism that works.
#   5. Fill the placeholders below (TRUENAS_HOST, OLLAMA_HOST, the pool) and paste.
#
# ── IMAGE ─────────────────────────────────────────────────────────────────────
#   denngubsky/loomcycle — the DISTROLESS runtime (no shell, no toolchain). Agents
#   do not run commands in it: they run them in a workspace on a workspace worker
#   (the Workspace tool). ./docker-compose.browser.yaml is this compose plus a
#   workspace worker on the container engine; docs/WORKERS.md "Workspace workers".
#
#   Registry: every loomcycle image is also on GHCR — prefix it with
#   `ghcr.io/denn-gubsky/` (same build, same digest) if a Docker Hub pull fails
#   with `toomanyrequests`. INSTALL.md → "Docker Hub rate limits".

name: loomcycle

services:
  # One-shot schema migration: runs `loomcycle migrate up`, then exits; the runtime
  # waits for it (LOOMCYCLE_PG_AUTOMIGRATE=0 below keeps schema bumps explicit).
  loomcycle-migrate:
    image: denngubsky/loomcycle:1.153.0   # keep in lockstep with the runtime
    user: "65532:65532"
    restart: "no"
    command: ["migrate", "up"]
    env_file:
      # PG DSNs come from here (LOOMCYCLE_PG_DSN / LOOMCYCLE_SQLMEM_PG_DSN).
      - /mnt/tank/loomcycle/config/loomcycle.secrets.env

  loomcycle:
    image: denngubsky/loomcycle:1.153.0
    user: "65532:65532"
    restart: unless-stopped
    depends_on:
      loomcycle-migrate:
        condition: service_completed_successfully
    ports:
      # App-network port. Front with your tunnel/proxy — no public bind here.
      # Never publish 7788 (the conversion worker endpoint).
      - "8787:8787"
    # default: Postgres, Ollama and your proxy reach the app here.
    # workers: the internal network the conversion workers attach over.
    networks: [default, workers]
    env_file:
      # Tokens, PG DSNs, provider keys. NEVER put a secret in `environment:` below
      # (an inline key would also OVERRIDE the same key from the env file).
      - /mnt/tank/loomcycle/config/loomcycle.secrets.env
    environment:
      # ── core ──────────────────────────────────────────────────────────────
      LOOMCYCLE_LISTEN_ADDR: "0.0.0.0:8787"
      # Externally-reachable base URL (your tunnel/proxy host); agents read it via
      # `Context op=self`. Set to how you actually front the app.
      LOOMCYCLE_PUBLIC_URL: "http://TRUENAS_HOST:8787"
      # Provider/tier matrix + built-in agents from the embedded presets (RFC AQ).
      LOOMCYCLE_PRESETS: "base,document-agent,chat,agent-teams,team-examples"
      LOOMCYCLE_CONFIG_DIR: /config           # the thin overlay (volumes: block)
      LOOMCYCLE_DATA_DIR: /data               # loomcycle's own state

      # ── storage — your external Postgres (DSNs live in the secrets env file) ──
      LOOMCYCLE_PG_AUTOMIGRATE: "0"           # the migrate service handles migrations
      LOOMCYCLE_PG_MAX_OPEN_CONNS: "48"
      LOOMCYCLE_PG_MIN_IDLE_CONNS: "8"

      # ── operability ───────────────────────────────────────────────────────
      # The metrics sampler is switched on in the config overlay (`metrics:`).
      LOOMCYCLE_METRICS_RETENTION_DAYS: "7"
      LOOMCYCLE_AUDIT_LOG_PATH: /data/audit.log   # a FILE, not the /data dir

      # ── local models (optional; point at your Ollama) ─────────────────────
      OLLAMA_BASE_URL: "http://OLLAMA_HOST:11434"
      LOOMCYCLE_OLLAMA_LOCAL_NUM_CTX: "65535"     # pin the local context window
      # GPU offload (num_gpu) is in the config overlay: providers.ollama-local.options.

      # ── HTTP / WebFetch host policy ───────────────────────────────────────
      # "*" allows any host — an SSRF surface, fine for a TRUSTED single-tenant box
      # behind a private network/tunnel. NARROW it for multi-tenant (a suffix list
      # like com,org,net,io,ai,dev). Private IPs stay hard-blocked either way.
      LOOMCYCLE_HTTP_HOST_ALLOWLIST: "*"

      # ── access control (rule lists, groups, bindings) ─────────────────────
      # compat (the default) keeps the scope gates deciding, plus any deny you
      # bind. shadow keeps them deciding and logs + audits every place your rules
      # would answer differently (`acl_shadow_diverged`). enforce lets the rules
      # decide (403 acl_denied; 503 acl_unavailable if they can't be read). Run
      # shadow until the log is quiet, then switch to enforce. Read at startup:
      # restart the app after a change. Write rules in the Web UI's Access pages, or in
      # the overlay's acls: / groups: / acl_bindings: blocks — see INSTALL.md.
      LOOMCYCLE_ACL: "shadow"
      # LOOMCYCLE_ACL_CACHE_TTL_SECONDS: "5"   # how long compiled rules are trusted (0 = every request)
      # LOOMCYCLE_ACL_LIVE: "1"                # a run in flight follows rule changes (default: rules fixed at its start)

      # ── files tools return (the run inbox) ────────────────────────────────
      # A file an MCP server, HTTP or WebFetch returns is kept in the run's
      # `inbox` volume under the overlay's dynamic_root volume (the `dynamic`
      # mount below) and the model sees a one-line reference, never the bytes.
      # Without a dynamic_root volume a file is refused, not passed through.
      # Defaults shown; uncomment to change.
      # LOOMCYCLE_FILE_MAX_BYTES: "67108864"          # one kept file (64 MiB)
      # LOOMCYCLE_FILE_INBOX_MAX_BYTES: "1073741824"  # a run tree's whole inbox (1 GiB)
      # LOOMCYCLE_MCP_MAX_FRAME_BYTES: "16777216"     # one MCP response (stdio line / HTTP body)
    volumes:
      - /mnt/tank/loomcycle/data:/data
      - /mnt/tank/loomcycle/config:/config:ro
      # Agent filesystem Volume(s) (RFC AH): the overlay's volumes: block maps a
      # name to the IN-CONTAINER path (e.g. work → /mnt/work). Add a mount + overlay
      # entry per agent volume.
      - /mnt/tank/loomcycle/work:/mnt/work
      # The dynamic_root volume (overlay `dynamic:`): runtime-made volumes — a
      # run's inbox, ephemeral and VolumeDef volumes — live under it.
      - /mnt/tank/loomcycle/dynamic:/mnt/dynamic
    healthcheck:
      # The binary's own probe GETs /healthz — image-agnostic (no curl needed).
      test: ["CMD", "/usr/local/bin/loomcycle", "health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Conversion workers (RFC GO, docs/WORKERS.md) ──────────────────────────
  # Every file conversion runs here, not in the runtime: text extraction, OCR
  # page rendering (pdftoppm), voice-note conversion and spoken-reply encoding
  # (ffmpeg), image re-encoding. A file that exhausts a worker's memory kills
  # that worker, which restarts; the runtime answers that one call with an
  # error and every other run goes on. Needs `conversion: mode: remote` in the
  # overlay (Phase 3); the runtime image then needs no ffmpeg or poppler.
  #
  # The workers sit on an internal network with the runtime only: they reach
  # its worker endpoint (port 7788) and nothing else, not the internet, not
  # the runtime's API, not your datasets. A file reaches them only as bytes.
  # Keep the worker image on the runtime's release.
  conversion-worker:
    image: denngubsky/loomcycle-worker:1.153.0
    restart: unless-stopped
    depends_on:
      loomcycle:
        condition: service_started
    env_file:
      # ONLY LOOMCYCLE_WORKER_TOKEN; never the main secrets file.
      - /mnt/tank/loomcycle/config/loomcycle.worker.env
    environment:
      LOOMCYCLE_WORKER_DISPATCHER: loomcycle:7788
      # Plain gRPC, acceptable because the workers network is internal.
      LOOMCYCLE_WORKER_INSECURE: "1"
    deploy:
      # If your TrueNAS version refuses replicas, copy this service as
      # conversion-worker-1 and conversion-worker-2 instead.
      replicas: 2
    mem_limit: 1g
    read_only: true
    tmpfs:
      - /scratch:size=1g,mode=0700,uid=65532,gid=65532
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [workers]

networks:
  workers:
    internal: true

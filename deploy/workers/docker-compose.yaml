# Conversion workers (RFC GO, conversion.mode remote): the runtime and two
# workers of its own. See docs/WORKERS.md.
#
# The runtime's config needs:
#
#   conversion:
#     mode: remote          # or local+remote to keep children as well
#     listen: 0.0.0.0:7788  # the worker endpoint, on the workers' network only
#     insecure: true        # plain gRPC: the workers' network below is internal
#
# (or conversion.tls with a certificate, and LOOMCYCLE_WORKER_TLS_CA on the
# workers in place of LOOMCYCLE_WORKER_INSECURE; see docs/WORKERS.md)
#
# and .env.local needs LOOMCYCLE_WORKER_TOKEN, at least 32 characters
# (openssl rand -hex 32). The workers present the same token.
#
# The workers sit on an internal network: they reach the runtime's worker
# endpoint and nothing else, not the internet, not the runtime's API. They
# mount no volume; a file reaches them as bytes over the endpoint. Each has a
# hard memory limit, so a file that exhausts it kills that worker, not the
# runtime. Keep the runtime and worker images on the same release.
name: loomcycle-workers

services:
  loomcycle:
    image: denngubsky/loomcycle:1.153.0
    env_file: [.env.local]
    environment:
      LOOMCYCLE_LISTEN_ADDR: "0.0.0.0:8787"
      LOOMCYCLE_CONFIG_DIR: /config
      LOOMCYCLE_DATA_DIR: /data
    volumes:
      - ./config:/config:ro
      - loomcycle-data:/data
    ports:
      - "127.0.0.1:8787:8787"
    networks: [public, workers]
    restart: unless-stopped

  worker:
    image: denngubsky/loomcycle-worker:1.153.0
    environment:
      LOOMCYCLE_WORKER_DISPATCHER: loomcycle:7788
      LOOMCYCLE_WORKER_INSECURE: "1"
      LOOMCYCLE_WORKER_TOKEN: ${LOOMCYCLE_WORKER_TOKEN:?set it in the shell or an .env file next to this one}
    deploy:
      replicas: 2
    mem_limit: 1g
    read_only: true
    tmpfs:
      - /scratch:size=1g,mode=0700,uid=65532,gid=65532
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [workers]
    restart: unless-stopped

networks:
  public: {}
  workers:
    internal: true

volumes:
  loomcycle-data: {}

# loomcycle — docker-compose example.
#
# Usage:
#   cp docker-compose.example.yaml docker-compose.yaml
#   docker compose up -d
#
# This template gives you a single loomcycle instance with a host-
# mounted config directory + the default SQLite store. The Postgres
# upgrade path is documented below — uncomment the postgres service
# + storage env vars when you need multi-replica HA
# or just want a more robust storage backend. For a shared installation
# on Postgres from the start, examples/profiles/server is a complete set.
#
# First-run flow (do this once before `up`):
#   mkdir -p ./config
#   docker run --rm -v $(pwd)/config:/home/nonroot/.config/loomcycle \
#     denngubsky/loomcycle:1.147.0 init --no-interactive
#   # then edit ./config/loomcycle.yaml as needed
#
# Set required env vars in a sibling .env file (docker compose reads
# it automatically) — see ./config/README.md for the full list:
#   LOOMCYCLE_AUTH_TOKEN=...   # generate with: openssl rand -hex 32
#   ANTHROPIC_API_KEY=...      # at least one provider key

services:
  loomcycle:
    image: denngubsky/loomcycle:1.147.0
    container_name: loomcycle
    restart: unless-stopped
    ports:
      # HTTP+SSE API + Web UI (operator hits this from the host)
      - "127.0.0.1:8787:8787"
    volumes:
      # Operator config — distroless runs as uid 65532 (nonroot);
      # ensure the host dir is readable to that uid OR chmod 755.
      - ./config:/home/nonroot/.config/loomcycle:ro
      # SQLite store — writable to uid 65532 (nonroot). On Linux hosts:
      #   mkdir -p ./data && sudo chown -R 65532:65532 ./data
      # Without this, the container hits EACCES on the first sqlite
      # open with no diagnostic about the uid mismatch. Docker Desktop
      # on macOS hides this through its file-sharing layer; the issue
      # only surfaces in production Linux deployments.
      - ./data:/home/nonroot/.local/share/loomcycle
    environment:
      # Bearer for every /v1/* endpoint. Set in your .env file.
      LOOMCYCLE_AUTH_TOKEN: ${LOOMCYCLE_AUTH_TOKEN:?LOOMCYCLE_AUTH_TOKEN required}
      # Provider keys — set whichever you route to in your yaml.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Web-search provider keys (RFC BB) — set whichever you list under
      # search_providers: in your yaml. SearXNG (below) is keyless. See
      # docs/SEARCH.md.
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      # SERPER_API_KEY: ${SERPER_API_KEY:-}
      # EXA_API_KEY: ${EXA_API_KEY:-}
      # TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      # Bind to all interfaces inside the container so the port
      # mapping above works; the host port binds to 127.0.0.1 only.
      LOOMCYCLE_LISTEN_ADDR: "0.0.0.0:8787"
      # Where the SQLite store goes: the data mount above. Unset, it is
      # ./data under the working directory, which is not that mount.
      LOOMCYCLE_DATA_DIR: /home/nonroot/.local/share/loomcycle

  # --- Postgres backend (uncomment for v0.10.x+ Vector Memory / HA) ---
  # Any Postgres ≥ 14 works; 16 here is just a tested default.
  # postgres:
  #   image: postgres:16@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
  #   container_name: loomcycle-pg
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: loomcycle
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
  #     POSTGRES_DB: loomcycle
  #   volumes:
  #     - ./pg-data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U loomcycle -d loomcycle"]
  #     interval: 5s
  #     retries: 12
  #
  # Then on the loomcycle service above, add to `environment:`:
  #   LOOMCYCLE_PG_DSN: postgres://loomcycle:${POSTGRES_PASSWORD}@postgres:5432/loomcycle?sslmode=disable
  #   LOOMCYCLE_PG_AUTOMIGRATE: "1"
  # and to `depends_on:`:
  #   postgres:
  #     condition: service_healthy

  # --- SearXNG (uncomment for a self-hosted, keyless web-search provider) ---
  # A metasearch sidecar for the WebSearch tool (RFC BB). loomcycle reaches it
  # in-network at http://searxng:8080 — no host port needed. Requires a
  # searxng/settings.yml next to this file with THREE knobs (see docs/SEARCH.md):
  #   server: { secret_key: "<openssl rand -hex 32>", limiter: false }
  #   search: { formats: [html, json] }   # json is REQUIRED or /search 403s
  # Then add to your loomcycle.yaml:
  #   search_providers: { searxng: { base_url: "http://searxng:8080" } }
  #   search_priority: [searxng]          # or [searxng, brave] for a fallback
  # searxng:
  #   image: searxng/searxng:2026.11.9-57ff753ad@sha256:287af61f1a13e86d02974fcde91a3413a9945788de38b61ffbc491d81a19bcc2
  #   container_name: searxng
  #   restart: unless-stopped
  #   volumes:
  #     - ./searxng:/etc/searxng:rw
  #   environment:
  #     SEARXNG_BASE_URL: http://searxng:8080/
  #   # No ports: — only loomcycle needs to reach it, in-network.

  # --- workspace worker (uncomment so agents can run commands) ---
  # Agents run commands in workspaces (the Workspace tool) on a workspace worker;
  # on the container engine each workspace runs in a session container of its own
  # on the host's Docker, with no network but the runtime's egress routes. The
  # image is published from v1.171.0: run the runtime at the same release. Add to
  # your loomcycle.yaml:
  #   worker_endpoint: { listen: "0.0.0.0:7788", insecure: true }
  #   workspace: { mode: remote }
  # and LOOMCYCLE_WORKER_TOKEN (32+ characters) to the loomcycle service. The
  # worker's own token is a minted operator token with the single scope
  # workers:attach (`loomcycle operator-token create --scopes workers:attach …`),
  # set as WS_WORKER_TOKEN in .env. docs/WORKERS.md "Workspace workers" is the
  # guide; make both host directories first, owned by 65532:65532, mode 0700.
  # workspace-worker:
  #   image: denngubsky/loomcycle-ws-worker:1.171.0
  #   command: [--role, workspace, --id, ws1]   # keep the id across restarts
  #   restart: unless-stopped
  #   environment:
  #     LOOMCYCLE_WORKER_TOKEN: ${WS_WORKER_TOKEN:?WS_WORKER_TOKEN required}
  #     LOOMCYCLE_WORKER_DISPATCHER: loomcycle:7788
  #     LOOMCYCLE_WORKER_INSECURE: "1"   # plain gRPC on the compose network
  #     LOOMCYCLE_WORKSPACE_ROOT: /srv/loomcycle/workspaces
  #     LOOMCYCLE_WORKSPACE_ENGINE: container
  #     LOOMCYCLE_WORKSPACE_CONTAINER_IMAGE: denngubsky/loomcycle-workspace:1.171.0
  #     LOOMCYCLE_WORKSPACE_CONTAINER_EGRESS_DIR: /srv/loomcycle/wse
  #   group_add: ["<gid of /var/run/docker.sock>"]
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock              # host Docker control
  #     - /srv/loomcycle/workspaces:/srv/loomcycle/workspaces    # the same path inside and out
  #     - /srv/loomcycle/wse:/srv/loomcycle/wse
  #   tmpfs: ["/scratch:size=1g,mode=0700,uid=65532,gid=65532"]
  #   read_only: true
  #   cap_drop: [ALL]
  #   security_opt: ["no-new-privileges:true"]
  #   # No ports: — it dials the runtime.

# Smoke-test fixture for @loomcycle/bridge-telegram: one interactive-capable
# agent on the cost-free mock provider, and both ways the bridge can run: the
# tenant-operator principal of a token-mode bridge (it registers users and
# mints their tokens), and the external gate it becomes (RFC FA §3.5), which
# holds no loomcycle token: it signs who is talking with its own key, whose
# public half run.sh writes below. legacy_subject_prefix links each person's
# first gate login to the user the token-mode bridge made.
provider_priority: [mock]
tiers:
  middle:
    - { provider: mock, model: mock-generic }

principals:
  telegram-bridge:
    tenant: acme
    subject: telegram-bridge
    scopes: [substrate:tenant]
    token_env: LOOMCYCLE_TELEGRAM_BRIDGE_IT_TOKEN

auth:
  gates:
    telegram:
      kind: external
      public_key: __GATE_PUBLIC_JWK__
      issued_token: { ttl: 1h, agents: [helper], overrides: [interactive] }
      identity_map: { tenant: acme, provision: auto, legacy_subject_prefix: telegram- }

agents:
  helper:
    description: "Chat agent the Telegram bridge drives."
    tier: middle
    system_prompt: "You are a helpful assistant."
    tools: []

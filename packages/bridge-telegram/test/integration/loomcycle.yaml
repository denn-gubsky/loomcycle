# Smoke-test fixture for @loomcycle/bridge-telegram: one interactive-capable
# agent on the cost-free mock provider, and the bridge registered as an
# external gate (RFC FA §3.5). The bridge holds no loomcycle token: it signs
# who is talking with its own key, whose public half run.sh writes below, and
# loomcycle provisions the user and issues the token.
provider_priority: [mock]
tiers:
  middle:
    - { provider: mock, model: mock-generic }

auth:
  gates:
    telegram:
      kind: external
      public_key: __GATE_PUBLIC_JWK__
      issued_token: { ttl: 1h, agents: [helper], overrides: [interactive] }
      identity_map: { tenant: acme, provision: auto }

agents:
  helper:
    description: "Chat agent the Telegram bridge drives."
    tier: middle
    system_prompt: "You are a helpful assistant."
    tools: []

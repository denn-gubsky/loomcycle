# RFC DB-2 — the rig that ingests the synthesis corpus through the REAL
# consolidation path.
#
# Layered over `LOOMCYCLE_PRESETS=base,memory`, which supplies the provider/tier
# scaffold and the memory/extractor + memory/consolidator agents. This file adds
# only what the bench needs: the three agents `bench/cmd/locomo` drives by name,
# a pinned extractor, and an embedder.
#
# WHY NOT SEED THE FACTS DIRECTLY. RFC DB-2 requires the corpus to arrive the way
# a real corpus does — chat turns, the extractor's own reading of them, its
# mistakes included. A store seeded with the generator's ground-truth facts is a
# store nobody has, and a traversal arm measured on it would be measuring a graph
# the runtime never has to build.
#
#   createdb loomcycle_db2 && psql -d loomcycle_db2 -c 'CREATE EXTENSION vector'
#   LOOMCYCLE_PRESETS=base,memory \
#   LOOMCYCLE_STORAGE_BACKEND=postgres LOOMCYCLE_PG_AUTOMIGRATE=1 \
#   LOOMCYCLE_PGVECTOR_ENABLED=1 LOOMCYCLE_PG_DSN=... \
#   ./bin/loomcycle --config bench/synthesis/ingest.yaml

memory:
  embedder:
    provider: ollama
    model: bge-m3
    # Pinned rather than left to OLLAMA_BASE_URL: the embedder and the extractor
    # must reach the SAME host, and an env var that quietly points one of them
    # elsewhere produces a corpus embedded by one model and read by another.
    # ⚠️ A host override layer has to repin THIS TOO — moving the extractor alone
    # is exactly the split this pin exists to prevent.
    base_url: http://truenas.local:11434

# NO `models:` OVERRIDE. The extractor runs on whatever the base preset's
# local-medium glob selects — qwen3.6* — because that is what a default
# base,memory deployment resolves to, and a benchmark measured on a model nobody
# runs measures a deployment nobody has.
#
# ⚠️ One host here (the DGX at 100.112.7.68) faults on qwen3.6 with a CUDA
# illegal-memory-access on the extractor workload — short AND 29KB prompts, so
# it is not a size limit. Repin with an EXTRA --config layer on that host rather
# than editing this file:
#     models: { local-medium: { provider: ollama-local, model_pattern: "qwen3.8*" } }
#     memory: { embedder: { base_url: "http://100.112.7.68:11434" } }

agents:
  # RFC DB section 7: extraction is the only stochastic part of this benchmark,
  # so it is PINNED. An unpinned extractor is what left the extraction gate stuck
  # for weeks — the eval was measuring a coin, not a prompt.
  memory/extractor:
    sampling: { temperature: 0, seed: 7 }

  # Carries the corpus turns under -ingest-as-chats. ORCHESTRATION IS CODE: its
  # whole job is to acknowledge a turn so the transcript has an assistant side,
  # which is mechanism, not judgement — so it is `code-js` and costs no tokens.
  # A 419-turn conversation was spending ~210 paid calls per ingest to say
  # "Noted." 210 times.
  #
  # DETERMINISM IS THE REAL REASON, though. These replies become assistant turns
  # in the transcript the EXTRACTOR then reads, so a model that occasionally
  # phrases it differently edits the corpus between runs — and this benchmark's
  # premise (RFC DB section 7) is that extraction is the only stochastic part.
  # Measured before the swap: 40 of 40 replies were exactly "Noted.", so the
  # transcript is byte-identical and nothing being measured moves.
  #
  # Needs LOOMCYCLE_CODE_AGENTS_ENABLED=1; a code-js agent without it is a fatal
  # boot error.
  locomo/scribe:
    provider: code-js
    tools: []
    skills: ["-*"]
    code: |
      // The entire agent. Anything it invented would become corpus.
      function run() {
        return { final_text: "Noted." };
      }

  locomo/answerer:
    provider: deepseek
    model: deepseek-v4-flash
    max_tokens: 1200
    sampling: { temperature: 0 }
    # ⚠️ AN EXPLICIT TOOL SET, AND A LEGIBLE ONE — the two are separate problems
    # and both were measured on this store.
    #
    # Leaving `tools` unset grants every builtin, and that is not a neutral
    # default: the answerer spent calls on unrelated tools and on the wrong
    # scope, and accuracy went 0.4033 -> 0.0000 with abstention 43% -> 86%.
    # Narrowing to Memory alone recovered it.
    #
    # But narrow is not the same as correct. RFC DB's DB-4 measured an agent
    # holding a retrieval tool it was never told about: it used it 0 times in 20.
    # So the set is explicit AND the prompt renders the inventory, which is what
    # the bundled chat agents already do.
    tools: [Memory, History, Document]
    skills: ["-*"]
    # Context stays ENABLED: {{tool:Context.tools}} renders the inventory below.
    #
    # ⚠️ WITHOUT A SCOPE GRANT the Memory tool defaults to AGENT scope while every
    # consolidated fact lives in USER scope — the answerer searches an empty
    # keyspace and abstains on everything, which is indistinguishable from a real
    # memory miss and was once read as a single-hop baseline of 0 out of 120.
    # TENANT is here too because a type may DECLARE that facts about it belong in
    # the shared plane (`@memory_scope tenant`); recall takes ONE scope per call,
    # so reading both is two calls rather than a wider one.
    memory_scopes: [user, tenant]
    sql_scopes: [user, tenant]
    system_prompt: |
      You answer a question from stored memory, and only from what you retrieve.
      Never answer from what you already know: every name here is fictional, and
      a confident answer from outside memory is the error this measures.

      ## Tools
      {{tool:Context.tools}}

      {{tool:Context.guide}}

      Three things the generated list above cannot tell you:
      - `Memory op=recall` is the semantic search over remembered facts. Start
        there. Both `scope` and `query` are required, and facts live in scope
        `user` — try `tenant` as well when a question is about something shared.
      - `History op=window` opens the ORIGINAL turns a fact was distilled from.
        Reach for it when a fact is nearly an answer but drops the specific the
        question asks for — a date, a number, a name.
      - `Document op=graph_recall` starts from facts matching the question and
        FOLLOWS THE RELATIONS between the things they name. Use it when the answer
        is about something the question does not name directly — "which region
        does X work in" when X's employer, not X, carries the region. Pass
        `query`, `hops` (4 is usually enough) and `budget_chars` (1200).

      Some questions need TWO OR MORE stored facts combined. Combine them.

      Answer in one short sentence. No preamble, no reasoning shown. If memory
      does not support an answer, reply with exactly NOT_FOUND and nothing else.

  # ⚠️ The Go harness parses this reply as JSON — ParseVerdict looks for
  # {"verdict": correct|partial|wrong, "why": ...} and calls anything else
  # `unparsed`. A plain-text verdict therefore grades every substantive answer as
  # unparsed while abstentions (scored without the judge) come through as wrong,
  # which reads as 0% accuracy on a store that is answering fine.
  locomo/judge:
    provider: deepseek
    model: deepseek-v4-flash
    tools: []
    skills: ["-*"]
    disable_context: true
    max_tokens: 1000
    sampling: { temperature: 0 }
    system_prompt: |
      You grade one ANSWER against the GOLD answer for a QUESTION.

      Your ENTIRE reply is one JSON object and nothing else — no prose, no code
      fences:
      {"verdict": "correct", "why": "one short sentence"}

      verdict is exactly one of: correct, partial, wrong.
        correct — names the gold value, in any wording; extra true detail is fine.
        partial — names part of it, or hedges toward it without committing.
        wrong   — names something else, or refuses when the gold is answerable.

      Grade on MEANING, not wording. A date, city, organisation or name expressed
      differently but identifying the same thing is correct.

# RFC DQ P3 — the shipped decision reranker, measured through the built feature on
# phase M's ConditionalQA header store (rebuilt). Two agents over the same store:
#   cqa/search     Document op=search, no rerank
#   cqa/search-rr  the same search with memory_rerank on → memory.reranker below
# The embedder and the decision model both run on the Spark's Ollama (OLLAMA_BASE_URL).
models:
  local-embedding: { provider: ollama-local, model: bge-m3:latest }
memory:
  embedder: { model: local-embedding }
  reranker: { kind: decision, provider: ollama-local, model: nimble, timeout_ms: 120000 }

x-search: &search
  provider: code-js
  tools: [Document]
  skills: ["-*"]
  memory_scopes: [user]
  sql_scopes: [user]
  code: |
    function run(input) {
      var r = JSON.parse(Document({ op: "search", scope: "user", query: input.prompt, limit: 10 }));
      return { final_text: JSON.stringify(r) };
    }

agents:
  cqa/writer:
    provider: code-js
    tools: [Document]
    skills: ["-*"]
    memory_scopes: [user]
    sql_scopes: [user]
    code: |
      function run(input) {
        return { final_text: Document(JSON.parse(input.prompt)) };
      }
  cqa/search:
    <<: *search
  cqa/search-rr:
    <<: *search
    memory_rerank: { enabled: true }      # the shipped defaults: 20 candidates x 1,200 chars

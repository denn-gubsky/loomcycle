      //
      // REPLAY. This body re-executes from the top on every loop turn, fast-forwarding
      // the tool results already recorded. It must be a pure function of those
      // results: no clock, no randomness.

      var CONFIG = {
        annotate_agent: "kb/annotate",
        // The version of the request template and of kb/annotate's prompt, per
        // annotation level (branch = a section, document, path = a folder). It is
        // part of every annotation's hash: raising one level's version makes that
        // level's annotations stale and leaves the other levels alone. A new level
        // gets its own entry here.
        // 2: a section's request names its document and the document's identity,
        // and the prompt allows a code only where the request carries it.
        // scheme, concept, class: the nodes of the confirmed taxonomies, from 1.
        prompt_versions: { branch: 2, document: 2, path: 2, scheme: 1, concept: 1, class: 1 },
        lease_name: "annotator",
        lease_ttl_ms: 900000,
        lease_renew_every: 10,
        ingest_channel: "documents/ingested",
        queue_page: 50,
        queue_scan_max: 1000,
        sweep_max_documents: 1000,
        max_report_ids: 50,
        // The nodes without an annotation that report lists by name.
        max_report_nodes: 500,
        max_title_chars: 300,
        max_brief_chars: 240,
        max_abstract_chars: 2000,
        // Characters of a reply's prompt that are the system prompt, counted into the
        // estimate (its length, rounded up).
        system_prompt_chars: 2400,
        // Parts of a Path tree that hold entities and memory, not documents to annotate.
        skip_path_prefixes: ["/facts/", "/memory/"]
